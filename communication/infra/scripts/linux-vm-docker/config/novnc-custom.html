<!DOCTYPE html>
<html>
<head>
    <title>Desktop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        /* Loading overlay */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Connecting to desktop...</div>
    </div>
    <iframe id="vnc" src=""></iframe>
    <script>
        (function() {
            const iframe = document.getElementById('vnc');
            const loading = document.getElementById('loading');
            
            // Build VNC URL with parameters
            const params = new URLSearchParams(window.location.search);
            
            // Set default parameters for better UX
            params.set('resize', 'scale');       // Scale to fit window
            params.set('autoconnect', '1');      // Auto-connect on load
            params.set('reconnect', '1');        // Auto-reconnect on disconnect
            params.set('reconnect_delay', '1000'); // 1 second reconnect delay
            params.set('show_dot', '1');         // Show dot cursor
            params.set('view_only', '0');        // Allow control
            
            // Load the actual noVNC client
            iframe.src = 'vnc.html?' + params.toString();
            
            // Hide loading when iframe loads
            iframe.onload = function() {
                // Small delay to ensure VNC is rendered
                setTimeout(function() {
                    loading.classList.add('hidden');
                    
                    // Inject CSS to hide noVNC controls and cursor
                    try {
                        const doc = iframe.contentDocument;
                        if (doc) {
                            const style = doc.createElement('style');
                            style.textContent = [
                                // Hide control bar and related elements
                                '#noVNC_control_bar,',
                                '#noVNC_control_bar_anchor,',
                                '#noVNC_control_bar_handle,',
                                '#noVNC_logo,',
                                '#noVNC_status,',
                                '#noVNC_transition {',
                                '    display: none !important;',
                                '}',
                                '',
                                '/* Hide the remote cursor overlay - use local cursor only */',
                                '.noVNC_cursor {',
                                '    display: none !important;',
                                '}',
                                '',
                                '/* Ensure canvas fills the viewport */',
                                '#noVNC_container {',
                                '    width: 100vw !important;',
                                '    height: 100vh !important;',
                                '}',
                                '',
                                '/* Remove any body margins */',
                                'body {',
                                '    margin: 0 !important;',
                                '    padding: 0 !important;',
                                '    overflow: hidden !important;',
                                '}'
                            ].join('\n');
                            doc.head.appendChild(style);
                        }
                    } catch (e) {
                        // Cross-origin restriction - styles won't be injected
                        console.warn('Could not inject CSS (cross-origin):', e);
                    }
                }, 500);
            };
            
            // Handle errors
            iframe.onerror = function() {
                loading.querySelector('.loading-text').textContent = 'Failed to connect. Retrying...';
                setTimeout(function() {
                    iframe.src = iframe.src;
                }, 2000);
            };
        })();
    </script>
</body>
</html>
