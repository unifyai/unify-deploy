[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# =============================================================================
# TigerVNC Server (Xvnc)
# Provides the X11 display and VNC server on port 5901 (display :1)
# =============================================================================
[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry %(ENV_VNC_GEOMETRY)s -depth %(ENV_VNC_DEPTH)s -SecurityTypes VncAuth -PasswordFile /root/.vnc/passwd -AlwaysShared -AcceptKeyEvents -AcceptPointerEvents -AcceptSetDesktopSize -SendCutText -AcceptCutText
environment=HOME="/root"
autorestart=true
priority=10
startsecs=2
startretries=3
stdout_logfile=/var/log/supervisor/xvnc.log
stderr_logfile=/var/log/supervisor/xvnc.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# =============================================================================
# XFCE4 Desktop Session
# Starts after VNC server is running
# =============================================================================
[program:xfce]
command=/usr/bin/startxfce4
environment=DISPLAY=":1",HOME="/root",DBUS_SESSION_BUS_ADDRESS="autolaunch:"
autorestart=true
priority=20
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/xfce.log
stderr_logfile=/var/log/supervisor/xfce.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# =============================================================================
# websockify (noVNC bridge)
# Bridges WebSocket connections to VNC port
# Serves noVNC web client on port 6080
# =============================================================================
[program:websockify]
command=/usr/local/bin/websockify --web=/novnc 6080 localhost:5901
autorestart=true
priority=30
startsecs=2
startretries=3
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# =============================================================================
# Agent Service
# Node.js API server on port 3000
# =============================================================================
[program:agent-service]
command=/usr/bin/npx ts-node src/index.ts
directory=/agent-service
environment=NODE_ENV="production",DISPLAY=":1",HOME="/root"
autorestart=true
priority=40
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/agent-service.log
stderr_logfile=/var/log/supervisor/agent-service.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# =============================================================================
# Caddy Reverse Proxy
# HTTPS termination and routing (only runs if Caddyfile is configured)
# =============================================================================
[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
autorestart=true
priority=50
startsecs=2
startretries=3
stdout_logfile=/var/log/supervisor/caddy.log
stderr_logfile=/var/log/supervisor/caddy.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# =============================================================================
# Process Groups
# =============================================================================
[group:desktop]
programs=xvnc,xfce,websockify
priority=10

[group:services]
programs=agent-service,caddy
priority=20
