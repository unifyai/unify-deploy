# Kamailio TLS Configuration
# Microsoft Teams Direct Routing compatible

[server:default]
method = TLSv1.2
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/server.key
certificate = /etc/kamailio/tls/server.pem
cipher_list = ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:AES256-GCM-SHA384:AES128-GCM-SHA256

[client:default]
method = TLSv1.2
verify_certificate = yes
require_certificate = no
ca_list = /etc/ssl/certs/ca-certificates.crt
cipher_list = ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:AES256-GCM-SHA384:AES128-GCM-SHA256

# Specific client config for Microsoft
[client:sip.pstnhub.microsoft.com:5061]
method = TLSv1.2
verify_certificate = yes
ca_list = /etc/ssl/certs/ca-certificates.crt
cipher_list = ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-GCM-SHA256
