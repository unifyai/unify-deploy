#!KAMAILIO
#
# Kamailio SBC Configuration
# Routes SIP from Microsoft Teams to LiveKit
#
# This is a minimal proxy configuration - it only handles SIP signaling.
# Audio (RTP) flows directly between Teams and LiveKit.
#

####### Global Parameters #########

# Set to your SBC domain (must match what's verified in M365)
#!substdef "!MY_DOMAIN!sbc.unify.ai!g"

# Set to your LiveKit SIP endpoint
#!substdef "!LIVEKIT_SIP!a1vhpufswgi.sip.livekit.cloud!g"
#!substdef "!LIVEKIT_PORT!5060!g"

# Debug level (3 = info, 4 = debug)
debug=3
log_stderror=yes

# Fork to background (no for Docker, yes for systemd)
fork=no

# Memory
memdbg=5
memlog=5
children=4

# Ports
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tls:0.0.0.0:5061

# TLS settings (update paths after getting certificates)
#!ifdef WITH_TLS
tls_certificate="/etc/kamailio/tls/server.pem"
tls_private_key="/etc/kamailio/tls/server.key"
tls_ca_list="/etc/kamailio/tls/ca.pem"
#!endif

# Aliases
alias=MY_DOMAIN

####### Modules Section ########

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "path.so"

#!ifdef WITH_TLS
loadmodule "tls.so"
#!endif

####### Module Parameters ########

# Record-Route for proxying
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

# TLS parameters
#!ifdef WITH_TLS
modparam("tls", "config", "/etc/kamailio/tls.cfg")
#!endif

####### Routing Logic ########

# Main request routing
request_route {
    # Log incoming request
    xlog("L_INFO", "=== Incoming $rm from $fu to $ru ($si:$sp) ===\n");
    
    # Max forwards check
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    
    # Sanity check
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        exit;
    }
    
    # Handle CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    
    # Handle retransmissions
    if (!is_method("ACK")) {
        if (t_check_trans()) {
            exit;
        }
    }
    
    # Handle requests within dialog (sequential requests)
    if (has_totag()) {
        if (loose_route()) {
            xlog("L_INFO", "In-dialog $rm - loose routing\n");
            route(RELAY);
            exit;
        }
        
        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }
            exit;
        }
        
        sl_send_reply("404", "Not Found");
        exit;
    }
    
    # Record route for dialog
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }
    
    # Handle OPTIONS (keepalive from Teams)
    if (is_method("OPTIONS")) {
        xlog("L_INFO", "OPTIONS request - responding 200 OK\n");
        sl_send_reply("200", "OK");
        exit;
    }
    
    # Handle REGISTER (not needed for this use case, reject)
    if (is_method("REGISTER")) {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    
    # Route INVITE to LiveKit
    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE from $fu - routing to LiveKit\n");
        route(TO_LIVEKIT);
        exit;
    }
    
    # Other requests - try to relay
    route(RELAY);
}

# Route to LiveKit
route[TO_LIVEKIT] {
    xlog("L_INFO", "Routing to LiveKit: sip:$rU@LIVEKIT_SIP:LIVEKIT_PORT\n");
    
    # Rewrite destination to LiveKit
    $ru = "sip:" + $rU + "@LIVEKIT_SIP:LIVEKIT_PORT";
    
    # Add custom headers if needed
    # append_hf("X-Forwarded-For: $si\r\n");
    
    route(RELAY);
}

# Generic relay route
route[RELAY] {
    xlog("L_INFO", "Relaying $rm to $ru\n");
    
    # Set failure route
    t_on_failure("FAIL");
    
    # Relay the request
    if (!t_relay()) {
        xlog("L_ERR", "Relay failed for $rm to $ru\n");
        sl_reply_error();
    }
    exit;
}

# Failure handling
failure_route[FAIL] {
    xlog("L_WARN", "Failure route triggered for $rm\n");
    
    if (t_is_canceled()) {
        exit;
    }
}

# Reply handling
onreply_route {
    xlog("L_INFO", "=== Reply $rs for $rm ===\n");
}
