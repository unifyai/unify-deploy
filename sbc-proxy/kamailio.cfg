#!KAMAILIO
#
# Kamailio SBC Configuration
# Routes SIP from Microsoft Teams to LiveKit
#
# This is a minimal proxy configuration - it only handles SIP signaling.
# Audio (RTP) flows directly between Teams and LiveKit.
#

# Enable TLS for Teams (REQUIRED - Teams only connects via TLS)
#!define WITH_TLS

####### Global Parameters #########

# Set to your SBC domain (must match what's verified in M365)
#!substdef "!MY_DOMAIN!sbc.unify.ai!g"

# Set to your LiveKit SIP endpoint
#!substdef "!LIVEKIT_SIP!a1vhpufswgi.sip.livekit.cloud!g"
#!substdef "!LIVEKIT_PORT!5060!g"

# Microsoft Teams SIP Proxy (for OPTIONS keepalive)
#!substdef "!MS_SIP_PROXY!sip.pstnhub.microsoft.com!g"
#!substdef "!MS_SIP_PORT!5061!g"

# Webhook URL is built from UNITY_ADAPTERS_URL environment variable
# e.g., UNITY_ADAPTERS_URL=https://adapters.unify.ai -> https://adapters.unify.ai/teams/call

# Debug level (3 = info, 4 = debug)
debug=3
log_stderror=yes

# Fork to background (no for Docker, yes for systemd)
fork=no

# Memory
memdbg=5
memlog=5
children=4

# Ports
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tls:0.0.0.0:5061

# Enable TLS (required for Teams)
enable_tls=1

# Aliases
alias=MY_DOMAIN

####### Modules Section ########

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "path.so"
loadmodule "rtimer.so"
loadmodule "uac.so"
loadmodule "http_client.so"

#!ifdef WITH_TLS
loadmodule "tls.so"
#!endif

####### Module Parameters ########

# Record-Route for proxying
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

# TLS parameters
#!ifdef WITH_TLS
modparam("tls", "config", "/etc/kamailio/tls.cfg")
#!endif

# UAC module - for generating outbound requests
modparam("uac", "reg_contact_addr", "sbc.unify.ai:5061")

# Timer for sending SIP OPTIONS to Microsoft every 60 seconds
modparam("rtimer", "timer", "name=ms_options;interval=60;mode=1;")
modparam("rtimer", "exec", "timer=ms_options;route=SEND_MS_OPTIONS")

# HTTP client parameters for webhook calls
modparam("http_client", "connection_timeout", 2000)

####### Routing Logic ########

# Main request routing
request_route {
    # Log incoming request
    xlog("L_INFO", "=== Incoming $rm from $fu to $ru ($si:$sp) ===\n");
    
    # Max forwards check
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    
    # Sanity check
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        exit;
    }
    
    # Handle CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    
    # Handle retransmissions
    if (!is_method("ACK")) {
        if (t_check_trans()) {
            exit;
        }
    }
    
    # Handle requests within dialog (sequential requests)
    if (has_totag()) {
        if (loose_route()) {
            xlog("L_INFO", "In-dialog $rm - loose routing\n");
            route(RELAY);
            exit;
        }
        
        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }
            exit;
        }
        
        sl_send_reply("404", "Not Found");
        exit;
    }
    
    # Record route for dialog
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }
    
    # Handle OPTIONS (keepalive from Teams)
    if (is_method("OPTIONS")) {
        xlog("L_INFO", "OPTIONS request - responding 200 OK\n");
        sl_send_reply("200", "OK");
        exit;
    }
    
    # Handle REGISTER (not needed for this use case, reject)
    if (is_method("REGISTER")) {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    
    # Route INVITE to LiveKit
    if (is_method("INVITE")) {
        # Only accept INVITEs from Microsoft Teams IP ranges
        # Microsoft publishes these at: https://learn.microsoft.com/en-us/microsoft-365/enterprise/urls-and-ip-address-ranges
        # Key ranges: 52.112.0.0/14, 52.120.0.0/14
        if (!($si =~ "^52\.11[2-5]\." || $si =~ "^52\.12[0-3]\.")) {
            xlog("L_WARN", "INVITE from non-Microsoft IP $si - rejecting\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }

        xlog("L_INFO", "INVITE from $fu - routing to LiveKit\n");
        route(TO_LIVEKIT);
        exit;
    }
    
    # Other requests - try to relay
    route(RELAY);
}

# Route to LiveKit
route[TO_LIVEKIT] {
    xlog("L_INFO", "Routing to LiveKit: sip:$rU@LIVEKIT_SIP:LIVEKIT_PORT\n");
    
    # Call webhook to notify about incoming Teams call
    # This triggers agent dispatch via Pub/Sub
    route(NOTIFY_WEBHOOK);

    # Rewrite destination to LiveKit
    $ru = "sip:" + $rU + "@LIVEKIT_SIP:LIVEKIT_PORT";
    
    # Add custom headers if needed
    # append_hf("X-Forwarded-For: $si\r\n");
    
    route(RELAY);
}

# Notify webhook about incoming call (for agent dispatch)
route[NOTIFY_WEBHOOK] {
    # Build webhook URL from environment variable
    $var(webhook_url) = $env(UNITY_ADAPTERS_URL) + "/teams/call";

    # Build JSON payload with call details
    $var(json_body) = "{\"from_uri\":\"" + $fu + "\",\"to_uri\":\"" + $ru + "\",\"call_id\":\"" + $ci + "\",\"source_ip\":\"" + $si + "\"}";

    xlog("L_INFO", "Calling webhook $var(webhook_url) with payload: $var(json_body)\n");

    # Make HTTP POST to webhook
    $var(res) = http_client_query("$var(webhook_url)", "$var(json_body)", "application/json", "$var(result)");

    if ($var(res) == 200) {
        xlog("L_INFO", "Webhook responded: $var(result)\n");
    } else if ($var(res) < 0) {
        xlog("L_WARN", "Webhook call failed (connection error): $var(res)\n");
        # Continue anyway - don't block the call
    } else {
        xlog("L_WARN", "Webhook returned status: $var(res)\n");
        # Continue anyway - don't block the call
    }
}

# Generic relay route
route[RELAY] {
    xlog("L_INFO", "Relaying $rm to $ru\n");
    
    # Set failure route
    t_on_failure("FAIL");
    
    # Relay the request
    if (!t_relay()) {
        xlog("L_ERR", "Relay failed for $rm to $ru\n");
        sl_reply_error();
    }
    exit;
}

# Failure handling
failure_route[FAIL] {
    xlog("L_WARN", "Failure route triggered for $rm\n");
    
    if (t_is_canceled()) {
        exit;
    }
}

# Reply handling
onreply_route {
    xlog("L_INFO", "=== Reply $rs for $rm ===\n");
}

# Route to send SIP OPTIONS to Microsoft Teams SIP Proxy
# This is called every 60 seconds by the rtimer module
route[SEND_MS_OPTIONS] {
    xlog("L_INFO", "=== Sending SIP OPTIONS to Microsoft Teams ===\n");
    
    # Set up the OPTIONS request using uac module
    # Request URI - Microsoft's SIP proxy over TLS
    $uac_req(method) = "OPTIONS";
    $uac_req(ruri) = "sip:MS_SIP_PROXY:MS_SIP_PORT;transport=tls";
    $uac_req(furi) = "sip:MY_DOMAIN";
    $uac_req(turi) = "sip:MS_SIP_PROXY";
    $uac_req(callid) = "ms-options-" + $Ts + "@MY_DOMAIN";
    
    # CRITICAL: Contact header must match our SBC FQDN
    $uac_req(hdrs) = "Contact: <sip:MY_DOMAIN;transport=tls>\r\n"
        + "User-Agent: Kamailio-SBC/1.0\r\n"
        + "Accept: application/sdp, text/plain\r\n";
    
    # Send the request and handle response in event route
    $uac_req(evroute) = 1;
    
    if (uac_req_send()) {
        xlog("L_INFO", "=== SIP OPTIONS sent to sip.pstnhub.microsoft.com:5061 ===\n");
    } else {
        xlog("L_ERR", "=== FAILED to send SIP OPTIONS to Microsoft ===\n");
    }
}

# Event route for handling response to our OPTIONS
event_route[uac:reply] {
    xlog("L_INFO", "=== Microsoft OPTIONS response: $uac_req(evcode) $uac_req(evtype) ===\n");
    if ($uac_req(evtype) == 1) {
        # Got a reply
        xlog("L_INFO", "Microsoft replied with status code: $uac_req(evcode)\n");
    } else if ($uac_req(evtype) == 2) {
        # Timeout
        xlog("L_WARN", "Microsoft OPTIONS request timed out\n");
    } else {
        # Error
        xlog("L_ERR", "Microsoft OPTIONS request error\n");
    }
}
