steps:
  # Pull previous image for Docker layer cache
- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest || true

  # Build Docker Image with BuildKit inline cache
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    UNITY_SHA=$$(git ls-remote https://github.com/unifyai/unity.git refs/heads/main | awk '{print $$1}')
    echo "Cache-busting unity layer with UNITY_SHA=$$UNITY_SHA"
    DOCKER_BUILDKIT=1 docker build -f Dockerfile-adapters \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      --build-arg BRANCH_NAME=main \
      --build-arg UNITY_SHA=$$UNITY_SHA \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest .
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['pull-cache']

  # Push Docker Image (SHA Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}']
  waitFor: ['build-image']

  # Push Docker Image (Latest Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest']
  waitFor: ['build-image']

  # Pause legacy infra schedulers before updating the unified maintenance job
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'pause-legacy-infra-schedulers'
  entrypoint: bash
  args:
  - '-c'
  - |
    for job in jobs-create jobs-cleanup stale-jobs-expire \
               pending-startups pending-vm-assignments; do
      gcloud scheduler jobs pause "$job" --location="${_REGION}" 2>/dev/null \
        && echo "Paused legacy scheduler: $job" \
        || echo "Legacy scheduler $job already paused, removed, or not found"
    done
  waitFor: ['push-sha-tag']

  # Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - '${_SERVICE_NAME}'
  - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '--region=${_REGION}'
  - '--platform=managed'
  - '--allow-unauthenticated'
  - '--min-instances=1'
  - '--max-instances=100'
  - '--concurrency=80'
  - '--memory=2Gi'
  - '--cpu=1'
  - '--timeout=300'
  - '--cpu-boost'
  - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},UNITY_MIN_IDLE_JOBS=3,UNITY_IDLE_JOB_DEMAND_FACTOR=4,DEPLOY_ENV=production,UNITY_COORDINATOR_EMAIL_ADDRESS=${_UNITY_COORDINATOR_EMAIL_ADDRESS},PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc'
  - '--service-account=comm-sa@${PROJECT_ID}.iam.gserviceaccount.com'
  - '--set-secrets=ORCHESTRA_ADMIN_KEY=ORCHESTRA_ADMIN_KEY:latest,SHARED_UNIFY_KEY=SHARED_UNIFY_KEY:latest,GCP_SA_KEY=gcp-sa-key:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,LIVEKIT_SIP_URI=LIVEKIT_SIP_URI:latest,LIVEKIT_URL=LIVEKIT_URL:latest,LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,UNITY_ADAPTERS_URL=UNITY_ADAPTERS_URL_PRODUCTION:latest,ASSISTANT_MESSAGE_ATTACHMENTS_BUCKET_NAME=ASSISTANT_MESSAGE_ATTACHMENTS_BUCKET_NAME_PRODUCTION:latest,OUTLOOK_WEBHOOK_SECRET=OUTLOOK_WEBHOOK_SECRET:latest,TEAMS_WEBHOOK_SECRET=TEAMS_WEBHOOK_SECRET:latest,TWILIO_WA_AUTH_TOKEN=TWILIO_WA_AUTH_TOKEN:latest,TWILIO_WA_ACCOUNT_SID=TWILIO_WA_ACCOUNT_SID:latest,OAUTH_STATE_SIGNING_KEY=OAUTH_STATE_SIGNING_KEY:latest,MS365_ADMIN_TENANT_ID=MS365_ADMIN_TENANT_ID:latest,MS365_ADMIN_CLIENT_ID=MS365_ADMIN_CLIENT_ID:latest,MS365_ADMIN_CLIENT_SECRET=MS365_ADMIN_CLIENT_SECRET:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,MS365_BYOD_CLIENT_ID=MS365_BYOD_CLIENT_ID:latest,MS365_BYOD_CLIENT_SECRET=MS365_BYOD_CLIENT_SECRET:latest,SLACK_SIGNING_SECRET=SLACK_SIGNING_SECRET_PROD:latest'
  waitFor: ['push-sha-tag', 'pause-legacy-infra-schedulers']

  # Update Cloud Scheduler: Email Watches
  # 00:10 UTC daily.  Offset from the 00:00 spike (microsoft-tokens,
  # google-token-refresh, infra-maintenance all fire at :00) so the
  # Outlook branch reads a freshly-refreshed MICROSOFT_ACCESS_TOKEN.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-email-watches'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "email-watches" \
      --schedule "10 0 * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/email-watches" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "email-watches" \
      --schedule "10 0 * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/email-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Infra Maintenance
  # Unified sweep: pool replenish + cleanup + stale-job expiry +
  # orphaned-VM reconciliation + quarantined-VM purge.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-infra-maintenance'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "infra-maintenance" \
      --uri "$${CLOUD_RUN_URL}/scheduled/infra/maintenance" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "infra-maintenance" \
      --schedule "0 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/infra/maintenance" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Remove legacy infra schedulers (replaced by infra-maintenance)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'remove-legacy-infra-schedulers'
  entrypoint: bash
  args:
  - '-c'
  - |
    for job in jobs-create jobs-cleanup stale-jobs-expire \
               pending-startups pending-vm-assignments; do
      gcloud scheduler jobs delete "$job" --location="${_REGION}" --quiet 2>/dev/null \
        && echo "Deleted legacy scheduler: $job" \
        || echo "Legacy scheduler $job already removed or not found"
    done
  waitFor: ['update-scheduler-infra-maintenance']

  # Remove legacy pending PubSub topics (replaced by AssistantSession CRD phases)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'remove-legacy-pending-pubsub'
  entrypoint: bash
  args:
  - '-c'
  - |
    for topic in unity-pending-startups unity-pending-vm-assignments unity-startup; do
      gcloud pubsub topics delete "$topic" --project="${PROJECT_ID}" --quiet 2>/dev/null \
        && echo "Deleted legacy topic: $topic" \
        || echo "Legacy topic $topic already removed or not found"
    done
  waitFor: ['remove-legacy-infra-schedulers']

  # Update Cloud Scheduler: Microsoft Token Refresh
  # :00 and :30 every hour.  Sole writer of MICROSOFT_ACCESS_TOKEN;
  # readers (teams-watches, email-watches) are scheduled to land
  # AFTER this tick so they always read a freshly-rotated token.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-microsoft-tokens'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "microsoft-tokens" \
      --schedule "*/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/microsoft-tokens" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "microsoft-tokens" \
      --schedule "*/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/microsoft-tokens" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Google Token Refresh
  # :05 and :35 every hour.  Offset +5m from microsoft-tokens to
  # avoid dual-writer contention on Orchestra secret writes and
  # refresh-token rotation races.  Access tokens live ~1h.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-google-tokens'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "google-token-refresh" \
      --schedule "5-59/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/google-tokens" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "google-token-refresh" \
      --schedule "5-59/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/google-tokens" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Teams Chat Watches
  # :10 and :40 every hour (subscriptions expire in 60 mins).
  # 10-min offset after microsoft-tokens (:00, :30) so the renewal
  # loop always reads a freshly-rotated MICROSOFT_ACCESS_TOKEN.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-teams-watches'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "teams-watches" \
      --schedule "10-59/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/teams-watches" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "teams-watches" \
      --schedule "10-59/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/teams-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Cert Renewal
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-cert-renewal'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "cert-renewal" \
      --uri "$${CLOUD_RUN_URL}/scheduled/cert-renewal" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "cert-renewal" \
      --schedule "0 3 1 * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/cert-renewal" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

# Options
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

# Substitution variables
substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity-adapters-repo'
  _SERVICE_NAME: 'unity-adapters'
  # Shared coordinator mailbox for this environment. Must match
  # UNITY_COORDINATOR_EMAIL_ADDRESS_PRODUCTION in Orchestra so the shared
  # coordinator mailbox watch is registered on the right inbox and inbound
  # replies are recognized as shared-coordinator traffic.
  _UNITY_COORDINATOR_EMAIL_ADDRESS: 'twin@unify.ai'

# Secrets from Secret Manager
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
    env: 'GITHUB_TOKEN'
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_ADMIN_KEY/versions/latest
    env: 'ORCHESTRA_ADMIN_KEY'

# Timeout
timeout: '1200s'

# Images to be pushed
images:
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
