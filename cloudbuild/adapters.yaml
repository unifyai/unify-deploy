steps:
  # Twilio WhatsApp Webhook
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Twilio WhatsApp Webhook"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "twilio-whatsapp-webhook" \
          --gen2 \
          --region="us-central1" \
          --runtime=python311 \
          --source="adapters" \
          --entry-point=twilio_whatsapp_webhook \
          --trigger-http \
          --allow-unauthenticated \
          --set-env-vars=PROJECT_ID=$PROJECT_ID \
          --timeout=300 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=100 \
          --concurrency=80

  # Twilio Message Webhook
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Twilio Message Webhook"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "twilio-msg-webhook" \
          --gen2 \
          --region="us-central1" \
          --runtime=python311 \
          --source="adapters" \
          --entry-point=twilio_msg_webhook \
          --trigger-http \
          --allow-unauthenticated \
          --set-env-vars=PROJECT_ID=$PROJECT_ID \
          --timeout=300 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=100 \
          --concurrency=80

  # Twilio Call Webhook
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Twilio Call Webhook"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "twilio-call-webhook" \
          --gen2 \
          --region="us-central1" \
          --runtime=python311 \
          --source="adapters" \
          --entry-point=twilio_call_webhook \
          --trigger-http \
          --allow-unauthenticated \
          --set-env-vars=PROJECT_ID=$PROJECT_ID \
          --timeout=300 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=100 \
          --concurrency=80

  # Email Notification Processor
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Email Notification Processor"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "email-notification-processor" \
          --gen2 \
          --region="us-central1" \
          --runtime=python311 \
          --source="adapters" \
          --entry-point=email_notification_processor \
          --trigger-topic=email-notifications \
          --allow-unauthenticated \
          --set-env-vars=PROJECT_ID=$PROJECT_ID \
          --timeout=300 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=100 \
          --concurrency=80

  # Email Watch Renewer
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Email Watch Renewer"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "email-watch-renewer" \
          --gen2 \
          --region="us-central1" \
          --runtime=python311 \
          --source="adapters" \
          --entry-point=email_watch_renewer \
          --trigger-http \
          --allow-unauthenticated \
          --timeout=300 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=100 \
          --concurrency=80

  # Create/Update Email Watch Renewer Scheduler
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Create/Update Email Watch Renewer Scheduler"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud scheduler jobs create http "email-watch-renewer" \
          --schedule "0 0 * * *" \
          --uri "https://us-central1-$PROJECT_ID.cloudfunctions.net/email-watch-renewer" \
          --http-method POST \
          --time-zone "UTC" \
          --location="us-central1" \
        || \
        gcloud scheduler jobs update http "email-watch-renewer" \
          --schedule "0 0 * * *" \
          --uri "https://us-central1-$PROJECT_ID.cloudfunctions.net/email-watch-renewer" \
          --http-method POST \
          --time-zone "UTC" \
          --location="us-central1"

  # Idle Job Creator
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Idle Job Creator"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "idle-job-creator" \
          --gen2 \
          --region="us-central1" \
          --runtime=python311 \
          --source="adapters" \
          --entry-point=create_idle_job \
          --trigger-http \
          --allow-unauthenticated \
          --timeout=300 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=100 \
          --concurrency=80

  # Create/Update Idle Job Creator Scheduler
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Create/Update Idle Job Creator Scheduler"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud scheduler jobs create http "idle-job-creator" \
          --schedule "0 * * * *" \
          --uri "https://us-central1-$PROJECT_ID.cloudfunctions.net/idle-job-creator" \
          --http-method POST \
          --time-zone "UTC" \
          --location="us-central1" \
        || \
        gcloud scheduler jobs update http "idle-job-creator" \
          --schedule "0 * * * *" \
          --uri "https://us-central1-$PROJECT_ID.cloudfunctions.net/idle-job-creator" \
          --http-method POST \
          --time-zone "UTC" \
          --location="us-central1"

  # Idle Job Cleaner
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Idle Job Cleaner"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "idle-job-cleaner" \
          --gen2 \
          --region="us-central1" \
          --runtime=python311 \
          --source="adapters" \
          --entry-point=clean_idle_jobs \
          --trigger-http \
          --allow-unauthenticated \
          --timeout=300 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=100 \
          --concurrency=80

  # Create/Update Idle Job Cleaner Scheduler
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Create/Update Idle Job Cleaner Scheduler"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud scheduler jobs create http "idle-job-cleaner" \
          --schedule "10 * * * *" \
          --uri "https://us-central1-$PROJECT_ID.cloudfunctions.net/idle-job-cleaner" \
          --http-method POST \
          --time-zone "UTC" \
          --location="us-central1" \
        || \
        gcloud scheduler jobs update http "idle-job-cleaner" \
          --schedule "10 * * * *" \
          --uri "https://us-central1-$PROJECT_ID.cloudfunctions.net/idle-job-cleaner" \
          --http-method POST \
          --time-zone "UTC" \
          --location="us-central1"

timeout: "3600s"
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
