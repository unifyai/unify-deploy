steps:
  # Build Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  args:
  - 'build'
  - '-f'
  - 'Dockerfile-adapters'
  - '-t'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '-t'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
  - '.'

  # Push Docker Image (SHA Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}']
  waitFor: ['build-image']

  # Push Docker Image (Latest Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest']
  waitFor: ['build-image']

  # Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - '${_SERVICE_NAME}'
  - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '--region=${_REGION}'
  - '--platform=managed'
  - '--allow-unauthenticated'
  - '--min-instances=1'
  - '--max-instances=100'
  - '--concurrency=80'
  - '--memory=512Mi'
  - '--cpu=1'
  - '--timeout=300'
  - '--cpu-boost'
  - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},UNITY_MIN_IDLE_JOBS=3,UNITY_IDLE_JOB_DEMAND_FACTOR=4'
  waitFor: ['push-sha-tag']

  # Update Cloud Scheduler: Email Watches
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-email-watches'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    gcloud scheduler jobs update http "email-watches" \
      --uri "$${CLOUD_RUN_URL}/scheduled/email-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "email-watches" \
      --schedule "0 0 * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/email-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Jobs Create
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-jobs-create'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    gcloud scheduler jobs update http "jobs-create" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/create?refresh=true" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "jobs-create" \
      --schedule "0 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/create?refresh=true" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --time-zone "UTC" \
      --location="${_REGION}"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Jobs Cleanup
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-jobs-cleanup'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    gcloud scheduler jobs update http "jobs-cleanup" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/cleanup" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "jobs-cleanup" \
      --schedule "10 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/cleanup" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --time-zone "UTC" \
      --location="${_REGION}"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Stale Jobs Expire
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-stale-jobs-expire'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    gcloud scheduler jobs update http "stale-jobs-expire" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/expire-stale" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "stale-jobs-expire" \
      --schedule "0 1 * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/expire-stale" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --time-zone "UTC" \
      --location="${_REGION}"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Microsoft Token Refresh
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-microsoft-tokens'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    gcloud scheduler jobs update http "microsoft-tokens" \
      --uri "$${CLOUD_RUN_URL}/scheduled/microsoft-tokens" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "microsoft-tokens" \
      --schedule "*/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/microsoft-tokens" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Teams Chat Watches (runs every 30 mins - subscriptions expire in 60 mins)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-teams-watches'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    gcloud scheduler jobs update http "teams-watches" \
      --uri "$${CLOUD_RUN_URL}/scheduled/teams-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "teams-watches" \
      --schedule "*/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/teams-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Cert Renewal
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-cert-renewal'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    gcloud scheduler jobs update http "cert-renewal" \
      --uri "$${CLOUD_RUN_URL}/scheduled/cert-renewal" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "cert-renewal" \
      --schedule "0 3 1 * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/cert-renewal" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
  waitFor: ['deploy']

# Options
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

# Substitution variables
substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity-adapters-repo'
  _SERVICE_NAME: 'unity-adapters'

# Secrets from Secret Manager
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_ADMIN_KEY/versions/latest
    env: 'ORCHESTRA_ADMIN_KEY'

# Timeout
timeout: '1200s'

# Images to be pushed
images:
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
