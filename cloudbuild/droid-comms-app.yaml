steps:
  # Pull previous image for Docker layer cache
- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest || true

  # Build Docker Image with BuildKit inline cache. DROID_SHA is the
  # head of unifyai/droid@main at build time; passing it through busts
  # the cached droid-clone layer inside Dockerfile-comms when droid
  # has new commits (otherwise the cached layer reuses a stale
  # snapshot and downstream `from droid.X import Y` calls silently
  # miss newly-added modules).
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    DROID_SHA=$$(git ls-remote https://github.com/unifyai/droid.git refs/heads/main | awk '{print $$1}')
    echo "Cache-busting droid layer with DROID_SHA=$$DROID_SHA"
    DOCKER_BUILDKIT=1 docker build -f Dockerfile-comms \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN --build-arg BRANCH_NAME=main \
      --build-arg DROID_SHA=$$DROID_SHA \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest .
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['pull-cache']

  # Push Docker Image (SHA Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}']
  waitFor: ['build-image']

  # Push Docker Image (Latest Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest']
  waitFor: ['build-image']

- name: 'gcr.io/cloud-builders/docker'
  id: 'build-assistant-session-controller'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    DOCKER_BUILDKIT=1 docker build -f scripts/assistant-session-controller/Dockerfile \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/assistant-session-controller:${SHORT_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/assistant-session-controller:latest .
  waitFor: ['pull-cache']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-assistant-session-controller'
  args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/assistant-session-controller']
  waitFor: ['build-assistant-session-controller']

  # Deploy to Cloud Run
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy-assistant-session-controller'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    gcloud container clusters get-credentials ${_CLUSTER} --region ${_REGION} --project ${PROJECT_ID}
    kubectl apply -f k8s/assistant-session-controller/crd.yaml
    kubectl wait --for=condition=Established crd/assistantsessions.infra.unify.ai --timeout=120s
    sed "s|image:.*assistant-session-controller:latest|image: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/assistant-session-controller:${SHORT_SHA}|" \
      k8s/assistant-session-controller/deployment.yaml | kubectl apply -f -
    kubectl rollout status deployment/assistant-session-controller -n production --timeout=300s
  waitFor: ['push-assistant-session-controller']

  # Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - deploy
  - ${_SERVICE_NAME}
  - '--platform=managed'
  - >-
    --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
  - '--region=${_REGION}'
  - '--allow-unauthenticated'
  - '--min-instances=1'
  - '--memory=2Gi'
  - '--update-env-vars=DEPLOY_ENV=production,DROID_GKE_CLUSTER_NAME=${_CLUSTER}'
  - '--service-account=comm-sa@${PROJECT_ID}.iam.gserviceaccount.com'
  - '--set-secrets=GCP_SA_KEY=gcp-sa-key:latest,LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,LIVEKIT_SIP_URI=LIVEKIT_SIP_URI:latest,LIVEKIT_URL=LIVEKIT_URL:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_API_SECRET=TWILIO_API_SECRET:latest,TWILIO_API_SID=TWILIO_API_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWIML_SIP_PASSWORD=TWIML_SIP_PASSWORD:latest,TWIML_SIP_USERNAME=TWIML_SIP_USERNAME:latest,UNIFY_KEY=UNIFY_KEY:latest,ORCHESTRA_ADMIN_KEY=ORCHESTRA_ADMIN_KEY:latest,TWILIO_VERIFICATION_NUMBER=TWILIO_VERIFICATION_NUMBER:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,TWILIO_WA_ACCOUNT_SID=TWILIO_WA_ACCOUNT_SID:latest,TWILIO_WA_AUTH_TOKEN=TWILIO_WA_AUTH_TOKEN:latest,OAUTH_STATE_SIGNING_KEY=OAUTH_STATE_SIGNING_KEY:latest,MS365_ADMIN_TENANT_ID=MS365_ADMIN_TENANT_ID:latest,MS365_ADMIN_CLIENT_ID=MS365_ADMIN_CLIENT_ID:latest,MS365_ADMIN_CLIENT_SECRET=MS365_ADMIN_CLIENT_SECRET:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,MS365_BYOD_CLIENT_ID=MS365_BYOD_CLIENT_ID:latest,MS365_BYOD_CLIENT_SECRET=MS365_BYOD_CLIENT_SECRET:latest,OUTLOOK_WEBHOOK_SECRET=OUTLOOK_WEBHOOK_SECRET:latest,TEAMS_WEBHOOK_SECRET=TEAMS_WEBHOOK_SECRET:latest'
  - '--quiet'
  id: Deploy Droid Comms App
  entrypoint: gcloud
  waitFor: ['push-sha-tag', 'deploy-assistant-session-controller']

# Options
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

# Substitution variables
substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'droid-comms-app-repo'
  _SERVICE_NAME: 'droid-comms-app'
  _CLUSTER: 'unity'

# Available secrets
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
    env: 'GITHUB_TOKEN'

# Timeout
timeout: '1200s'  # 20 minutes

# Images to be pushed (for Cloud Build history)
images:
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/assistant-session-controller:${SHORT_SHA}'
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/assistant-session-controller:latest'
