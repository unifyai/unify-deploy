steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Cloud Function"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "$_FUNCTION_NAME" \
          --gen2 \
          --region="$_REGION" \
          --runtime=python311 \
          --source="adapters/email" \
          --entry-point=process_notification \
          --trigger-topic=email-notifications \
          --allow-unauthenticated \
          --set-env-vars=PROJECT_ID=$PROJECT_ID \
          --timeout=300 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=100 \
          --concurrency=80
timeout: "1200s"
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
substitutions:
  _FUNCTION_NAME: email-notification-processor
  _REGION: us-central1
