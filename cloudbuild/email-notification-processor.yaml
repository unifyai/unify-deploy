steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Cloud Function"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "$_FUNCTION_NAME" \
          --gen2 \
          --region="$_REGION" \
          --runtime=python311 \
          --source="adapters/email" \
          --entry-point=process_notification \
          --trigger-topic=email-notifications-test \
          --allow-unauthenticated \
          --set-env-vars="GCP_SA_KEY=$$gcp-sa-key"
    secretEnv: ['gcp-sa-key']
timeout: "1200s"
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
substitutions:
  _FUNCTION_NAME: email-notification-processor
  _REGION: us-central1
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/gcp-sa-key/versions/latest
      env: 'gcp-sa-key'
