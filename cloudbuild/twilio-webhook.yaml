steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Cloud Function"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "$_FUNCTION_NAME" \
          --gen2 \
          --region="$_REGION" \
          --runtime=python311 \
          --source="adapters/phone" \
          --entry-point=twilio_webhook \
          --trigger-http \
          --allow-unauthenticated \
          --set-env-vars="LIVEKIT_SIP_URI=$$LIVEKIT_SIP_URI,TWILIO_ACCOUNT_SID=$$TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN=$$TWILIO_AUTH_TOKEN,UNIFY_COMMS_URL=$$UNIFY_COMMS_URL,PROJECT_ID=$PROJECT_ID"
    secretEnv: ['LIVEKIT_SIP_URI', 'TWILIO_ACCOUNT_SID', 'TWILIO_AUTH_TOKEN', 'UNIFY_COMMS_URL']
timeout: "1200s"
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
substitutions:
  _FUNCTION_NAME: twilio-webhook
  _REGION: us-central1
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/LIVEKIT_SIP_URI/versions/latest
      env: 'LIVEKIT_SIP_URI'
    - versionName: projects/$PROJECT_ID/secrets/TWILIO_ACCOUNT_SID/versions/latest
      env: 'TWILIO_ACCOUNT_SID'
    - versionName: projects/$PROJECT_ID/secrets/TWILIO_AUTH_TOKEN/versions/latest
      env: 'TWILIO_AUTH_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/UNIFY_COMMS_URL/versions/latest
      env: 'UNIFY_COMMS_URL'
