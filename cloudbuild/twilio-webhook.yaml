steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Cloud Function"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "$_FUNCTION_NAME" \
          --gen2 \
          --region="$_REGION" \
          --runtime=python311 \
          --source="adapters/phone" \
          --entry-point=twilio_webhook \
          --trigger-http \
          --allow-unauthenticated \
          --set-env-vars="LIVEKIT_SIP_URI=$LIVEKIT_SIP_URI,PROJECT_ID=$PROJECT_ID"
timeout: "1200s"
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
substitutions:
  _FUNCTION_NAME: twilio-webhook
  _REGION: us-central1
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/LIVEKIT_SIP_URI/versions/latest
      env: 'LIVEKIT_SIP_URI'
