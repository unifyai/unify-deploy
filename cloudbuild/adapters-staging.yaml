steps:
  # Pull previous image for Docker layer cache
- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest || true

  # Build Docker Image with BuildKit inline cache
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    DOCKER_BUILDKIT=1 docker build -f Dockerfile-adapters \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest .
  waitFor: ['pull-cache']

  # Push Docker Image (SHA Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}']
  waitFor: ['build-image']

  # Push Docker Image (Latest Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest']
  waitFor: ['build-image']

  # Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - '${_SERVICE_NAME}'
  - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '--region=${_REGION}'
  - '--platform=managed'
  - '--allow-unauthenticated'
  - '--min-instances=1'
  - '--max-instances=100'
  - '--concurrency=80'
  - '--memory=2Gi'
  - '--cpu=1'
  - '--timeout=300'
  - '--cpu-boost'
  - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},UNITY_MIN_IDLE_JOBS=3,UNITY_IDLE_JOB_DEMAND_FACTOR=4,DEPLOY_ENV=staging,PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc'
  waitFor: ['push-sha-tag']

  # Update Cloud Scheduler: Email Watches Staging
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-email-watches'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "email-watches-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/email-watches" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "email-watches-staging" \
      --schedule "0 0 * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/email-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Jobs Create Staging
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-jobs-create'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "jobs-create-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/create?refresh=true" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "jobs-create-staging" \
      --schedule "0 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/create?refresh=true" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Jobs Cleanup Staging
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-jobs-cleanup'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "jobs-cleanup-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/cleanup" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "jobs-cleanup-staging" \
      --schedule "10 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/cleanup" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Stale Jobs Expire Staging
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-stale-jobs-expire'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "stale-jobs-expire-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/expire-stale" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --schedule "0 1,7,13,19 * * *" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "stale-jobs-expire-staging" \
      --schedule "0 1,7,13,19 * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/jobs/expire-stale" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Microsoft Token Refresh Staging
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-microsoft-tokens'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "microsoft-tokens-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/microsoft-tokens" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "microsoft-tokens-staging" \
      --schedule "*/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/microsoft-tokens" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Teams Chat Watches Staging (runs every 30 mins - subscriptions expire in 60 mins)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-teams-watches'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "teams-watches-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/teams-watches" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "teams-watches-staging" \
      --schedule "*/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/teams-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Cert Renewal (Staging)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-cert-renewal'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "cert-renewal-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/cert-renewal" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "cert-renewal-staging" \
      --schedule "0 3 1 * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/cert-renewal" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Pending Startups Reconciler Staging
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-pending-startups'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "pending-startups-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/pending-startups" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --schedule "* * * * *" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "pending-startups-staging" \
      --schedule "* * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/pending-startups" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

# Options
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

# Substitution variables
substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity-adapters-repo'
  _SERVICE_NAME: 'unity-adapters-staging'

# Secrets from Secret Manager
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_ADMIN_KEY/versions/latest
    env: 'ORCHESTRA_ADMIN_KEY'

# Timeout
timeout: '1200s'

# Images to be pushed
images:
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
