    id: "Create/Update Email Watch Renewer Staging Scheduler"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud scheduler jobs create http "email-watch-renewer-staging" \
          --schedule "0 0 * * *" \
          --uri "https://us-central1-$PROJECT_ID.cloudfunctions.net/email-watch-renewer-staging" \
          --http-method POST \
          --time-zone "UTC" \
          --location="us-central1" \
