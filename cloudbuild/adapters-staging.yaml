steps:
  # Pull previous image for Docker layer cache
- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest || true

  # Build Docker Image with BuildKit inline cache
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    DOCKER_BUILDKIT=1 docker build -f Dockerfile-adapters \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest .
  waitFor: ['pull-cache']

  # Push Docker Image (SHA Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}']
  waitFor: ['build-image']

  # Push Docker Image (Latest Tag)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest']
  waitFor: ['build-image']

  # Pause legacy infra schedulers before updating the unified maintenance job
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'pause-legacy-infra-schedulers'
  entrypoint: bash
  args:
  - '-c'
  - |
    for job in jobs-create-staging jobs-cleanup-staging stale-jobs-expire-staging \
               pending-startups-staging pending-vm-assignments-staging; do
      gcloud scheduler jobs pause "$job" --location="${_REGION}" 2>/dev/null \
        && echo "Paused legacy scheduler: $job" \
        || echo "Legacy scheduler $job already paused, removed, or not found"
    done
  waitFor: ['push-sha-tag']

  # Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - '${_SERVICE_NAME}'
  - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '--region=${_REGION}'
  - '--platform=managed'
  - '--allow-unauthenticated'
  - '--min-instances=1'
  - '--max-instances=100'
  - '--concurrency=80'
  - '--memory=2Gi'
  - '--cpu=1'
  - '--timeout=300'
  - '--cpu-boost'
  - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},UNITY_MIN_IDLE_JOBS=3,UNITY_IDLE_JOB_DEMAND_FACTOR=4,DEPLOY_ENV=staging,PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc'
  - '--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=${SHORT_SHA},gcb-build-id=${BUILD_ID}'
  waitFor: ['push-sha-tag', 'push-latest-tag', 'pause-legacy-infra-schedulers']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'route-canonical-traffic'
  entrypoint: bash
  args:
  - '-c'
  - |
    set -euo pipefail
    REVISION=$$(gcloud run revisions list \
      --service=${_SERVICE_NAME} \
      --region=${_REGION} \
      --filter="metadata.labels.gcb-build-id=${BUILD_ID}" \
      --sort-by="~metadata.creationTimestamp" \
      --limit=1 \
      --format="value(metadata.name)")
    if [ -z "$$REVISION" ]; then
      echo "No deployed revision found for build ${BUILD_ID}" >&2
      exit 1
    fi
    LATEST_CREATED=$$(gcloud run services describe ${_SERVICE_NAME} \
      --region=${_REGION} \
      --platform=managed \
      --format="value(status.latestCreatedRevisionName)")
    if [ "$$REVISION" != "$$LATEST_CREATED" ]; then
      echo "Skipping traffic route for $$REVISION because $$LATEST_CREATED is newer"
      exit 0
    fi
    gcloud run services update-traffic ${_SERVICE_NAME} \
      --region=${_REGION} \
      --platform=managed \
      --to-revisions="$$REVISION=100" \
      --quiet
  waitFor: ['deploy']

  # Update Cloud Scheduler: Email Watches Staging
  # 00:10 UTC daily.  Offset from the 00:00 spike (microsoft-tokens,
  # google-token-refresh, infra-maintenance all fire at :00) so the
  # Outlook branch reads a freshly-refreshed MICROSOFT_ACCESS_TOKEN.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-email-watches'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "email-watches-staging" \
      --schedule "10 0 * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/email-watches" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "email-watches-staging" \
      --schedule "10 0 * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/email-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Infra Maintenance Staging
  # Unified sweep: pool replenish + cleanup + stale-job expiry +
  # orphaned-VM reconciliation + quarantined-VM purge.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-infra-maintenance'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "infra-maintenance-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/infra/maintenance" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "infra-maintenance-staging" \
      --schedule "0 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/infra/maintenance" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Remove legacy infra schedulers (replaced by infra-maintenance-staging)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'remove-legacy-infra-schedulers'
  entrypoint: bash
  args:
  - '-c'
  - |
    for job in jobs-create-staging jobs-cleanup-staging stale-jobs-expire-staging \
               pending-startups-staging pending-vm-assignments-staging; do
      gcloud scheduler jobs delete "$job" --location="${_REGION}" --quiet 2>/dev/null \
        && echo "Deleted legacy scheduler: $job" \
        || echo "Legacy scheduler $job already removed or not found"
    done
  waitFor: ['update-scheduler-infra-maintenance']

  # Remove legacy pending PubSub topics (replaced by AssistantSession CRD phases)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'remove-legacy-pending-pubsub'
  entrypoint: bash
  args:
  - '-c'
  - |
    for topic in unity-pending-startups-staging unity-pending-vm-assignments-staging unity-startup-staging; do
      gcloud pubsub topics delete "$topic" --project="${PROJECT_ID}" --quiet 2>/dev/null \
        && echo "Deleted legacy topic: $topic" \
        || echo "Legacy topic $topic already removed or not found"
    done
  waitFor: ['remove-legacy-infra-schedulers']

  # Update Cloud Scheduler: Microsoft Token Refresh Staging
  # :00 and :30 every hour.  Sole writer of MICROSOFT_ACCESS_TOKEN;
  # readers (teams-watches, email-watches) are scheduled to land
  # AFTER this tick so they always read a freshly-rotated token.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-microsoft-tokens'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "microsoft-tokens-staging" \
      --schedule "*/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/microsoft-tokens" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "microsoft-tokens-staging" \
      --schedule "*/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/microsoft-tokens" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Google Token Refresh Staging
  # :05 and :35 every hour.  Offset +5m from microsoft-tokens to
  # avoid dual-writer contention on Orchestra secret writes and
  # refresh-token rotation races.  Access tokens live ~1h.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-google-tokens'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "google-token-refresh-staging" \
      --schedule "5-59/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/google-tokens" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "google-token-refresh-staging" \
      --schedule "5-59/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/google-tokens" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Teams Chat Watches Staging
  # :10 and :40 every hour (subscriptions expire in 60 mins).
  # 10-min offset after microsoft-tokens (:00, :30) so the renewal
  # loop always reads a freshly-rotated MICROSOFT_ACCESS_TOKEN.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-teams-watches'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "teams-watches-staging" \
      --schedule "10-59/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/teams-watches" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "teams-watches-staging" \
      --schedule "10-59/30 * * * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/teams-watches" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY,Content-Type=application/json" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

  # Update Cloud Scheduler: Cert Renewal (Staging)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'update-scheduler-cert-renewal'
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -o pipefail
    CLOUD_RUN_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
    {
    gcloud scheduler jobs update http "cert-renewal-staging" \
      --uri "$${CLOUD_RUN_URL}/scheduled/cert-renewal" \
      --http-method POST \
      --update-headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --location="${_REGION}" \
    || \
    gcloud scheduler jobs create http "cert-renewal-staging" \
      --schedule "0 3 1 * *" \
      --uri "$${CLOUD_RUN_URL}/scheduled/cert-renewal" \
      --http-method POST \
      --headers "Authorization=Bearer $$ORCHESTRA_ADMIN_KEY" \
      --message-body '{}' \
      --time-zone "UTC" \
      --location="${_REGION}"
    } 2>&1 | sed "s|$$ORCHESTRA_ADMIN_KEY|[REDACTED]|g"
  waitFor: ['deploy']

# Options
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

# Substitution variables
substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity-adapters-repo'
  _SERVICE_NAME: 'unity-adapters-staging'

# Secrets from Secret Manager
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_ADMIN_KEY/versions/latest
    env: 'ORCHESTRA_ADMIN_KEY'

# Timeout
timeout: '1200s'

# Images to be pushed
images:
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
