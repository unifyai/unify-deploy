# Cloud Build pipeline for preview-environment Comms App revisions.
#
# Triggered on push to ``feature/*`` branches.  Builds the comms-app
# image and deploys it as a Cloud Run preview revision against the
# existing ``unity-comms-app-staging`` service with ``--no-traffic``,
# then assigns the slug tag only after the revision is ready.
#
# Singletons that staging deploys manage (assistant-session-controller,
# Cloud Scheduler jobs, GKE Deployments) are intentionally left alone:
# preview revisions share those with the rest of staging and do not
# attempt to isolate them.

steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'compute-slug'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(echo "${BRANCH_NAME}" \
      | sed -E 's|^feature/||; s|[^a-z0-9-]+|-|g; s|^-+||; s|-+$||' \
      | tr '[:upper:]' '[:lower:]' \
      | cut -c1-30 \
      | sed -E 's|-+$||')
    if [ -z "$$SLUG" ]; then
      echo "ERROR: empty preview slug from branch name '${BRANCH_NAME}'" >&2
      exit 1
    fi
    echo "$$SLUG" > /workspace/slug.txt
    echo "preview slug: $$SLUG"
  waitFor: ['-']

- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest || true
  waitFor: ['-']

- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(cat /workspace/slug.txt)
    DOCKER_BUILDKIT=1 docker build -f Dockerfile-comms \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      --build-arg BRANCH_NAME=${BRANCH_NAME} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:preview-$${SLUG}-${SHORT_SHA} .
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['compute-slug', 'pull-cache']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(cat /workspace/slug.txt)
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:preview-$${SLUG}-${SHORT_SHA}
  waitFor: ['build-image']

  # Deploy a no-traffic preview revision. The slug tag is assigned only
  # after Cloud Run reports the revision ready. Peer URLs are pinned to
  # the matching tagged revisions so service-to-service hops stay inside
  # the preview environment.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'repair-traffic-state'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    run_cloud_run_with_retry() {
      local attempt max_attempts delay output output_file sleep_for status
      max_attempts=5
      delay=5
      for attempt in $$(seq 1 "$$max_attempts"); do
        output_file=$$(mktemp)
        set +e
        (set -e; "$${@}") > "$$output_file" 2>&1
        status=$$?
        set -e
        output=$$(cat "$$output_file")
        rm -f "$$output_file"
        printf '%s\n' "$$output"
        if [ "$$status" -eq 0 ]; then
          return 0
        fi
        if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
          return "$$status"
        fi
        sleep_for=$$((delay + RANDOM % 5))
        echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
        delay=$$((delay * 2))
      done
    }
    repair_traffic_state() {
    SERVICE_JSON=/tmp/service.json
    gcloud run services describe ${_SERVICE_NAME} \
      --region=${_REGION} \
      --platform=managed \
      --format=json > "$$SERVICE_JSON"
    python3 - "$$SERVICE_JSON" > /tmp/traffic-args.txt <<'PY'
    import json
    import sys

    with open(sys.argv[1], encoding="utf-8") as service_file:
        service = json.load(service_file)

    revisions: list[str] = []
    status_tags: dict[str, str] = {}
    for entry in service.get("status", {}).get("traffic", []):
        revision = entry.get("revisionName")
        if not revision:
            continue
        percent = entry.get("percent")
        if percent is not None and int(percent) > 0:
            revisions.append(f"{revision}={int(percent)}")
        tag = entry.get("tag")
        if tag:
            status_tags[tag] = revision

    if not revisions:
        raise SystemExit("No live traffic revision found to preserve")

    spec_tags = {
        entry["tag"]: entry.get("revisionName")
        for entry in service.get("spec", {}).get("traffic", [])
        if entry.get("tag")
    }
    update_tags = [
        f"{tag}={revision}"
        for tag, revision in sorted(status_tags.items())
        if spec_tags.get(tag) != revision
    ]
    remove_tags = sorted(
        tag for tag in spec_tags
        if tag not in status_tags
    )

    print("--to-revisions=" + ",".join(revisions))
    if update_tags:
        print("--update-tags=" + ",".join(update_tags))
    if remove_tags:
        print("--remove-tags=" + ",".join(remove_tags))
    PY
    mapfile -t TRAFFIC_ARGS < /tmp/traffic-args.txt
    run_cloud_run_with_retry gcloud run services update-traffic ${_SERVICE_NAME} \
      --region=${_REGION} \
      --platform=managed \
      "$${TRAFFIC_ARGS[@]}" \
      --quiet
    }
    run_cloud_run_with_retry repair_traffic_state
  waitFor: ['push-image']

  # Deploy the preview revision without assigning the slug tag first. Cloud Run
  # can mutate tag traffic before a revision is ready, so the tag is assigned in
  # a later step after the revision has successfully materialized.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy-preview'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    run_cloud_run_with_retry() {
      local attempt max_attempts delay output output_file sleep_for status
      max_attempts=5
      delay=5
      for attempt in $$(seq 1 "$$max_attempts"); do
        output_file=$$(mktemp)
        set +e
        (set -e; "$${@}") > "$$output_file" 2>&1
        status=$$?
        set -e
        output=$$(cat "$$output_file")
        rm -f "$$output_file"
        printf '%s\n' "$$output"
        if [ "$$status" -eq 0 ]; then
          return 0
        fi
        if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
          return "$$status"
        fi
        sleep_for=$$((delay + RANDOM % 5))
        echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
        delay=$$((delay * 2))
      done
    }
    SLUG=$(cat /workspace/slug.txt)
    SERVICE_NAME=${_SERVICE_NAME}
    BUILD_PART=$(printf '%s' "${BUILD_ID}" | cut -c1-8)
    MAX_SUFFIX_LEN=$((63 - $${#SERVICE_NAME} - 1))
    MAX_SLUG_LEN=$((MAX_SUFFIX_LEN - $${#BUILD_PART} - 3))
    if [ "$$MAX_SLUG_LEN" -lt 1 ]; then
      echo "No room for preview revision suffix on service $$SERVICE_NAME" >&2
      exit 1
    fi
    REVISION_SLUG=$(printf '%s' "$$SLUG" | cut -c1-$$MAX_SLUG_LEN)
    REVISION_SUFFIX="p-$${REVISION_SLUG}-$${BUILD_PART}"
    REVISION="$${SERVICE_NAME}-$${REVISION_SUFFIX}"
    echo "$$REVISION" > /workspace/preview-revision.txt
    ORCHESTRA_URL="https://$${SLUG}.${_PEER_ORCHESTRA_HOST}/v0"
    COMMS_URL="https://$${SLUG}---${_PEER_COMMS_HOST}"
    ADAPTERS_URL="https://$${SLUG}---${_PEER_ADAPTERS_HOST}"
    CANONICAL_IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest
    if ! run_cloud_run_with_retry gcloud run deploy ${_SERVICE_NAME} \
      --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:preview-$${SLUG}-${SHORT_SHA} \
      --region=${_REGION} \
      --platform=managed \
      --revision-suffix=$$REVISION_SUFFIX \
      --no-traffic \
      --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=${SHORT_SHA},gcb-build-id=${BUILD_ID},preview=true \
      --update-env-vars=DEPLOY_ENV=staging,BRANCH_TAG=$${SLUG},ORCHESTRA_URL=$${ORCHESTRA_URL},UNITY_COMMS_URL=$${COMMS_URL},UNITY_ADAPTERS_URL=$${ADAPTERS_URL} \
      --quiet; then
      echo "preview deploy failed; restoring canonical service template"
      run_cloud_run_with_retry gcloud run services update ${_SERVICE_NAME} \
        --region=${_REGION} --platform=managed \
        --image="$$CANONICAL_IMAGE" \
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-build-id=${BUILD_ID},preview-restore=true \
        --remove-env-vars=BRANCH_TAG \
        --update-env-vars=DEPLOY_ENV=staging,ORCHESTRA_URL=${_CANONICAL_ORCHESTRA_URL},UNITY_COMMS_URL=https://${_PEER_COMMS_HOST},UNITY_ADAPTERS_URL=https://${_PEER_ADAPTERS_HOST} \
        --quiet
      exit 1
    fi
    echo "preview revision URL: https://$${SLUG}---${_PEER_COMMS_HOST}"
  waitFor: ['repair-traffic-state']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'assign-preview-tag'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    run_cloud_run_with_retry() {
      local attempt max_attempts delay output output_file sleep_for status
      max_attempts=5
      delay=5
      for attempt in $$(seq 1 "$$max_attempts"); do
        output_file=$$(mktemp)
        set +e
        (set -e; "$${@}") > "$$output_file" 2>&1
        status=$$?
        set -e
        output=$$(cat "$$output_file")
        rm -f "$$output_file"
        printf '%s\n' "$$output"
        if [ "$$status" -eq 0 ]; then
          return 0
        fi
        if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
          return "$$status"
        fi
        sleep_for=$$((delay + RANDOM % 5))
        echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
        delay=$$((delay * 2))
      done
    }
    SLUG=$(cat /workspace/slug.txt)
    REVISION=$(cat /workspace/preview-revision.txt)
    CANONICAL_IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest
    if ! run_cloud_run_with_retry gcloud run services update-traffic ${_SERVICE_NAME} \
      --region=${_REGION} \
      --platform=managed \
      --update-tags="$${SLUG}=$${REVISION}" \
      --quiet; then
      echo "preview tag assignment failed; restoring canonical service template"
      run_cloud_run_with_retry gcloud run services update ${_SERVICE_NAME} \
        --region=${_REGION} --platform=managed \
        --image="$$CANONICAL_IMAGE" \
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-build-id=${BUILD_ID},preview-restore=true \
        --remove-env-vars=BRANCH_TAG \
        --update-env-vars=DEPLOY_ENV=staging,ORCHESTRA_URL=${_CANONICAL_ORCHESTRA_URL},UNITY_COMMS_URL=https://${_PEER_COMMS_HOST},UNITY_ADAPTERS_URL=https://${_PEER_ADAPTERS_HOST} \
        --quiet
      exit 1
    fi
  waitFor: ['deploy-preview']

  # Reset the shared service template back to the canonical staging image
  # and canonical peer URLs, undoing the env-var mutation that
  # ``gcloud run deploy --update-env-vars=...`` applied to the template
  # in ``deploy-preview``.  The canonical image is referenced by the
  # ``:latest`` tag, which the canonical staging cloudbuild publishes on
  # every push and the Artifact Registry cleanup policy protects from
  # garbage collection.  The slug-tagged revision keeps its own
  # immutable env snapshot and remains reachable via its tag URL.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'restore-canonical-template'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    run_cloud_run_with_retry() {
      local attempt max_attempts delay output output_file sleep_for status
      max_attempts=5
      delay=5
      for attempt in $$(seq 1 "$$max_attempts"); do
        output_file=$$(mktemp)
        set +e
        (set -e; "$${@}") > "$$output_file" 2>&1
        status=$$?
        set -e
        output=$$(cat "$$output_file")
        rm -f "$$output_file"
        printf '%s\n' "$$output"
        if [ "$$status" -eq 0 ]; then
          return 0
        fi
        if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
          return "$$status"
        fi
        sleep_for=$$((delay + RANDOM % 5))
        echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
        delay=$$((delay * 2))
      done
    }
    CANONICAL_IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest
    run_cloud_run_with_retry gcloud run services update ${_SERVICE_NAME} \
      --region=${_REGION} --platform=managed \
      --image="$$CANONICAL_IMAGE" \
      --labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-build-id=${BUILD_ID},preview-restore=true \
      --remove-env-vars=BRANCH_TAG \
      --update-env-vars=DEPLOY_ENV=staging,ORCHESTRA_URL=${_CANONICAL_ORCHESTRA_URL},UNITY_COMMS_URL=https://${_PEER_COMMS_HOST},UNITY_ADAPTERS_URL=https://${_PEER_ADAPTERS_HOST} \
      --quiet
    echo "canonical service template restored to image $$CANONICAL_IMAGE"
  waitFor: ['assign-preview-tag']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'restore-canonical-traffic'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    run_cloud_run_with_retry() {
      local attempt max_attempts delay output output_file sleep_for status
      max_attempts=5
      delay=5
      for attempt in $$(seq 1 "$$max_attempts"); do
        output_file=$$(mktemp)
        set +e
        (set -e; "$${@}") > "$$output_file" 2>&1
        status=$$?
        set -e
        output=$$(cat "$$output_file")
        rm -f "$$output_file"
        printf '%s\n' "$$output"
        if [ "$$status" -eq 0 ]; then
          return 0
        fi
        if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
          return "$$status"
        fi
        sleep_for=$$((delay + RANDOM % 5))
        echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
        delay=$$((delay * 2))
      done
    }
    route_canonical_traffic() {
      REVISION=$$(gcloud run services describe ${_SERVICE_NAME} \
        --region=${_REGION} \
        --platform=managed \
        --format="value(status.latestCreatedRevisionName)")
      if [ -z "$$REVISION" ]; then
        echo "No canonical restore revision found for build ${BUILD_ID}" >&2
        return 1
      fi
      REVISION_BUILD_ID=$$(gcloud run revisions describe "$$REVISION" \
        --region=${_REGION} \
        --format="value(metadata.labels.gcb-build-id)")
      REVISION_PREVIEW_RESTORE=$$(gcloud run revisions describe "$$REVISION" \
        --region=${_REGION} \
        --format="value(metadata.labels.preview-restore)")
      if [ "$$REVISION_BUILD_ID" != "${BUILD_ID}" ] || [ "$$REVISION_PREVIEW_RESTORE" != "true" ]; then
        echo "Skipping traffic restore for $$REVISION because it is not this build's restore revision"
        return 0
      fi
      gcloud run services update-traffic ${_SERVICE_NAME} \
        --region=${_REGION} \
        --platform=managed \
        --to-revisions="$$REVISION=100" \
        --quiet
      echo "canonical traffic restored to revision $$REVISION"
    }
    run_cloud_run_with_retry route_canonical_traffic
  waitFor: ['restore-canonical-template']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity-comms-app-repo'
  _SERVICE_NAME: 'unity-comms-app-staging'
  _PEER_COMMS_HOST: 'service.a.run.app'
  _PEER_ADAPTERS_HOST: 'service.a.run.app'
  _PEER_ORCHESTRA_HOST: 'internal.example.com'
  _CANONICAL_ORCHESTRA_URL: 'https://internal.example.com/v0'

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
    env: 'GITHUB_TOKEN'

timeout: '1200s'
