# Cloud Build pipeline for preview-environment Comms App revisions.
#
# Triggered on push to ``feature/*`` branches.  Builds the comms-app
# image and deploys it as a tagged Cloud Run revision against the
# existing ``unity-comms-app-staging`` service with ``--no-traffic``,
# so the regular staging URL is unaffected and only the tagged URL
# (``https://<slug>service.a.run.app``)
# routes to this build.
#
# Singletons that staging deploys manage (assistant-session-controller,
# Cloud Scheduler jobs, GKE Deployments) are intentionally left alone:
# preview revisions share those with the rest of staging and do not
# attempt to isolate them.

steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'compute-slug'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(echo "${BRANCH_NAME}" \
      | sed -E 's|^feature/||; s|[^a-z0-9-]+|-|g; s|^-+||; s|-+$||' \
      | tr '[:upper:]' '[:lower:]' \
      | cut -c1-30 \
      | sed -E 's|-+$||')
    if [ -z "$$SLUG" ]; then
      echo "ERROR: empty preview slug from branch name '${BRANCH_NAME}'" >&2
      exit 1
    fi
    echo "$$SLUG" > /workspace/slug.txt
    echo "preview slug: $$SLUG"
  waitFor: ['-']

- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest || true
  waitFor: ['-']

- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(cat /workspace/slug.txt)
    DOCKER_BUILDKIT=1 docker build -f Dockerfile-comms \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      --build-arg BRANCH_NAME=${BRANCH_NAME} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:preview-$${SLUG}-${SHORT_SHA} .
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['compute-slug', 'pull-cache']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(cat /workspace/slug.txt)
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:preview-$${SLUG}-${SHORT_SHA}
  waitFor: ['build-image']

  # Deploy as a tagged, no-traffic revision so the canonical staging URL
  # keeps serving the un-tagged revision and only the tagged URL routes
  # this build.  Peer URLs are pinned to the matching tagged revisions
  # so service-to-service hops stay inside the preview environment.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy-tagged'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(cat /workspace/slug.txt)
    ORCHESTRA_URL="https://$${SLUG}---${_PEER_ORCHESTRA_HOST}/v0"
    ADAPTERS_URL="https://$${SLUG}---${_PEER_ADAPTERS_HOST}"
    gcloud run deploy ${_SERVICE_NAME} \
      --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:preview-$${SLUG}-${SHORT_SHA} \
      --region=${_REGION} \
      --platform=managed \
      --tag=$${SLUG} \
      --no-traffic \
      --update-env-vars=DEPLOY_ENV=staging,BRANCH_TAG=$${SLUG},ORCHESTRA_URL=$${ORCHESTRA_URL},UNITY_ADAPTERS_URL=$${ADAPTERS_URL} \
      --quiet
    echo "preview revision URL: https://$${SLUG}---${_PEER_COMMS_HOST}"
  waitFor: ['push-image']

  # Reset the shared service template back to the canonical staging image
  # and canonical peer URLs, undoing the env-var mutation that
  # ``gcloud run deploy --update-env-vars=...`` applied to the template
  # in ``deploy-tagged``.  The canonical image is referenced by the
  # ``:latest`` tag, which the canonical staging cloudbuild publishes on
  # every push and the Artifact Registry cleanup policy protects from
  # garbage collection.  The slug-tagged revision keeps its own
  # immutable env snapshot and remains reachable via its tag URL.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'restore-canonical-template'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    CANONICAL_IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest
    gcloud run services update ${_SERVICE_NAME} \
      --region=${_REGION} --platform=managed \
      --image="$$CANONICAL_IMAGE" \
      --labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-build-id=${BUILD_ID},preview-restore=true \
      --remove-env-vars=BRANCH_TAG \
      --update-env-vars=DEPLOY_ENV=staging,ORCHESTRA_URL=${_CANONICAL_ORCHESTRA_URL},UNITY_ADAPTERS_URL=https://${_PEER_ADAPTERS_HOST} \
      --quiet
    echo "canonical service template restored to image $$CANONICAL_IMAGE"
  waitFor: ['deploy-tagged']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'restore-canonical-traffic'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    REVISION=$$(gcloud run revisions list \
      --service=${_SERVICE_NAME} \
      --region=${_REGION} \
      --filter="metadata.labels.gcb-build-id=${BUILD_ID} metadata.labels.preview-restore=true" \
      --sort-by="~metadata.creationTimestamp" \
      --limit=1 \
      --format="value(metadata.name)")
    if [ -z "$$REVISION" ]; then
      echo "No canonical restore revision found for build ${BUILD_ID}" >&2
      exit 1
    fi
    LATEST_CREATED=$$(gcloud run services describe ${_SERVICE_NAME} \
      --region=${_REGION} \
      --platform=managed \
      --format="value(status.latestCreatedRevisionName)")
    if [ "$$REVISION" != "$$LATEST_CREATED" ]; then
      echo "Skipping traffic restore for $$REVISION because $$LATEST_CREATED is newer"
      exit 0
    fi
    gcloud run services update-traffic ${_SERVICE_NAME} \
      --region=${_REGION} \
      --platform=managed \
      --to-revisions="$$REVISION=100" \
      --quiet
    echo "canonical traffic restored to revision $$REVISION"
  waitFor: ['restore-canonical-template']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity-comms-app-repo'
  _SERVICE_NAME: 'unity-comms-app-staging'
  _PEER_COMMS_HOST: 'service.a.run.app'
  _PEER_ADAPTERS_HOST: 'service.a.run.app'
  _PEER_ORCHESTRA_HOST: 'service.a.run.app'
  _CANONICAL_ORCHESTRA_URL: 'https://internal.example.com/v0'

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
    env: 'GITHUB_TOKEN'

timeout: '1200s'
