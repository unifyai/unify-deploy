steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Deploy Cloud Function"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud functions deploy "$_FUNCTION_NAME" \
          --gen2 \
          --region="$_REGION" \
          --runtime=python311 \
          --source="adapters/email" \
          --entry-point=renew_watch \
          --trigger-http \
          --allow-unauthenticated \
          --set-env-vars="ORCHESTRA_ADMIN_KEY=$$ORCHESTRA_ADMIN_KEY"
    secretEnv: ['ORCHESTRA_ADMIN_KEY']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: "Create/Update Scheduler"
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud scheduler jobs create http email-watch-renewer \
          --schedule "0 0 * * *" \
          --uri "https://$_REGION-$PROJECT_ID.cloudfunctions.net/$_FUNCTION_NAME" \
          --http-method POST \
          --time-zone "UTC" \
        || \
        gcloud scheduler jobs update http email-watch-renewer \
          --schedule "0 0 * * *" \
          --uri "https://$_REGION-$PROJECT_ID.cloudfunctions.net/$_FUNCTION_NAME" \
          --http-method POST \
          --time-zone "UTC"
timeout: "1200s"
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
substitutions:
  _FUNCTION_NAME: email-watch-renewer
  _REGION: us-central1
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/ORCHESTRA_ADMIN_KEY/versions/latest
      env: 'ORCHESTRA_ADMIN_KEY'
