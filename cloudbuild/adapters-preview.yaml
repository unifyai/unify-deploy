# Cloud Build pipeline for preview-environment Adapters revisions.
#
# Triggered on push to ``feature/*`` branches.  Builds the adapters
# image and deploys it as a tagged Cloud Run revision against the
# existing ``unity-adapters-staging`` service with ``--no-traffic``.
# Cloud Scheduler jobs (which target the canonical staging URL) are
# intentionally untouched: cron-driven flows continue to fire against
# the un-tagged staging revision.

steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'compute-slug'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(echo "${BRANCH_NAME}" \
      | sed -E 's|^feature/||; s|[^a-z0-9-]+|-|g; s|^-+||; s|-+$||' \
      | tr '[:upper:]' '[:lower:]' \
      | cut -c1-30 \
      | sed -E 's|-+$||')
    if [ -z "$$SLUG" ]; then
      echo "ERROR: empty preview slug from branch name '${BRANCH_NAME}'" >&2
      exit 1
    fi
    echo "$$SLUG" > /workspace/slug.txt
    echo "preview slug: $$SLUG"
  waitFor: ['-']

- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest || true
  waitFor: ['-']

- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(cat /workspace/slug.txt)
    DOCKER_BUILDKIT=1 docker build -f Dockerfile-adapters \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:preview-$${SLUG}-${SHORT_SHA} .
  waitFor: ['compute-slug', 'pull-cache']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(cat /workspace/slug.txt)
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:preview-$${SLUG}-${SHORT_SHA}
  waitFor: ['build-image']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy-tagged'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SLUG=$(cat /workspace/slug.txt)
    ORCHESTRA_URL="https://$${SLUG}---${_PEER_ORCHESTRA_HOST}/v0"
    COMMS_URL="https://$${SLUG}---${_PEER_COMMS_HOST}"
    gcloud run deploy ${_SERVICE_NAME} \
      --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:preview-$${SLUG}-${SHORT_SHA} \
      --region=${_REGION} \
      --platform=managed \
      --tag=$${SLUG} \
      --no-traffic \
      --allow-unauthenticated \
      --remove-secrets=UNITY_COMMS_URL \
      --update-env-vars=DEPLOY_ENV=staging,BRANCH_TAG=$${SLUG},ORCHESTRA_URL=$${ORCHESTRA_URL},UNITY_COMMS_URL=$${COMMS_URL} \
      --quiet
    echo "preview revision URL: https://$${SLUG}---${_PEER_ADAPTERS_HOST}"
  waitFor: ['push-image']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity-adapters-repo'
  _SERVICE_NAME: 'unity-adapters-staging'
  _PEER_COMMS_HOST: 'service.a.run.app'
  _PEER_ADAPTERS_HOST: 'service.a.run.app'
  _PEER_ORCHESTRA_HOST: 'service.a.run.app'

timeout: '1200s'
