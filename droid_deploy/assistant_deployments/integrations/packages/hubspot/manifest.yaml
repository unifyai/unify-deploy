name: HubSpot
slug: hubspot
version: "0.2.0"
sector: crm
tier: api
quality: silver
description: >
  HubSpot integration covering CRM, Engagements, Marketing, Sales,
  Service, CMS, Platform, and Analytics surfaces via the HubSpot v3
  APIs.  Live reads and writes go through a single ``hubspot_request``
  tool that exposes the underlying authenticated HTTP client to the
  actor; CRM search, cross-object associations, and property-schema
  discovery are kept as typed helpers because their idiom is
  non-trivial.  Bulk pulls go through ``run_hubspot_sync_tick`` which
  mirrors objects into DataManager.  Authenticated using a HubSpot
  Private App access token.  Tier-gated capabilities (Sequences,
  Workflows, SMS, Custom Reports, etc.) detect 403 responses and
  return a graceful error envelope rather than raising.
homepage: https://developers.hubspot.com/docs/api/private-apps

secrets:
- name: HUBSPOT_PRIVATE_APP_TOKEN
  description: >
    HubSpot Private App access token.  Create at Settings -> Integrations
    -> Private Apps in HubSpot.  Recommended scopes for full functionality:
    crm.objects.contacts.read/write, crm.objects.companies.read/write,
    crm.objects.deals.read/write, crm.objects.tickets.read/write,
    crm.objects.line_items.read/write, crm.objects.products.read/write,
    crm.objects.quotes.read/write, crm.objects.owners.read,
    crm.objects.calls.read/write, crm.objects.emails.read/write,
    crm.objects.meetings.read/write, crm.objects.notes.read/write,
    crm.objects.tasks.read/write, crm.lists.read/write,
    crm.schemas.contacts.read, crm.schemas.companies.read,
    crm.schemas.deals.read, crm.schemas.tickets.read,
    crm.schemas.custom.read, crm.objects.custom.read/write,
    forms, content, files, hubdb, automation, sales-email-read.
    Optional scopes unlock specific Hubs (sequences, conversations, etc.).
  required: true
  sensitive: true

- name: HUBSPOT_PORTAL_ID
  description: >
    Numeric HubSpot account/portal ID.  Optional - used to construct
    HubSpot UI deep links in assistant responses.  If unset, the actor
    can recover it from a single ``GET /account-info/v3/details`` call.
  required: false
  sensitive: false

capabilities:
  # ----- Live API access -------------------------------------------------
  # Single generic tool — the actor constructs the URL/method/params
  # using HubSpot's API docs and the structured 4xx error envelopes
  # the helper returns when something's malformed.  This is the
  # default surface for ad-hoc reads and one-off writes.
- id: hubspot_live
  name: Live API access
  description: >
    One tool covering the entire HubSpot REST surface (CRM, Engagements,
    Marketing, Sales, Service, CMS, Platform, Analytics, Custom Objects,
    Associations).  First-page only — bulk pulls go through the sync
    orchestrator.  Writes are not gated in code; the actor must surface
    what's about to change to the user before issuing a destructive verb.
  functions: [hubspot_request]
  guidance: [hubspot_overview, hubspot_high_stakes_writes, hubspot_tier_gating]

  # ----- Typed helpers worth keeping -------------------------------------
  # CRM search has non-trivial filterGroups / sorts / properties shape
  # that the assistant gets wrong without the typed wrapper.
- id: hubspot_search
  name: CRM Search
  description: Cross-object full-text search across CRM record types.
  functions: [search_hubspot]
  guidance: [hubspot_overview]

  # Cross-object associations are HubSpot-idiom-heavy (v4 API, batch
  # semantics, association-types catalog) — typed helpers stay.
- id: hubspot_associations
  name: Associations
  description: Link records across object types using the v4 association API.
  functions: [list_hubspot_associations, create_hubspot_association, delete_hubspot_association]
  guidance: [hubspot_overview]

  # Property-schema discovery is used to bootstrap any custom-property
  # work; typed helpers reduce the amount of schema crawling needed.
- id: hubspot_properties_metadata
  name: Properties Metadata
  description: Property schemas per object type; create custom properties.
  functions: [list_hubspot_properties, get_hubspot_property, create_hubspot_property]
  guidance: [hubspot_overview]

  # ----- Sync orchestration ---------------------------------------------
- id: hubspot_incremental_sync
  name: Incremental Sync
  description: >
    Single-tick orchestration across CRM / Engagements / Marketing /
    Sales / Service / CMS / Platform.  Runs the internal
    ``sync_hubspot_*`` snapshot writers and aggregates their output
    into the canonical DataManager envelope.
  functions: [run_hubspot_sync_tick, get_hubspot_sync_state]
  guidance: [hubspot_sync_runbook, hubspot_local_vs_live]

  # ----- Local DataManager query ----------------------------------------
- id: hubspot_local_query
  name: Local DataManager Query
  description: Query the synced HubSpot copy in DataManager (preferred over live calls when freshness allows).
  functions: [query_local_hubspot_contacts, query_local_hubspot_companies, query_local_hubspot_deals, query_local_hubspot_tickets, query_local_hubspot_engagements, query_local_hubspot_custom_objects]
  guidance: [hubspot_local_vs_live, hubspot_overview]

requirements: [httpx]
tags: [hubspot, crm, hubspot_sales, hubspot_marketing, hubspot_service, hubspot_cms, sync, datamanager]
