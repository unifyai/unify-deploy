name: Brain Jobs
slug: brain_jobs
version: "0.1.0"
sector: internal
tier: api
quality: silver
description: >
  Internal "integration" package that hosts the scheduled-job template
  generated from the brain repo's brain.scheduled registry.  Brain
  ticks (CRM Gmail / Fireflies sync, evergreen outbound, HackerNews
  digest, YouTube influencer extraction) are declared in brain and
  materialised through the droid-deploy ScenarioActivation flow so
  the deploy-reconcile control plane plants the TaskScheduler rows
  on every push.  See brain/docs/operations/scheduled-jobs.md for the
  full pattern; the scenario template is regenerated by
  `brain scheduled export-scenario`.
homepage: https://github.com/unifyai/brain

# This package has no live API surface; the scenario it activates
# drives functions that already live in the brain_operator
# deployment's functions/ directory.  Empty secrets/capabilities are
# intentional — schedules + activation are the only thing brain_jobs
# contributes here.
secrets: []
capabilities: []
requirements: []
tags: [brain, scheduled, internal, automation]
