name: Publish self-host images

# Overlay-only publisher entrypoint. GHCR packages are linked to unifyai/unify,
# so this workflow dispatches publish there instead of pushing from unify-deploy.
on:
  push:
    branches: [staging, main]
    paths:
    - 'deploy/selfhost/**'
    - '.github/workflows/ghcr-selfhost.yml'
  workflow_dispatch:
    inputs:
      unity_ref:
        description: Unity git ref (branch, tag, or SHA)
        required: false
        default: ''
      unity_sha:
        description: Optional Unity commit SHA to pin
        required: false
        default: ''

concurrency:
  group: ghcr-selfhost-dispatch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
    - name: Dispatch publish to unifyai/unify
      env:
        GH_TOKEN: ${{ secrets.CLONE_TOKEN }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_UNITY_REF: ${{ inputs.unity_ref }}
        INPUT_UNITY_SHA: ${{ inputs.unity_sha }}
      run: |
        set -euo pipefail
        if [[ -z "${GH_TOKEN}" ]]; then
          echo "::error::CLONE_TOKEN secret is not configured on unity-deploy."
          exit 1
        fi
        unity_ref="${INPUT_UNITY_REF:-}"
        unity_sha="${INPUT_UNITY_SHA:-}"
        if [[ -z "$unity_ref" ]]; then
          unity_ref="$REF_NAME"
        fi
        if [[ -z "$unity_sha" ]]; then
          unity_sha="$(gh api "repos/unifyai/unify/commits/${unity_ref}" --jq .sha)"
        fi
        gh api repos/unifyai/unify/dispatches \
          --method POST \
          --input - <<EOF
        {
          "event_type": "publish-selfhost-images",
          "client_payload": {
            "unity_ref": "${unity_ref}",
            "unity_sha": "${unity_sha}"
          }
        }
        EOF
        echo "Dispatched publish-selfhost-images to unify (ref=${unity_ref} sha=${unity_sha})"
