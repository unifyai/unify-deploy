name: Hosted infrastructure tests

on:
  # Manual trigger - always runs tests
  workflow_dispatch:
    inputs:
      live_endpoint_tests:
        description: Run live adapter endpoint tests that require cloud credentials and external services
        required: false
        default: false
        type: boolean

  # Push events - tests only run if commit message contains [run-tests]
  push:
    branches:
    - '**'

  # Pull request events - tests only run if PR title contains [run-tests]
  pull_request:
    branches:
    - '**'

jobs:
  # Determine if tests should run based on trigger and commit/PR message
  should-run-tests:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
      run_live_endpoint_tests: ${{ steps.check.outputs.run_live_endpoint_tests }}
    steps:
    - name: Check if tests should run
      id: check
      env:
        EVENT_NAME: ${{ github.event_name }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        echo "run_live_endpoint_tests=false" >> "$GITHUB_OUTPUT"

        # workflow_dispatch always runs tests
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.inputs.live_endpoint_tests }}" == "true" ]]; then
            echo "run_live_endpoint_tests=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Tests triggered by workflow_dispatch"
          exit 0
        fi

        # For push events, check commit message for [run-tests]
        if [[ "$EVENT_NAME" == "push" ]]; then
          if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by commit message containing [run-tests]"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "Skipping tests - commit message does not contain [run-tests]"
          fi
          exit 0
        fi

        # For pull_request events, check PR title for [run-tests]
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by PR title containing [run-tests]"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "Skipping tests - PR title does not contain [run-tests]"
          fi
          exit 0
        fi

        # Default: don't run tests
        echo "run_tests=false" >> "$GITHUB_OUTPUT"
        echo "Skipping tests - unknown event type"

  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Format check (locked black)
      run: |
        uv sync --only-group lint --no-install-project --frozen
        uv run --no-sync black --check .

  deploy_tests:
    runs-on: ubuntu-latest
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configure git for private repos
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

    - name: Checkout brain tip for clients/unify_company symlink
      run: |
        chmod +x deploy/scripts/ensure_brain_checkout.sh
        if [ "${{ github.ref_name }}" = "main" ]; then
          export BRAIN_REF=main
        else
          export BRAIN_REF=staging
        fi
        deploy/scripts/ensure_brain_checkout.sh
      env:
        BRAIN_REPO_URL: https://github.com/unifyai/brain.git

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        pip install uv
        python3 scripts/configure_ci_uv_sources.py
        uv sync --all-groups --all-extras

    - name: Run deploy tests
      run: .venv/bin/python -m pytest -vs tests/deployment_reconcile tests/assistant_deployments
      env:
        UNIFY_KEY: ${{ secrets.UNIFY_KEY }}
        ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}

  adapter_tests:
    runs-on: ubuntu-latest
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Auth into Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY }}'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configure git for private repos
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        pip install uv
        python3 scripts/configure_ci_uv_sources.py
        uv sync --all-groups --all-extras

    - name: Run adapter tests
      run: .venv/bin/python -m pytest -vs tests/communication/adapters/ -m "not live"
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        LIVEKIT_SIP_URI: ${{ secrets.LIVEKIT_SIP_URI }}
        LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}
        UNITY_COMMS_URL: ${{ secrets.UNITY_COMMS_URL }}
        UNITY_ADAPTERS_URL: ${{ secrets.UNITY_ADAPTERS_URL }}
        DEPLOY_ENV: staging
        GCP_PROJECT_ID: gcp-project-runtime

    - name: Run unify attachment tests
      run: .venv/bin/python -m pytest -vs tests/communication/unify/
      env:
        ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}
        GCP_PROJECT_ID: gcp-project-runtime

  live_adapter_endpoint_tests:
    runs-on: ubuntu-latest
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_live_endpoint_tests == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Auth into Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY }}'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configure git for private repos
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        pip install uv
        python3 scripts/configure_ci_uv_sources.py
        uv sync --all-groups --all-extras

    - name: Run live adapter endpoint tests
      run: .venv/bin/python -m pytest -vs tests/communication/adapters/test_endpoints.py
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        LIVEKIT_SIP_URI: ${{ secrets.LIVEKIT_SIP_URI }}
        LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}
        UNITY_COMMS_URL: ${{ secrets.UNITY_COMMS_URL }}
        UNITY_ADAPTERS_URL: ${{ secrets.UNITY_ADAPTERS_URL }}
        DEPLOY_ENV: staging
        GCP_PROJECT_ID: gcp-project-runtime
