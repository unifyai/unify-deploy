name: Hosted infrastructure tests

on:
  # Called by hosted-tests-release-gate.yml to publish the required
  # "Hosted tests" context. The gate calls this workflow rather than
  # provisioning its own copy: the setup below (private-repo git config,
  # brain checkout, portaudio, uv sync) is exercised on every tagged push,
  # and a required check should not sit behind provisioning nothing else
  # runs.
  workflow_call:
    inputs:
      release_tier:
        description: Run the deterministic suites unconditionally, for the release gate
        required: false
        default: false
        type: boolean

  # Manual trigger - always runs tests
  workflow_dispatch:
    inputs:
      live_endpoint_tests:
        description: Run live adapter endpoint tests that require cloud credentials and external services
        required: false
        default: false
        type: boolean

  # Push events - tests only run if commit message contains [run-tests]
  push:
    branches:
    - '**'

  # Pull request events - tests only run if PR title contains [run-tests]
  pull_request:
    branches:
    - '**'

jobs:
  # Determine if tests should run based on trigger and commit/PR message
  should-run-tests:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
      run_live_endpoint_tests: ${{ steps.check.outputs.run_live_endpoint_tests }}
    steps:
    - name: Check if tests should run
      id: check
      env:
        EVENT_NAME: ${{ github.event_name }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        RELEASE_TIER: ${{ inputs.release_tier }}
      run: |
        echo "run_live_endpoint_tests=false" >> "$GITHUB_OUTPUT"

        # The release gate calls this workflow, so the caller's event is the
        # PR that asked for it, not workflow_call. Keying off the input rather
        # than the event is what stops the gate falling through to the
        # [run-tests] title check below and skipping itself green.
        if [[ "$RELEASE_TIER" == "true" ]]; then
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
          echo "Tests triggered by the release gate"
          exit 0
        fi

        # workflow_dispatch always runs tests
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.inputs.live_endpoint_tests }}" == "true" ]]; then
            echo "run_live_endpoint_tests=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Tests triggered by workflow_dispatch"
          exit 0
        fi

        # For push events, check commit message for [run-tests]
        if [[ "$EVENT_NAME" == "push" ]]; then
          if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by commit message containing [run-tests]"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "Skipping tests - commit message does not contain [run-tests]"
          fi
          exit 0
        fi

        # For pull_request events, check PR title for [run-tests]
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by PR title containing [run-tests]"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "Skipping tests - PR title does not contain [run-tests]"
          fi
          exit 0
        fi

        # Default: don't run tests
        echo "run_tests=false" >> "$GITHUB_OUTPUT"
        echo "Skipping tests - unknown event type"

  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Format check (locked black)
      run: |
        uv sync --only-group lint --no-install-project --frozen
        uv run --no-sync black --check .

  # Both suites below need credentials before they need code: the private
  # dependencies (brain, unisdk, branding) are cloned during setup and the
  # adapters suite authenticates to GCP. Without them the jobs die inside
  # `git` or `uv sync` with an error that reads like a broken dependency
  # rather than an unset secret -- which is how the same missing clone
  # credential sat behind 100 straight ghcr-selfhost failures without being
  # named. This job says which secret is absent, once, before anything is
  # installed.
  preflight:
    runs-on: ubuntu-latest
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    steps:
    - name: Required secrets are present
      env:
        CI_CLONE_APP_PRIVATE_KEY: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
      run: |
        if [ -z "$CI_CLONE_APP_PRIVATE_KEY" ]; then
          echo "::error::Missing secret CI_CLONE_APP_PRIVATE_KEY, the private key"
          echo "::error::of the unifyai-ci-clone App, which mints the token that"
          echo "::error::clones the private dependencies (brain, branding). Set it"
          echo "::error::on unifyai/unify-deploy before these suites can run."
          exit 1
        fi
        echo "CI_CLONE_APP_PRIVATE_KEY is present."

  deploy_tests:
    runs-on: ubuntu-latest
    needs: [should-run-tests, preflight]
    if: needs.should-run-tests.outputs.run_tests == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Scoped to the two private dependencies and revoked when the job ends.
    # 4606137 is the unifyai-ci-clone App, which holds Contents: Read only;
    # an App id is not a secret.
    - name: Mint a token that can read the private dependencies
      id: clone-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: '4606137'
        private-key: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: brain,branding

    - name: Configure git for private repos
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GH_TOKEN: ${{ steps.clone-token.outputs.token }}

    - name: Checkout brain tip for clients/unify_company symlink
      run: |
        chmod +x deploy/scripts/ensure_brain_checkout.sh
        if [ "${{ github.ref_name }}" = "main" ]; then
          export BRAIN_REF=main
        else
          export BRAIN_REF=staging
        fi
        deploy/scripts/ensure_brain_checkout.sh
      env:
        BRAIN_REPO_URL: https://github.com/unifyai/brain.git

    - name: Checkout first-party path dependencies
      env:
        UNIFY_DEPLOY_CI_FIRST_PARTY_BRANCH: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
      run: bash scripts/checkout_ci_path_deps.sh

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        pip install uv
        uv sync --all-groups --all-extras

    # No credentials: these suites reach no backend. The sync tests are served
    # by an in-memory Orchestra and the rest set whatever environment they
    # assert on. A required check that carries a key fails whenever that key
    # rotates or lapses, for reasons that have nothing to do with the diff.
    - name: Run deploy tests
      run: .venv/bin/python -m pytest -vs tests/deployment_reconcile tests/assistant_deployments

  adapter_tests:
    runs-on: ubuntu-latest
    needs: [should-run-tests, preflight]
    if: needs.should-run-tests.outputs.run_tests == 'true'
    steps:
    - uses: actions/checkout@v4

    # No GCP auth: every test this job runs is deselected from the live tier
    # and touches no cloud service. It authenticated only because collecting
    # test_endpoints.py built a Pub/Sub client at import, which is now deferred
    # to first use. The one job that genuinely needs a cloud credential still
    # authenticates for itself, below.

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Scoped to the two private dependencies and revoked when the job ends.
    # 4606137 is the unifyai-ci-clone App, which holds Contents: Read only;
    # an App id is not a secret.
    - name: Mint a token that can read the private dependencies
      id: clone-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: '4606137'
        private-key: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: brain,branding

    - name: Configure git for private repos
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GH_TOKEN: ${{ steps.clone-token.outputs.token }}

    - name: Checkout first-party path dependencies
      env:
        UNIFY_DEPLOY_CI_FIRST_PARTY_BRANCH: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
      run: bash scripts/checkout_ci_path_deps.sh

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        pip install uv
        uv sync --all-groups --all-extras

    - name: Run adapter tests
      run: .venv/bin/python -m pytest -vs tests/communication/adapters/ -m "not live"
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        LIVEKIT_SIP_URI: ${{ secrets.LIVEKIT_SIP_URI }}
        LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}
        UNIFY_COMMS_URL: ${{ secrets.UNIFY_COMMS_URL }}
        UNIFY_ADAPTERS_URL: ${{ secrets.UNIFY_ADAPTERS_URL }}
        DEPLOY_ENV: staging
        GCP_PROJECT_ID: gcp-project-runtime

    - name: Run unify attachment tests
      run: .venv/bin/python -m pytest -vs tests/communication/unify/
      env:
        ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}
        GCP_PROJECT_ID: gcp-project-runtime

    # The shared helpers and the meet surfaces every adapter builds on. No job
    # ran these until now, which is how a voice contract and four other stale
    # tests sat red on staging for six weeks without anything noticing.
    #
    # A separate invocation rather than paths appended above: tests/communication
    # is itself a package named `communication`, so collecting these alongside
    # the suites above shadows the real top-level package and the import of
    # communication.infra.views fails.
    - name: Run shared communication tests
      run: |
        .venv/bin/python -m pytest -vs \
          tests/communication/common/ \
          tests/communication/test_dependencies_auth.py \
          tests/communication/test_meet_bridge.py \
          tests/communication/test_meet_desktop_page.py \
          tests/communication/test_meet_events.py \
          tests/communication/test_meet_screenshare.py
      env:
        ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}
        GCP_PROJECT_ID: gcp-project-runtime

  live_adapter_endpoint_tests:
    runs-on: ubuntu-latest
    needs: [should-run-tests, preflight]
    if: needs.should-run-tests.outputs.run_live_endpoint_tests == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Auth into Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY }}'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Scoped to the two private dependencies and revoked when the job ends.
    # 4606137 is the unifyai-ci-clone App, which holds Contents: Read only;
    # an App id is not a secret.
    - name: Mint a token that can read the private dependencies
      id: clone-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: '4606137'
        private-key: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: brain,branding

    - name: Configure git for private repos
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GH_TOKEN: ${{ steps.clone-token.outputs.token }}

    - name: Checkout first-party path dependencies
      env:
        UNIFY_DEPLOY_CI_FIRST_PARTY_BRANCH: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
      run: bash scripts/checkout_ci_path_deps.sh

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        pip install uv
        uv sync --all-groups --all-extras

    - name: Run live adapter endpoint tests
      run: .venv/bin/python -m pytest -vs tests/communication/adapters/test_endpoints.py
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        LIVEKIT_SIP_URI: ${{ secrets.LIVEKIT_SIP_URI }}
        LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}
        UNIFY_COMMS_URL: ${{ secrets.UNIFY_COMMS_URL }}
        UNIFY_ADAPTERS_URL: ${{ secrets.UNIFY_ADAPTERS_URL }}
        DEPLOY_ENV: staging
        GCP_PROJECT_ID: gcp-project-runtime
