name: Rebuild on upstream change

on:
  repository_dispatch:
    types: [upstream-updated]

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.client_payload.branch }}

    - name: Update upstream SHA and push
      run: |
        BRANCH="${{ github.event.client_payload.branch }}"
        SHA="${{ github.event.client_payload.sha }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        echo "$SHA" > .upstream-sha
        git add .upstream-sha

        if git diff --cached --quiet; then
          echo "Upstream SHA unchanged, skipping"
          exit 0
        fi

        git commit -m "chore: rebuild for upstream ${SHA:0:8}"
        git push origin HEAD:"$BRANCH"
