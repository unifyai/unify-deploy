on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install black
      run: pip install black

    - name: Run black check
      run: black --diff --color --check .
