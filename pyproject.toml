[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-deploy"
version = "0.1.0"
description = "Enterprise deployment overlay for Unity"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."unity_deploy.init"]
enterprise = "unity_deploy.hook:startup_hook"

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "autoflake>=2.3.1",
    "black==26.1.0",
]

[tool.setuptools.packages.find]
include = ["unity_deploy*"]
