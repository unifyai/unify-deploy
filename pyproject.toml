[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-deploy"
version = "0.0.0"
description = "Hosted deployment and communication infrastructure for Unity"
requires-python = ">=3.12,<4.0"
dependencies = [
    "acme>=5.0.0",
    "aiohttp>=3.9.0",
    "azure-identity>=1.14.0",
    "cryptography>=42.0.0",
    "fastapi>=0.104.0",
    "google-api-python-client>=2.70.0",
    "google-auth>=2.17.0",
    "google-cloud-compute>=1.14.0",
    "google-cloud-dns>=0.35.0",
    "google-cloud-pubsub>=2.18.0",
    "google-cloud-secret-manager>=2.16.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-tasks>=2.22.0",
    "httpx",
    "josepy>=2.0.0",
    "kubernetes>=35.0.0,<36.0.0",
    "livekit>=0.11.0",
    "livekit-api>=0.4.0",
    "msgraph-sdk>=1.0.0",
    "pillow",
    "prometheus_client>=0.20.0",
    "pyproj",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "shapely",
    "twilio>=8.0.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
comms = [
    "unillm",
]
adapters = [
    "azure-identity>=1.14.0",
    "fastapi>=0.104.0",
    "google-api-python-client>=2.70.0",
    "google-auth>=2.17.0",
    "google-cloud-pubsub>=2.18.0",
    "google-cloud-secret-manager>=2.16.0",
    "google-cloud-storage>=2.10.0",
    "httpx>=0.25.0",
    "livekit-api>=0.4.0",
    "msgraph-sdk>=1.0.0",
    "prometheus_client>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "twilio>=8.0.0",
    "uvicorn[standard]>=0.24.0",
]

[project.entry-points."unity_deploy.init"]
enterprise = "unity_deploy.hook:startup_hook"

[project.entry-points."unity.deploy_runtime"]
enterprise = "unity_deploy.runtime:register_runtime_backends"

[dependency-groups]
# Formatters are the single source of truth for the pinned versions CI and
# pre-commit both run. Keep them here (locked in uv.lock), not duplicated in the
# pre-commit hook.
lint = [
    "black==26.5.1",
    "autoflake>=2.3.1",
]
dev = [
    "unity",
    "unify",
    "unillm",
    "pre-commit>=4.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-env>=1.1.5",
    {include-group = "lint"},
]

[tool.uv.sources]
unity = { path = "../unity", editable = true }
unify = { path = "../unify", editable = true }
unillm = { path = "../unillm", editable = true }

[tool.pyright]
extraPaths = ["../unity", "../unify", "../unillm", "."]
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"

[tool.basedpyright]
extraPaths = ["../unity", "../unify", "../unillm", "."]
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"

[tool.setuptools.packages.find]
include = ["unity_deploy*", "communication*", "adapters*", "common*"]

[tool.setuptools.package-data]
"unity_deploy" = ["**/*.json", "**/*.md", "**/*.py", "**/*.yaml", "**/*.yml"]
"*" = ["*.json", "*.md", "*.yaml", "*.yml", "data/*.json", "data/*.md", "data/*.yaml", "data/*.yml"]
"communication" = ["**/*.md", "**/*.ps1", "**/*.sh", "**/*.html", "**/*.conf", "**/*.hcl"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
    "live: tests that require deployed cloud resources or provider credentials",
    "integration: tests that exercise cross-service or deployed infrastructure contracts",
    "invariant: tests that validate hosted infrastructure invariants",
    "slow: tests that are too slow for the default hosted CI path",
    "merge_gate: minimal representative subset run live against staging to gate staging -> main merges",
]
env = [
    "GRPC_ENABLE_FORK_SUPPORT=0",
    "GRPC_VERBOSITY=ERROR",
    "GRPC_POLL_STRATEGY=poll",
]
