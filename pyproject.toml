[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-deploy"
version = "0.1.0"
description = "Enterprise deployment overlay for Unity"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0",
    "google-cloud-storage>=2.14",
    "google-cloud-pubsub>=2.19",
]

[project.entry-points."unity_deploy.init"]
enterprise = "unity_deploy.hook:startup_hook"

[project.entry-points."unity.deploy_runtime"]
enterprise = "unity_deploy.runtime:register_runtime_backends"

[dependency-groups]
dev = [
    "unity",
    "unify",
    "unillm",
    "pre-commit>=4.0.1",
    "autoflake>=2.3.1",
    "black==26.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv.sources]
unity = { path = "../unity", editable = true }
unify = { path = "../unify", editable = true }
unillm = { path = "../unillm", editable = true }

[tool.pyright]
extraPaths = ["../unity", "../unify", "../unillm"]
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"

[tool.basedpyright]
extraPaths = ["../unity", "../unify", "../unillm"]
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"

[tool.setuptools.packages.find]
include = ["unity_deploy*"]

[tool.setuptools.package-data]
"unity_deploy" = ["**/*.json", "**/*.md"]
