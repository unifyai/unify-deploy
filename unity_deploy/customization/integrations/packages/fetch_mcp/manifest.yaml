name: Fetch
slug: fetch_mcp
version: "0.1.0"
sector: utilities
tier: mcp
quality: bronze
description: >
  Fetch web pages and convert them to markdown via the official
  MCP Fetch server.  Useful for giving the assistant access to
  live web content without browser automation.
homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/fetch

mcp:
  command: npx
  args: ["-y", "@modelcontextprotocol/server-fetch"]
  transport: stdio

capabilities:
- id: web_fetch
  name: Web Content Fetch
  description: Fetch a URL and return its content as markdown
  guidance: [web_fetching]

tags: [fetch, web, mcp, utilities]
