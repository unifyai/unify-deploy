- id: influencers.x.reply_bot
  enabled: true
  execution_mode: offline
  schedule:
    type: cron
    cron: '*/30 * * * *'
  target:
    assistant_id: ''
    scenario_id: brain_jobs_v0
    tick_policy: incrementing
  activation:
    entrypoint_function: run_x_reply_bot_session
    task_name: 'X reply bot: every 30 min, one personalised reply'
    task_description: "Every 30 minutes, run one automated X reply session as the operator's personal handle. Discovers fresh\
      \ (last ~60 min) root posts from search queries + a watchlist where `droid` is genuinely relevant, ranks them for early-reply\
      \ value (recency + author reach + velocity, penalising posts that already have many replies), and posts at most max_per_session\
      \ (default 1) short, personalised replies explaining how droid handles that exact problem differently. An LLM relevance\
      \ gate declines when droid isn't a real fit, every reply is unique (human voice), links route through r.unify.ai, and\
      \ state in data/influencers/x/reply_bot/ dedupes tweets/authors and enforces the daily_cap. Fully automated \u2014 no\
      \ review gate; the operator audits via sessions.jsonl + the X app and tunes the config/prompt over time. NOT the social-post\
      \ reposting tick \u2014 that broadcasts our own commentary on others' work; this replies directly under other people's\
      \ posts."
    visibility_policy: silent_by_default
    recurrence_hint: every_30_minutes
  delivery:
    phase: real_delivery
- id: influencers.x.dm_campaign
  enabled: true
  execution_mode: offline
  schedule:
    type: cron
    cron: '*/30 * * * *'
  target:
    assistant_id: ''
    scenario_id: brain_jobs_v0
    tick_policy: incrementing
  activation:
    entrypoint_function: run_x_dm_campaign_session
    task_name: 'X DM outreach: one personalised DM per ~30 min'
    task_description: "Every 30 minutes, send at most one personalised cold-outreach DM from the operator's handle to the\
      \ next account on the real-influencer shortlist (_real_targets_shortlist.csv). A CodeActActor researches the target\
      \ (their recent posts + their work via primitives.web) and writes a genuine, specific DM pointing at the droid demo\
      \ \u2014 or skips when there's no real hook. Self-throttling and built to run for months unattended: a warm-up ramp\
      \ (15->40/day) plus a daily cap bound volume, sends are deduped across every campaign send-log (never DM anyone twice),\
      \ closed-DM accounts are skipped, and the whole thing is idempotent/resumable so a missed or doubled tick is harmless.\
      \ When the current shortlist is exhausted it simply no-ops until new targets are added by the reply bot / engagement\
      \ archaeology. Cold automated DMs are the highest-risk X automation, so the cadence is deliberately a trickle, far below\
      \ X's technical cap."
    visibility_policy: silent_by_default
    recurrence_hint: every_30_minutes
  delivery:
    phase: real_delivery
