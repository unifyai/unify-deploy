  activation:
    entrypoint_function: run_social_post_post_approved
    task_name: 'X post: hourly poll approvals + publish'
    task_description: "Hourly check (REST poll — the bot receives no push events): read ✅/❌ reactions and any thread/inline-reply revisions on the Discord review cards, move review/ records to approved/ or rejected/, then drain data/intel/social_post/candidates/<date>/x/approved/ and publish each via the X API (XClient.create_tweet) from the operator's personal handle, moving shipped records to posted/ and stamping the tweet URL. v1 review-gate policy: only operator-approved items are posted, so an empty approved/ is a no-op. Also runs the daily OAuth2 token keepalive so the refresh chain never lapses, and posts a Discord digest of what shipped. daily_post_limit caps posts PER RUN at 1 so approvals trickle out at most one per hour."
    visibility_policy: silent_by_default
    recurrence_hint: hourly
