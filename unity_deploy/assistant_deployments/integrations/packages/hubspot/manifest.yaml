  guidance: [hubspot_marketing]

- id: hubspot_marketing_events
  name: Marketing Events
  description: External hubspot_marketing events with attendance tracking.
  functions: [list_hubspot_marketing_events, create_hubspot_marketing_event, update_hubspot_marketing_event, list_hubspot_event_attendance, sync_hubspot_marketing_events]
