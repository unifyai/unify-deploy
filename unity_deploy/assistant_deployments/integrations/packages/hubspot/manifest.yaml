  description: Outbound cadences (tier-gated, Sales Hub Pro+).
  functions: [list_hubspot_sequences, get_hubspot_sequence, enroll_in_hubspot_sequence, unenroll_from_hubspot_sequence, sync_hubspot_sequences]
