name: HubSpot
slug: hubspot
version: "0.1.0"
sector: crm
tier: api
quality: silver
description: >
  HubSpot integration covering CRM, Engagements, Marketing, Sales, Service,
  CMS, Platform, and Analytics surfaces via the HubSpot v3 APIs.  Provides
  on-demand lookups + mutations and an incremental sync that mirrors objects
  into the assistant's DataManager so the LLM can answer locally and reduce
  round-trips to HubSpot.  Authenticated using a HubSpot Private App access
  token supplied via the assistant Secret Manager.  On-demand functions
  default to mock=True for safe testing; sync functions require a live token.
  Tier-gated capabilities (Sequences, Workflows, SMS, Custom Reports, etc.)
  detect 403 responses and return a graceful error rather than raising.
homepage: https://developers.hubspot.com/docs/api/private-apps

secrets:
- name: HUBSPOT_PRIVATE_APP_TOKEN
  description: >
    HubSpot Private App access token.  Create at Settings -> Integrations
    -> Private Apps in HubSpot.  Recommended scopes for full functionality:
    crm.objects.contacts.read/write, crm.objects.companies.read/write,
    crm.objects.deals.read/write, crm.objects.tickets.read/write,
    crm.objects.line_items.read/write, crm.objects.products.read/write,
    crm.objects.hubspot_quotes.read/write, crm.objects.owners.read,
    crm.objects.calls.read/write, crm.objects.emails.read/write,
    crm.objects.meetings.read/write, crm.objects.notes.read/write,
    crm.objects.tasks.read/write, crm.lists.read/write,
    crm.schemas.contacts.read, crm.schemas.companies.read,
    crm.schemas.deals.read, crm.schemas.tickets.read,
    crm.schemas.custom.read, crm.objects.custom.read/write,
    forms, content, files, hubdb, automation, hubspot_sales-email-read.
    Optional scopes unlock specific Hubs (sequences, conversations, etc.).
  required: false
  sensitive: true

- name: HUBSPOT_PORTAL_ID
  description: >
    Numeric HubSpot account/portal ID.  Optional - used to construct
    HubSpot UI deep links in assistant responses.  If unset,
    platform_account_info() will populate it from the API.
  required: false
  sensitive: false

capabilities:
  # ----- CRM ---------------------------------------------------------------
- id: hubspot_contact_management
  name: Contact Management
  description: Look up, create, update, and delete HubSpot contacts.
  functions: [get_hubspot_contact, search_hubspot_contacts, list_hubspot_contacts, create_hubspot_contact, update_hubspot_contact, delete_hubspot_contact, sync_hubspot_contacts]
  guidance: [hubspot_crm_contacts, hubspot_overview, hubspot_local_vs_live]

- id: hubspot_company_records
  name: Company Records
  description: Look up and maintain company records.
  functions: [get_hubspot_company, search_hubspot_companies, list_hubspot_companies, create_hubspot_company, update_hubspot_company, delete_hubspot_company, sync_hubspot_companies]
  guidance: [hubspot_crm_companies, hubspot_overview, hubspot_local_vs_live]

- id: hubspot_deal_pipeline
  name: Deal Pipeline
  description: Inspect and progress deals in the hubspot_sales pipeline.
  functions: [get_hubspot_deal, search_hubspot_deals, list_hubspot_deals, create_hubspot_deal, update_hubspot_deal, delete_hubspot_deal, transition_hubspot_deal_stage, sync_hubspot_deals]
  guidance: [hubspot_crm_deals, hubspot_overview, hubspot_local_vs_live]

- id: hubspot_ticket_management
  name: Ticket Management
  description: Service ticket CRUD.
  functions: [get_hubspot_ticket, search_hubspot_tickets, list_hubspot_tickets, create_hubspot_ticket, update_hubspot_ticket, sync_hubspot_tickets]
  guidance: [hubspot_crm_tickets, hubspot_overview]

- id: hubspot_line_items_and_products
  name: Line Items and Products
  description: Catalog products and deal line items.
  functions: [get_hubspot_line_item, list_hubspot_line_items, create_hubspot_line_item, update_hubspot_line_item, sync_hubspot_line_items, get_hubspot_product, list_hubspot_products, search_hubspot_products, create_hubspot_product, update_hubspot_product, sync_hubspot_products]
  guidance: [hubspot_overview]

- id: hubspot_quotes
  name: Quotes
  description: Build and send hubspot_quotes from deals.
  functions: [get_hubspot_quote, list_hubspot_quotes, create_hubspot_quote, update_hubspot_quote, send_hubspot_quote, sync_hubspot_quotes]
  guidance: [hubspot_crm_quotes, hubspot_high_stakes_writes]

- id: hubspot_custom_objects
  name: Custom Objects
  description: Discover and work with portal-specific custom object schemas.
  functions: [discover_hubspot_custom_object_schemas, get_hubspot_custom_object_record, search_hubspot_custom_objects, list_hubspot_custom_objects, create_hubspot_custom_object_record, update_hubspot_custom_object_record, sync_hubspot_custom_objects]
  guidance: [hubspot_crm_custom_objects, hubspot_overview]

- id: hubspot_associations
  name: Associations
  description: Link records across object types using the v4 association API.
  functions: [list_hubspot_associations, create_hubspot_association, delete_hubspot_association, sync_hubspot_associations]
  guidance: [hubspot_overview]

- id: hubspot_lists_and_segments
  name: Lists and Segments
  description: CRUD on contact lists; manage memberships of static lists.
  functions: [get_hubspot_list, list_hubspot_lists, create_hubspot_list, delete_hubspot_list, add_contact_to_hubspot_list, remove_contact_from_hubspot_list, sync_hubspot_lists]
  guidance: [hubspot_crm_lists_and_workflows]

- id: hubspot_properties_metadata
  name: Properties Metadata
  description: Property schemas per object type, and create custom properties.
  functions: [list_hubspot_properties, get_hubspot_property, create_hubspot_property, sync_hubspot_properties]
  guidance: [hubspot_overview]

- id: hubspot_feedback_and_goals
  name: Feedback and Goals
  description: NPS/CSAT feedback submissions and HubSpot goals.
  functions: [list_hubspot_feedback_submissions, sync_hubspot_feedback, list_hubspot_goals, sync_hubspot_goals]
  guidance: [hubspot_overview]

  # ----- Engagements -------------------------------------------------------
- id: hubspot_engagement_logging
  name: Engagement Logging
  description: Log activity (calls, emails, meetings, notes, tasks) against CRM records.
  functions: [log_hubspot_call, list_hubspot_calls, sync_hubspot_calls, log_hubspot_email, list_hubspot_emails, sync_hubspot_emails, log_hubspot_meeting, list_hubspot_meetings, sync_hubspot_meetings, create_hubspot_note, list_hubspot_notes, sync_hubspot_notes, create_hubspot_task, update_hubspot_task, complete_hubspot_task, list_hubspot_tasks, sync_hubspot_tasks]
  guidance: [hubspot_engagements]

  # ----- Marketing Hub -----------------------------------------------------
- id: hubspot_marketing_forms
  name: Marketing Forms
