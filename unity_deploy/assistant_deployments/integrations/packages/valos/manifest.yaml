name: Valos
slug: valos
version: "0.3.0"
sector: real-estate
tier: api
quality: bronze
description: >
  UK property valuation data layer.  Wraps the Ordnance Survey Data Hub
  (OS Maps API for raster tiles, OS Names API for geocoding, OS Places
  API for UPRN lookup) and PropertyData (Land Registry freeholds,
  INSPIRE polygon geometry, title information) and exposes them to the
  actor as typed primitives covering address resolution, freehold title
  lookup, polygon retrieval, demographic context, and OS-tiled map
  rendering.  Replaces the placeholder pass-through to api.valos.ai.
  Opt-in via two equivalent activation paths: deploy-time wiring through
  the ``integrations=[...]`` argument on ``BASE_SPEC.derive(...)``
  (typically with Unify-owned shared credentials), or per-assistant
  Console paste through the ``valos`` entry in
  ``INTEGRATION_PROVIDERS`` (for one-off testing or BYO-keys clients).
  Either path lands the same two secrets in the assistant's
  ``/Secrets`` context.
homepage: https://osdatahub.os.uk

secrets:
- name: OS_MAPS_API_KEY
  description: >
    OS Data Hub project API key with access to OS Maps, OS Names, and
    OS Places.  May be Unify-owned (deploy-time path) or
    customer-supplied (Console-paste path) — the runtime is indifferent.
    Premium plan recommended to cover OS Places; on Free, geocoding
    falls through to OS Names.  The simple ``?key=...`` query-param
    flow is used; the OS "Project API Secret" (OAuth
    client-credentials path) is unused.  Distributing OS rasters in
    customer-deliverable Word reports is redistribution and may require
    a separate OS Partner / OS Reseller agreement — confirm commercial
    terms with Ordnance Survey before producing client-deliverable maps.
  required: true
  sensitive: true
- name: PROPERTYDATA_API_KEY
  description: >
    PropertyData API key with the Land Registry endpoints enabled
    (``/api/freeholds`` and ``/api/title-information``).  May be
    Unify-owned (deploy-time path) or customer-supplied (Console-paste
    path).  PropertyData ToS includes reseller / multi-tenant clauses;
    confirm reseller / multi-tenant terms with PropertyData before
    using a single Unify-owned key across multiple client deployments.
  required: true
  sensitive: true

capabilities:
- id: valos_geocode
  name: Address geocoding
  description: >
    Resolve a free-text address or postcode to coordinates and a UPRN
    via OS Places + OS Names.
  functions: [valos_geocode]
- id: valos_freeholds
  name: Freehold title lookup
  description: >
    Look up registered freehold titles for a postcode or coordinate
    pair, returning title numbers, INSPIRE ids, tenure, and whether
    polygon geometry is available.
  functions: [valos_lookup_freeholds]
- id: valos_title_polygon
  name: Title boundary polygon
  description: >
    Resolve a title number or INSPIRE id to a GeoJSON polygon, plot
    size, and ownership type.  Backed by PropertyData's structured
    wrapper around HM Land Registry's INSPIRE Index Polygons.
  functions: [valos_get_title_polygon]
- id: valos_demographics
  name: Postcode demographics
  description: >
    Census, deprivation, and wealth indicators for a postcode and
    surrounding radius via the Office for National Statistics open
    APIs.  Closes the demographics gap to Carterwood for non-care-
    home-specific context.
  functions: [valos_postcode_demographics]
- id: valos_render
  name: OS map rendering
  description: >
    Render OS Maps WMTS tiles to a PNG, optionally with a polygon
    overlay, north arrow, and scale bar.  ``valos_render_location_plan``
    composes a Land-Registry-style location plan; ``valos_render_competitor_map``
    layers numbered pins for nearby competitors.  All renderers persist
    PNGs at the supplied filesystem path so ``ImageManager`` can resolve
    them later via filepath.
  functions:
  - valos_render_os_map
  - valos_render_location_plan
  - valos_render_competitor_map

requirements:
- httpx
- pillow
- shapely
- pyproj

tags:
- valos
- property
- valuation
- real-estate
- ordnance-survey
- land-registry
- propertydata
- ons
- rics
