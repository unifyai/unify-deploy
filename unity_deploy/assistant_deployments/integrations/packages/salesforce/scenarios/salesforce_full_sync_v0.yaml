scenario_id: salesforce_full_sync_v0
name: Salesforce Full Sync (v0)
description: >-
  Incremental Salesforce sync into the assistant's DataManager.  Runs
  on a scheduler tick; the orchestrator gates per-object cadence by
  env config so the scheduler tick rate is decoupled from actual sync
  work.
#
# TEMPLATE - this generic scenario is shipped for reference only.  The
# salesforce package's manifest does NOT declare ``scenarios: [...]``,
# so this file is not auto-loaded.  Per-client deployments that want
# scheduled Salesforce sync activate it via
# ``unity_deploy.assistant_deployments.scenarios.types.ScenarioActivation``
# declared on a ``SeedLayer`` or ``DeploymentSpec``:
#
#     register_layer("clientzeta", "assistant", "630", SeedLayer(
#         scenarios=[
#             ScenarioActivation(
#                 scenario_template="salesforce/salesforce_full_sync_v0",
#                 assistant_id="630",
#                 tasks_enabled=False,
#             ),
#         ],
#     ))
#
client: ""           # set per-client by ScenarioActivation
deployment: ""       # set per-client by ScenarioActivation

integration:
  package_slug: salesforce
  mode: real
  required_capabilities:
  - salesforce_account
  - salesforce_accounts
  - salesforce_contacts
  - salesforce_leads
  - salesforce_opportunities
  - salesforce_cases
  - salesforce_incremental_sync
  schema_version: salesforce.crm.sync.v1

data_targets:
  # ----- CRM core ---------------------------------------------------
- {table: salesforce_accounts, context: Salesforce/Accounts, unique_key: id, description: Salesforce Accounts (companies / orgs).}
- {table: salesforce_contacts, context: Salesforce/Contacts, unique_key: id, description: Salesforce Contacts; email lower-cased for cross-app join.}
- {table: salesforce_leads, context: Salesforce/Leads, unique_key: id, description: Salesforce Leads (unqualified prospects).}
- {table: salesforce_opportunities, context: Salesforce/Opportunities, unique_key: id, description: Salesforce Opportunities; pipeline records linked to Accounts.}
- {table: salesforce_cases, context: Salesforce/Cases, unique_key: id, description: Salesforce Cases (service / support).}

  # ----- Sync metadata ----------------------------------------------
- {table: sync_state, context: Salesforce/Meta/SyncState, unique_key: object_type, description: Per-object last-synced watermarks.}
- {table: sync_runs, context: Salesforce/Meta/SyncRuns, description: Append-only audit log of sync ticks.}

timeline:
- tick: 0
  capability: salesforce_incremental_sync
  function: run_salesforce_sync_tick
  label: Initial sync
  args: {full: true}
- tick: 1
  capability: salesforce_incremental_sync
  function: run_salesforce_sync_tick
  label: Incremental delta
  args: {}

tasks:
- id: salesforce_sync_tick
    # Disabled by default - keep recurring tasks off until the
    # control-plane has real TaskScheduler + FunctionManager IDs seeded.
    # Operators flip to true via ScenarioActivation.tasks_enabled=True.
  enabled: false
  execution_mode: live
  schedule:
    type: interval
      # Scheduler tick rate.  Actual sync cadence is gated inside
      # run_salesforce_sync_tick by SALESFORCE_SYNC_MIN_INTERVAL_SECONDS
      # (default 300) and SALESFORCE_SYNC_OBJECT_INTERVALS for per-object
      # overrides.  A small scheduler interval lets env-var changes take
      # effect on the next tick without redeploying the YAML.
    interval_seconds: 60
  target:
    assistant_id: ""             # set per-client by ScenarioActivation
    scenario_id: salesforce_full_sync_v0
    tick_policy: incrementing
  activation:
    entrypoint_function: run_salesforce_sync_tick
    task_name: Salesforce sync tick
    task_description: >-
      Periodic Salesforce sync into the assistant's DataManager.
      Pulls SystemModstamp deltas using the orchestrator's per-object
      cadence config, upserts into Salesforce/* contexts, and appends
      an audit row to Salesforce/Meta/SyncRuns.
    recurrence_hint: every_minute_with_internal_cadence_gating
    visibility_policy: silent_by_default
  delivery:
    phase: simulated_outbox

monitors: []
alert_routes: []
dashboards: []

metadata:
  owner: salesforce
  documentation: packages/salesforce/guidance/salesforce_sync.md
