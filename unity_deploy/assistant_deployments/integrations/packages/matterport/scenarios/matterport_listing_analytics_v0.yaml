scenario_id: matterport_listing_analytics_v0
name: Matterport Listing Analytics (v0)
description: >-
  Incremental Matterport sync into the assistant's DataManager.  Pulls
  models daily and view stats hourly so the assistant can answer
  engagement questions locally and cross-join against HubSpot leads.
#
# TEMPLATE - this generic scenario is shipped for reference only.  The
# matterport package's manifest does NOT declare ``scenarios: [...]``,
# so this file is not auto-loaded.  Per-client deployments that want
# scheduled Matterport sync activate it via
# ``unity_deploy.assistant_deployments.scenarios.types.ScenarioActivation``
# declared on a ``SeedLayer`` or ``DeploymentSpec``:
#
#     register_layer("clientzeta", "assistant", "<assistant_id>", SeedLayer(
#         scenarios=[
#             ScenarioActivation(
#                 scenario_template="matterport/matterport_listing_analytics_v0",
#                 assistant_id="<assistant_id>",
#                 tasks_enabled=False,
#             ),
#         ],
#     ))
#
# At resolution time, the framework substitutes the empty placeholder
# fields below (``client``, ``deployment``, ``tasks[*].target.assistant_id``,
# ``tasks[*].target.scenario_id``, etc.) with the activation's per-client
# values.  See ScenarioActivation's docstring for the full override surface.
#
client: ""           # set per-client by ScenarioActivation
deployment: ""       # set per-client by ScenarioActivation

integration:
  package_slug: matterport
  mode: real
  required_capabilities:
  - account
  - models
  - view_stats
  - incremental_sync
  schema_version: matterport.listing.sync.v1

data_targets:
  # ----- Dimensions -----------------------------------------------------
- {table: models, context: Matterport/Models, unique_key: model_id, description: Matterport 3D tour models — id, name: null, address: null, internal_label: null, status: null, share_url: null, last_modified.: null}
- {table: model_unit_links, context: Matterport/Links/ModelUnit, unique_key: [model_id, unit_id], description: "Cross-ref between a Matterport model and a RealPage unit; source is one of manual, address_match, or internal_label; carries confidence and linked_at. v1 stores unit_id as free string until RealPage scenario lands."}

  # ----- Facts (time series) -------------------------------------------
- {table: view_stats_daily, context: Matterport/ViewStats/Daily, unique_key: [model_id, day], description: Daily aggregated view stats per model — total_views, unique_visitors: null, avg_seconds: null, top_referrer.: null}
- {table: view_events, context: Matterport/ViewStats/Events, unique_key: event_id, description: Per-session view events with referrer/utm_email; opt-in via MATTERPORT_SYNC_VIEW_EVENTS=true (high volume).}

  # ----- Sync metadata --------------------------------------------------
- {table: sync_state, context: Matterport/Meta/SyncState, unique_key: object_type, description: Per-object last_synced_at watermarks.}
- {table: sync_runs, context: Matterport/Meta/SyncRuns, description: Append-only audit log of sync ticks.}
- {table: capabilities, context: Matterport/Meta/Capabilities, unique_key: probed_at, description: Most recent token capability probe.}

timeline:
- tick: 0
  capability: incremental_sync
  function: run_matterport_sync_tick
  label: Initial sync
  args: {full: true}
- tick: 1
  capability: incremental_sync
  function: run_matterport_sync_tick
  label: Incremental delta
  args: {}

tasks:
- id: matterport_sync_tick
    # Disabled by default per a71a840 - keep recurring tasks off until the
    # control-plane has real TaskScheduler + FunctionManager IDs seeded.
    # Operators flip to true via ScenarioActivation.tasks_enabled=True
    # (or override per-client at deploy time).
  enabled: false
  execution_mode: live
  schedule:
    type: interval
      # Scheduler tick rate.  Actual sync cadence is gated inside
      # run_matterport_sync_tick by MATTERPORT_SYNC_MIN_INTERVAL_SECONDS
      # (default 300) and MATTERPORT_SYNC_OBJECT_INTERVALS for per-object
      # overrides.  A small scheduler interval lets env-var changes take
      # effect on the next tick without redeploying the YAML.
    interval_seconds: 60
  target:
    assistant_id: ""             # set per-client by ScenarioActivation
    scenario_id: matterport_listing_analytics_v0
    tick_policy: incrementing
  activation:
    entrypoint_function: run_matterport_sync_tick
    task_name: Matterport sync tick
    task_description: >-
      Periodic Matterport sync into the assistant's DataManager.
      Pulls deltas using the orchestrator's per-object cadence
      config, upserts into Matterport/* contexts, and appends an
      audit row to Matterport/Meta/SyncRuns.
    recurrence_hint: every_minute_with_internal_cadence_gating
    visibility_policy: silent_by_default
  delivery:
    phase: simulated_outbox

monitors: []
alert_routes: []
dashboards: []

metadata:
  owner: matterport
  documentation: packages/matterport/guidance/matterport_sync_runbook.md
