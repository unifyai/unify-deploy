name: Employment Hero
slug: employment_hero
version: "0.2.0"
sector: human-resources
tier: api
quality: bronze
description: >
  Generic, reusable Employment Hero HRIS connector covering the public
  API: workforce graph (employees, employments, positions, teams,
  locations); leave; time tracking; expenses; HR policies and
  acknowledgements; documents (metadata); custom fields; onboarding;
  qualifications/certifications with expiry tracking; performance
  management (reviews, goals, 1:1s, feedback); recognition; surveys;
  learning; recruitment; pay runs and employment terms.  Live reads
  and writes go through a single ``employmenthero_request`` tool that
  exposes the underlying authenticated HTTP client to the actor.  Bulk
  pulls go through ``run_employmenthero_sync_tick`` which mirrors
  objects into DataManager.  Authenticated via OAuth 2.0
  (authorization code flow) against an Employment Hero developer-portal
  app the customer registers.  No code-level write gating — the actor
  applies the rules in ``employmenthero_high_stakes_writes`` and
  ``employmenthero_sensitive_data`` before issuing destructive verbs
  or surfacing PII.  403 responses are returned as a graceful error
  envelope, not raised, so capability gating is uniform.
homepage: https://employmenthero.com

secrets:
  # ----- Customer-provided OAuth app credentials ------------------------
  # Pasted by the admin via Console -> Settings -> Secrets BEFORE clicking
  # Connect.  Source: an Employment Hero developer-portal app the
  # customer creates at https://developer.employmenthero.com.  The redirect
  # URI registered on that app must match the Console callback URL
  # documented in guidance/employmenthero_setup.md.

  - name: EMPLOYMENTHERO_OAUTH_CLIENT_ID
    description: >
      Client ID from the customer's Employment Hero developer-portal app.
      Required for the OAuth Connect flow.  Add this BEFORE clicking
      Connect in the Integrations modal.  Not sensitive — client_id is
      a public identifier per the OAuth spec.
    required: true
    sensitive: false

  - name: EMPLOYMENTHERO_OAUTH_CLIENT_SECRET
    description: >
      Client Secret from the customer's Employment Hero developer-portal
      app.  Required for the OAuth Connect flow.  Add alongside
      EMPLOYMENTHERO_OAUTH_CLIENT_ID.
    required: true
    sensitive: true

  # ----- OAuth-managed secrets (set by the Console Connect flow) -------
  # Written automatically by the Console OAuth callback after the user
  # grants consent on Employment Hero.  Do not edit manually.

  - name: EMPLOYMENTHERO_REFRESH_TOKEN
    description: >
      Long-lived OAuth refresh token, written automatically by the
      Console Connect flow after the user grants consent on Employment
      Hero.  The package uses this with the customer's CLIENT_ID and
      CLIENT_SECRET to mint short-lived access tokens at runtime.  Do
      not edit manually.
    required: false
    sensitive: true

  - name: EMPLOYMENTHERO_ORGANISATION_ID
    description: >
      Active organisation id.  Auto-pinned by the Console Connect flow
      from ``/api/v1/organisations`` when exactly one named organisation
      is found.  When the token has access to multiple named
      organisations, Connect pins the lexicographically-first one and
      surfaces a notice so the operator can override here via
      Console -> Settings -> Secrets.  Pinned per-assistant so
      org-scoped calls target a single EH organisation.
    required: false
    sensitive: false

capabilities:
  # ----- Live API access -------------------------------------------------
  # Single generic tool — the actor constructs the URL/method/params
  # using EH's API docs and the structured 4xx error envelopes the
  # helper returns when something's malformed.  Writes are NOT gated
  # in code; the actor applies the rules in
  # ``employmenthero_high_stakes_writes`` before issuing destructive
  # verbs.  Sensitive reads (banking, tax, medical, payslips) require
  # confirmation per ``employmenthero_sensitive_data``.
  - id: employmenthero_live
    name: Live API access
    description: >
      One tool covering the entire Employment Hero REST surface
      (workforce, leave, timesheets, expenses, policies, documents,
      custom fields, onboarding, qualifications, performance,
      recognition, surveys, learning, recruitment, pay, banking, tax,
      medical, payslips).  First-page only — bulk pulls go through the
      sync orchestrator.
    functions: [employmenthero_request]
    guidance: [
      employmenthero_overview, employmenthero_setup,
      employmenthero_high_stakes_writes, employmenthero_sensitive_data,
      employmenthero_tier_gating,
    ]

  # ----- Account / org pinning ------------------------------------------
  # Kept as typed helpers because every other call needs the active
  # org id, and the pin-aware fallback in
  # ``get_employmenthero_active_organisation`` saves the actor a few
  # turns of figuring it out.
  - id: employmenthero_account
    name: Account
    description: Verify token; identify and pin the active organisation.
    functions: [
      get_employmenthero_account_info,
      list_employmenthero_organisations,
      get_employmenthero_active_organisation,
    ]
    guidance: [employmenthero_overview, employmenthero_setup]

  # ----- Sync orchestration ---------------------------------------------
  - id: employmenthero_incremental_sync
    name: Incremental sync
    description: >
      Single-tick orchestration across workforce, leave, timesheets,
      expenses, policies, documents, custom fields, onboarding,
      qualifications, performance, recognition, surveys, learning,
      recruitment, and pay (rate-banded).  Runs the internal
      ``sync_employmenthero_*`` snapshot writers and aggregates their
      output into the canonical DataManager envelope.
    functions: [
      run_employmenthero_sync_tick, get_employmenthero_sync_state,
      probe_employmenthero_tier,
    ]
    guidance: [employmenthero_sync_runbook, employmenthero_local_vs_live]

  # ----- Local DataManager query ---------------------------------------
  - id: employmenthero_local_query
    name: Local DataManager query
    description: >
      Query the synced EH copy in DataManager (preferred over live for
      analytics).  Sensitive surfaces (banking, tax, medical, payslips)
      are intentionally not synced — those are live-only via
      ``employmenthero_request`` with explicit user confirmation.
    functions: [
      query_local_employmenthero_employees, query_local_employmenthero_teams,
      query_local_employmenthero_locations,
      query_local_employmenthero_leave_requests,
      query_local_employmenthero_leave_balances,
      query_local_employmenthero_timesheets,
      query_local_employmenthero_expenses,
      query_local_employmenthero_qualifications,
      query_local_employmenthero_expiring_qualifications,
      query_local_employmenthero_onboarding_status,
      query_local_employmenthero_documents,
      query_local_employmenthero_goals, query_local_employmenthero_reviews,
    ]
    guidance: [employmenthero_local_vs_live, employmenthero_overview]

requirements: [httpx]
tags: [employment-hero, hris, hr, payroll-adjacent, compliance, qualifications, leave, timesheets, sync, datamanager]
