name: Employment Hero
slug: employment_hero
version: "0.1.0"
sector: human-resources
tier: api
quality: bronze
description: >
  Generic, reusable Employment Hero HRIS connector covering the public API:
  workforce graph (employees, employments, positions, teams, locations);
  leave (categories, balances, requests); time tracking; expenses; HR
  policies and acknowledgements; documents (metadata); custom fields;
  onboarding; qualifications/certifications with expiry tracking;
  performance management (reviews, goals, 1:1s, feedback); recognition;
  surveys; learning; recruitment; pay runs and employment terms.
  Provides on-demand reads + writes, snapshot functions for incremental
  DataManager sync, and a sync orchestrator. Critical-tier endpoints
  (payslips, banking, tax, medical) are live-only with masked returns.
  Authenticated via a bearer token supplied through the assistant Secret
  Manager.  On-demand functions default to mock=True for safe testing;
  sync functions require a live token.  403 responses are returned as a
  graceful error envelope, not raised, so capability-gating is uniform.
homepage: https://employmenthero.com

secrets:
  # ----- Customer-provided OAuth app credentials ------------------------
  # Pasted by the admin via Console -> Settings -> Secrets BEFORE clicking
  # Connect.  Source: an Employment Hero developer-portal app the
  # customer creates at https://developer.employmenthero.com.  The redirect
  # URI registered on that app must match the Console callback URL
  # documented in guidance/setup.md.

  - name: EMPLOYMENTHERO_OAUTH_CLIENT_ID
    description: >
      Client ID from the customer's Employment Hero developer-portal app.
      Required for the OAuth Connect flow.  Add this BEFORE clicking
      Connect in the Integrations modal.  Not sensitive — client_id is
      a public identifier per the OAuth spec.
    required: false
    sensitive: false

  - name: EMPLOYMENTHERO_OAUTH_CLIENT_SECRET
    description: >
      Client Secret from the customer's Employment Hero developer-portal
      app.  Required for the OAuth Connect flow.  Add alongside
      EMPLOYMENTHERO_OAUTH_CLIENT_ID.
    required: false
    sensitive: true

  # ----- OAuth-managed secrets (set by the Console Connect flow) -------
  # Written automatically by the Console OAuth callback after the user
  # grants consent on Employment Hero.  Do not edit manually.

  - name: EMPLOYMENTHERO_REFRESH_TOKEN
    description: >
      Long-lived OAuth refresh token, written automatically by the
      Console Connect flow after the user grants consent on Employment
      Hero.  The package uses this with the customer's CLIENT_ID and
      CLIENT_SECRET to mint short-lived access tokens at runtime.  Do
      not edit manually.
    required: false
    sensitive: true

  - name: EMPLOYMENTHERO_ORGANISATION_ID
    description: >
      Active organisation id, captured during Connect from the EH
      ``/me`` endpoint.  Pinned per-assistant so org-scoped calls
      target a single EH organisation.  Required when the token has
      access to more than one organisation.
    required: false
    sensitive: false

  - name: EMPLOYMENTHERO_HUB_DOMAIN
    description: >
      Subdomain of the connected EH organisation
      (e.g. ``acme.employmenthero.com``), captured during Connect.
      Used by the Console UI for deep-links and "connected to ..."
      labels.
    required: false
    sensitive: false

  # ----- Optional overrides -------------------------------------------
  - name: EMPLOYMENTHERO_BASE_URL
    description: >
      API base URL override.  Defaults to https://api.employmenthero.com
      which serves UK and AU accounts via region-routed load balancing.
      Set to https://api.employmenthero.co.uk if a UK customer hits
      region-mismatch errors.
    required: false
    sensitive: false

  - name: EMPLOYMENTHERO_OAUTH_TOKEN_URL
    description: >
      OAuth token endpoint override.  Defaults to
      https://oauth.employmenthero.com/oauth2/token.  Set only for
      regional EH instances that route OAuth differently.
    required: false
    sensitive: false

  # ----- Legacy paste-token (deprecated) ------------------------------
  - name: EMPLOYMENTHERO_ACCESS_TOKEN
    description: >
      LEGACY: direct EH bearer token, used for paste-once setups before
      the OAuth Connect flow existed.  Deprecated; will be removed once
      telemetry confirms zero usage.  When set, takes precedence over
      the OAuth path (no auto-refresh).  Do not use for new deployments
      — click Connect in the Integrations modal instead.
    required: false
    sensitive: true

capabilities:
  # ----- Account ----------------------------------------------------------
  - id: account
    name: Account
    description: Verify token; identify active organisation.
    functions: [get_account_info, list_organisations, get_active_organisation]
    guidance: [overview, setup]

  # ----- Workforce graph --------------------------------------------------
  - id: workforce
    name: Workforce graph
    description: Employees, employments, positions, managers, teams, locations.
    functions: [
      get_employee, list_employees, search_employees,
      list_employments, list_positions, list_managers,
      list_teams, get_team, list_team_members,
      list_locations, get_location,
      sync_workforce,
    ]
    guidance: [employees, teams_and_locations, local_vs_live]

  - id: employee_personal
    name: Employee personal details
    description: Emergency contacts, dependants, visa, probation. PII-redacted on snapshot.
    functions: [
      list_emergency_contacts, list_dependants,
      get_visa_details, get_probation_status,
      sync_employee_personal,
    ]
    guidance: [employees, sensitive_data]

  - id: employee_notes
    name: Employee notes
    description: Confidential HR notes against employee records.
    functions: [
      list_employee_notes, get_employee_note, create_employee_note,
      sync_employee_notes,
    ]
    guidance: [employees, sensitive_data, high_stakes_writes]

  # ----- Leave ------------------------------------------------------------
  - id: leave_management
    name: Leave management
    description: Leave categories, balances, requests (read + submit).
    functions: [
      list_leave_categories, get_leave_category,
      list_leave_balances, get_leave_balance,
      list_leave_requests, get_leave_request, submit_leave_request,
      sync_leave,
    ]
    guidance: [leave, high_stakes_writes]

  # ----- Time + money -----------------------------------------------------
  - id: time_tracking
    name: Time tracking
    description: Timesheet read, submit, update.
    functions: [
      list_timesheets, get_timesheet_entry,
      submit_timesheet_entry, update_timesheet_entry,
      sync_timesheets,
    ]
    guidance: [timesheets, high_stakes_writes]

  - id: expense_management
    name: Expense management
    description: Expense claims (read + submit), categories.
    functions: [
      list_expense_categories, list_expense_claims, get_expense_claim,
      submit_expense_claim, sync_expenses,
    ]
    guidance: [expenses]

  # ----- Compliance + ops -------------------------------------------------
  - id: policies
    name: Policies
    description: HR policies + per-employee acknowledgements (read + acknowledge).
    functions: [
      list_policies, get_policy,
      list_policy_acknowledgements, acknowledge_policy,
      sync_policies,
    ]
    guidance: [policies]

  - id: documents
    name: Documents (metadata)
    description: Document metadata + templates.  File contents are not synced.
    functions: [
      list_documents, list_employee_documents, get_document_metadata,
      list_document_templates,
      sync_documents,
    ]
    guidance: [documents, sensitive_data]

  - id: custom_fields
    name: Custom fields
    description: Org-defined field schema + per-employee values (long format).
    functions: [
      list_custom_field_definitions, list_custom_field_values,
      get_employee_custom_field_values,
      sync_custom_fields,
    ]
    guidance: [custom_fields]

  - id: onboarding
    name: Onboarding
    description: Onboarding processes, task definitions, per-employee status.
    functions: [
      list_onboardings, get_onboarding,
      list_onboarding_tasks, list_employee_onboarding_status,
      sync_onboarding,
    ]
    guidance: [onboarding]

  - id: qualifications
    name: Qualifications and certifications
    description: Qualification catalogue + per-employee certs + expiry tracking.
    functions: [
      list_qualifications, get_qualification,
      list_employee_qualifications,
      sync_qualifications,
    ]
    guidance: [qualifications, local_vs_live]

  # ----- Performance ------------------------------------------------------
  - id: performance_management
    name: Performance management
    description: Reviews, goals, 1:1s, feedback. Free-text redacted on snapshot.
    functions: [
      list_reviews, get_review,
      list_goals, get_goal, create_goal, update_goal_progress,
      list_one_on_ones, get_one_on_one, create_one_on_one, update_one_on_one_notes,
      list_feedback, give_feedback, list_peer_feedback,
      sync_performance,
    ]
    guidance: [performance_and_goals, sensitive_data, high_stakes_writes]

  # ----- Recognition / surveys / learning / recruitment -------------------
  - id: recognition
    name: Recognition
    description: Cheers, hi-fives, awards (read + give).
    functions: [
      list_cheers, give_cheer,
      list_hi_fives, give_hi_five,
      list_recognition_awards,
      sync_recognition,
    ]
    guidance: [recognition_and_surveys]

  - id: surveys
    name: Surveys
    description: Definitions and responses; anonymity respected per EH is_anonymous flag.
    functions: [list_surveys, get_survey, list_survey_responses, sync_surveys]
    guidance: [recognition_and_surveys, sensitive_data]

  - id: learning
    name: Learning
    description: Courses, assignments, completions.
    functions: [
      list_courses, get_course,
      list_course_assignments, list_course_completions,
      sync_learning,
    ]
    guidance: [learning]

  - id: recruitment
    name: Recruitment
    description: Jobs, applicants, offers, interview stages.  PII-redacted on snapshot; retention-windowed.
    functions: [
      list_jobs, get_job,
      list_applicants, get_applicant,
      list_offers, list_interview_stages,
      sync_recruitment,
    ]
    guidance: [recruitment, sensitive_data]

  # ----- Pay / banking / tax / medical (critical tier) --------------------
  - id: pay_runs
    name: Pay runs
    description: Pay run summaries, categories, employment terms (rate-banded snapshot).
    functions: [
      list_pay_runs, get_pay_run,
      list_pay_categories,
      get_employment_terms, list_employment_terms,
      sync_pay,
    ]
    guidance: [pay_and_banking, sensitive_data, tier_gating]

  - id: payslips
    name: Payslips
    description: Individual payslips. Live-only — never synced.
    functions: [list_employee_payslips, get_payslip]
    guidance: [pay_and_banking, sensitive_data, tier_gating]

  - id: banking_and_tax
    name: Banking and tax
    description: Banking details, super funds, tax declarations. Live-only with masking.
    functions: [get_banking_details, list_super_funds, get_tax_declaration]
    guidance: [pay_and_banking, sensitive_data, tier_gating]

  - id: medical
    name: Medical disclosures
    description: Medical disclosures. Live-only; counts/dates only.
    functions: [list_medical_disclosures_count, get_medical_disclosure]
    guidance: [sensitive_data, tier_gating]

  # ----- Sync orchestration + local query ---------------------------------
  - id: incremental_sync
    name: Incremental sync
    description: Single-tick orchestration across enabled object types.
    functions: [run_employmenthero_sync_tick, get_sync_state, probe_tier]
    guidance: [sync_runbook, local_vs_live]

  - id: local_query
    name: Local DataManager query
    description: Query the synced EH copy in DataManager (preferred over live for analytics).
    functions: [
      query_local_employees, query_local_teams, query_local_locations,
      query_local_leave_requests, query_local_leave_balances,
      query_local_timesheets, query_local_expenses,
      query_local_qualifications, query_local_expiring_qualifications,
      query_local_onboarding_status, query_local_documents,
      query_local_goals, query_local_reviews,
    ]
    guidance: [local_vs_live, qualifications, overview]

requirements: [httpx]
tags: [employment-hero, hris, hr, payroll-adjacent, compliance, qualifications, leave, timesheets, sync, datamanager]
