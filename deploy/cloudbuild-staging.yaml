steps:
  # Drop duplicate-webhook / superseded runs of this trigger before any work.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'guard'
  entrypoint: 'bash'
  args: ['deploy/scripts/cloudbuild/concurrency_guard.sh', '${_REGION}']
  env:
  - 'BUILD_ID=${BUILD_ID}'
  - 'PROJECT_ID=${PROJECT_ID}'
  waitFor: ['-']

  # Resolve the canonical Unity (brain) SHA that identifies the overlay image.
  # A unity (brain) push passes _UNITY_SHA explicitly via the base-build chain;
  # a direct unity-deploy push leaves it empty, so we fall back to the brain SHA
  # baked into unity-base-staging:latest (published by the base build to GCS).
  # This keeps the overlay tag + GCS image hash consistent across both entry
  # paths instead of tagging the image with the unity-deploy commit SHA.
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'resolve-unity-sha'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SHA="${_UNITY_SHA}"
    if [ -z "$$SHA" ]; then
      SHA="$$(gsutil cat gs://bucket/unity_base_sha_staging.txt)"
    fi
    if [ -z "$$SHA" ]; then
      echo "Could not resolve Unity brain SHA" >&2
      exit 1
    fi
    echo "$$SHA" > /workspace/unity_sha.txt
    echo "Unity brain SHA: $$SHA"
  waitFor: ['guard']

  # --- Image builds (parallel) --------------------------------------------
  # Overlay (assistant runtime): thin enterprise overlay on the Unity base.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-overlay'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SHA="$$(cat /workspace/unity_sha.txt)"
    echo "Base image: ${_BASE_IMAGE}"
    echo "Unity SHA:  $$SHA"
    DOCKER_BUILDKIT=1 docker build \
      --build-arg BASE_IMAGE=${_BASE_IMAGE} \
      --build-arg BRAIN_OPERATOR_ASSISTANT_ID=${_BRAIN_OPERATOR_ASSISTANT_ID} \
      --build-arg BRAIN_OPERATOR_TASKS_ENABLED=${_BRAIN_OPERATOR_TASKS_ENABLED} \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      -f deploy/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_OVERLAY_REPO}/${_OVERLAY_IMAGE}:$$SHA \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_OVERLAY_REPO}/${_OVERLAY_IMAGE}:latest .
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['resolve-unity-sha']

  # Comms app (bundles unity.gateway; clones unity inside Dockerfile-comms).
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-comms'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_COMMS_SERVICE}:latest || true
    UNITY_SHA=$$(git ls-remote https://github.com/unifyai/unity.git refs/heads/staging | awk '{print $$1}')
    echo "Cache-busting comms unity layer with UNITY_SHA=$$UNITY_SHA"
    DOCKER_BUILDKIT=1 docker build -f Dockerfile-comms \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_COMMS_SERVICE}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN --build-arg BRANCH_NAME=staging \
      --build-arg UNITY_SHA=$$UNITY_SHA \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_COMMS_SERVICE}:${SHORT_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_COMMS_SERVICE}:latest .
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['guard']

  # Adapters (does not bundle unity; inbound webhooks + infra control plane).
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-adapters'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ADAPTERS_REPO}/${_ADAPTERS_SERVICE}:latest || true
    UNITY_SHA=$$(git ls-remote https://github.com/unifyai/unity.git refs/heads/staging | awk '{print $$1}')
    echo "Cache-busting adapters unity layer with UNITY_SHA=$$UNITY_SHA"
    DOCKER_BUILDKIT=1 docker build -f Dockerfile-adapters \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ADAPTERS_REPO}/${_ADAPTERS_SERVICE}:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      --build-arg BRANCH_NAME=staging \
      --build-arg UNITY_SHA=$$UNITY_SHA \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ADAPTERS_REPO}/${_ADAPTERS_SERVICE}:${SHORT_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ADAPTERS_REPO}/${_ADAPTERS_SERVICE}:latest .
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['guard']

  # Assistant session controller (shares the comms repo + communication/ source).
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-session-controller'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    DOCKER_BUILDKIT=1 docker build -f scripts/assistant-session-controller/Dockerfile \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_SC_IMAGE}:${SHORT_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_SC_IMAGE}:latest .
  waitFor: ['guard']

  # Fail fast if the overlay image is missing the pipeline maintenance CLI.
- name: 'gcr.io/cloud-builders/docker'
  id: 'smoke-pipeline-cli'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SHA="$$(cat /workspace/unity_sha.txt)"
    IMG="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_OVERLAY_REPO}/${_OVERLAY_IMAGE}:$$SHA"
    for cmd in reconcile-dlq reconcile-stale recover-stale worker-refresh-check; do
      docker run --rm "$$IMG" python -m unity_deploy.infra.cli.pipeline_control "$$cmd" --help >/dev/null
    done
  waitFor: ['build-overlay']

  # Fetch public Unity integration manifests for the integrations artifact job.
- name: 'gcr.io/cloud-builders/git'
  id: 'fetch-unity-integration-manifests'
  entrypoint: 'bash'
  secretEnv: ['GITHUB_TOKEN']
  args:
  - '-c'
  - |
    set -euo pipefail
    SHA="$$(cat /workspace/unity_sha.txt)"
    git clone --depth 1 --branch staging https://$$GITHUB_TOKEN@github.com/unifyai/unity.git /workspace/unity-manifest-src
    if git -C /workspace/unity-manifest-src fetch --depth 1 origin "$$SHA"; then
      git -C /workspace/unity-manifest-src checkout --detach FETCH_HEAD
    fi
    cp -R /workspace/unity-manifest-src/deploy/integrations /workspace/integration-manifests
  waitFor: ['resolve-unity-sha']

  # --- Image pushes -------------------------------------------------------
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-overlay'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SHA="$$(cat /workspace/unity_sha.txt)"
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_OVERLAY_REPO}/${_OVERLAY_IMAGE}:$$SHA
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_OVERLAY_REPO}/${_OVERLAY_IMAGE}:latest
  waitFor: ['smoke-pipeline-cli']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-comms'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_COMMS_SERVICE}:${SHORT_SHA}
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_COMMS_SERVICE}:latest
  waitFor: ['build-comms']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-adapters'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ADAPTERS_REPO}/${_ADAPTERS_SERVICE}:${SHORT_SHA}
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ADAPTERS_REPO}/${_ADAPTERS_SERVICE}:latest
  waitFor: ['build-adapters']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-session-controller'
  args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_SC_IMAGE}']
  waitFor: ['build-session-controller']

  # Start Builtins artifact seeding (async) from the freshly-built overlay.
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'start-builtins-artifacts-seed'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    SHA="$$(cat /workspace/unity_sha.txt)"
    bash deploy/scripts/run_seed_builtins_artifacts_job.sh \
      --environment staging \
      --manifest /workspace/integration-manifests/bootstrap.staging.toml \
      --unity-image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_OVERLAY_REPO}/${_OVERLAY_IMAGE}:$$SHA" \
      --force-override "${_BUILTINS_SYNC_FORCE_OVERRIDE}" \
      --async
  waitFor: ['fetch-unity-integration-manifests', 'push-overlay']

  # --- Digest gates: decide whether comms / adapters need redeploying ------
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'gate-comms'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    NEED="$$(bash deploy/scripts/cloudbuild/cloud_run_deploy_needed.sh \
      ${_COMMS_SERVICE} ${_REGION} \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_COMMS_SERVICE}:${SHORT_SHA})"
    if [ "$$NEED" = "changed" ]; then
      touch /workspace/deploy_comms
      echo "comms image changed -> will deploy"
    else
      echo "comms image unchanged -> skipping comms deploy"
    fi
  waitFor: ['push-comms']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'gate-adapters'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    NEED="$$(bash deploy/scripts/cloudbuild/cloud_run_deploy_needed.sh \
      ${_ADAPTERS_SERVICE} ${_REGION} \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ADAPTERS_REPO}/${_ADAPTERS_SERVICE}:${SHORT_SHA})"
    if [ "$$NEED" = "changed" ]; then
      touch /workspace/deploy_adapters
      echo "adapters image changed -> will deploy"
    else
      echo "adapters image unchanged -> skipping adapters deploy"
    fi
  waitFor: ['push-adapters']

  # --- Overlay rollout (always: the overlay image tracks unity-deploy source) --
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'apply-unity-external-secrets'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    gcloud container clusters get-credentials "${_CLUSTER}" --region "${_REGION}"
    kubectl apply -f deploy/k8s/secrets/unity-secrets-external-secret_staging.yaml
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['push-overlay']

- name: 'gcr.io/cloud-builders/kubectl'
  id: 'reconcile-deployment'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    SHA="$$(cat /workspace/unity_sha.txt)"
    gcloud container clusters get-credentials "${_CLUSTER}" --region "${_REGION}"
    bash deploy/scripts/run_deployment_reconcile_job.sh \
      --environment staging \
      --namespace staging \
      --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_OVERLAY_REPO}/${_OVERLAY_IMAGE}:$$SHA" \
      --orchestra-url "${_ORCHESTRA_URL}" \
      --unity-comms-url "${_UNITY_COMMS_URL}" \
      --planes control-plane \
      --concurrency 8 \
      --timeout 600s \
      --brain-operator-assistant-id "${_BRAIN_OPERATOR_ASSISTANT_ID}" \
      --brain-operator-tasks-enabled "${_BRAIN_OPERATOR_TASKS_ENABLED}"
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['apply-unity-external-secrets']

  # --- Session controller + comms rollout (gated on comms image change) ----
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy-session-controller'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    [ -f /workspace/deploy_comms ] || { echo "comms unchanged; skipping session controller deploy"; exit 0; }
    gcloud container clusters get-credentials ${_CLUSTER} --region ${_REGION} --project ${PROJECT_ID}
    kubectl apply -f k8s/assistant-session-controller/crd.yaml
    kubectl wait --for=condition=Established crd/assistantsessions.infra.unify.ai --timeout=120s
    sed "s|image:.*${_SC_IMAGE}.*|image: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_SC_IMAGE}:${SHORT_SHA}|" \
      k8s/assistant-session-controller/deployment_staging.yaml | kubectl apply -f -
    kubectl rollout status deployment/assistant-session-controller-staging -n staging --timeout=300s
  waitFor: ['push-session-controller', 'gate-comms']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy-comms'
  entrypoint: bash
  args:
  - '-c'
  - |
    set -euo pipefail
    [ -f /workspace/deploy_comms ] || { echo "comms unchanged; skipping comms deploy"; exit 0; }
    source deploy/scripts/cloudbuild/cloud_run_lib.sh
    run_cloud_run_with_retry repair_traffic_state ${_COMMS_SERVICE} ${_REGION} \
      || echo "Traffic repair skipped; deploy will create a fresh revision"
    run_cloud_run_with_retry gcloud run deploy ${_COMMS_SERVICE} \
      --platform=managed \
      --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_COMMS_REPO}/${_COMMS_SERVICE}:${SHORT_SHA} \
      --region=${_REGION} \
      --allow-unauthenticated \
      --min-instances=0 \
      --memory=2Gi \
      --update-env-vars=DEPLOY_ENV=staging,GCP_PROJECT_ID=${PROJECT_ID},UNITY_GKE_CLUSTER_NAME=${_CLUSTER},ORCHESTRA_URL=${_ORCHESTRA_URL},UNITY_COMMS_URL=https://${_COMMS_HOST},UNITY_ADAPTERS_URL=https://${_ADAPTERS_HOST},UNITY_COORDINATOR_EMAIL_ADDRESS=${_UNITY_COORDINATOR_EMAIL_ADDRESS} \
      --service-account=comm-sa@${PROJECT_ID}.iam.gserviceaccount.com \
      --set-secrets=GCP_SA_KEY=gcp-sa-key:latest,LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,LIVEKIT_SIP_URI=LIVEKIT_SIP_URI:latest,LIVEKIT_URL=LIVEKIT_URL:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_API_SECRET=TWILIO_API_SECRET:latest,TWILIO_API_SID=TWILIO_API_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWIML_SIP_PASSWORD=TWIML_SIP_PASSWORD:latest,TWIML_SIP_USERNAME=TWIML_SIP_USERNAME:latest,UNIFY_KEY=UNIFY_KEY:latest,ORCHESTRA_ADMIN_KEY=ORCHESTRA_ADMIN_KEY:latest,TWILIO_VERIFICATION_NUMBER=TWILIO_VERIFICATION_NUMBER:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,TWILIO_WA_ACCOUNT_SID=TWILIO_WA_ACCOUNT_SID:latest,TWILIO_WA_AUTH_TOKEN=TWILIO_WA_AUTH_TOKEN:latest,OAUTH_STATE_SIGNING_KEY=OAUTH_STATE_SIGNING_KEY:latest,MS365_ADMIN_TENANT_ID=MS365_ADMIN_TENANT_ID:latest,MS365_ADMIN_CLIENT_ID=MS365_ADMIN_CLIENT_ID:latest,MS365_ADMIN_CLIENT_SECRET=MS365_ADMIN_CLIENT_SECRET:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,MS365_BYOD_CLIENT_ID=MS365_BYOD_CLIENT_ID:latest,MS365_BYOD_CLIENT_SECRET=MS365_BYOD_CLIENT_SECRET:latest,OUTLOOK_WEBHOOK_SECRET=OUTLOOK_WEBHOOK_SECRET:latest,TEAMS_WEBHOOK_SECRET=TEAMS_WEBHOOK_SECRET:latest,MS_TEAMS_BOT_APP_ID=MS_TEAMS_BOT_APP_ID_STAGING:latest,MS_TEAMS_BOT_APP_SECRET=MS_TEAMS_BOT_APP_SECRET_STAGING:latest \
      --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=${SHORT_SHA},gcb-build-id=${BUILD_ID} \
      --quiet
    run_cloud_run_with_retry route_canonical_traffic ${_COMMS_SERVICE} ${_REGION} ${BUILD_ID}
  waitFor: ['push-comms', 'deploy-session-controller']

  # --- Adapters rollout (gated on adapters image change) -------------------
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy-adapters'
  entrypoint: bash
  args:
  - '-c'
  - |
    set -euo pipefail
    [ -f /workspace/deploy_adapters ] || { echo "adapters unchanged; skipping adapters deploy"; exit 0; }
    source deploy/scripts/cloudbuild/cloud_run_lib.sh
    run_cloud_run_with_retry repair_traffic_state ${_ADAPTERS_SERVICE} ${_REGION} \
      || echo "Traffic repair skipped; deploy will create a fresh revision"
    run_cloud_run_with_retry gcloud run deploy ${_ADAPTERS_SERVICE} \
      --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ADAPTERS_REPO}/${_ADAPTERS_SERVICE}:${SHORT_SHA} \
      --region=${_REGION} \
      --platform=managed \
      --allow-unauthenticated \
      --min-instances=0 \
      --max-instances=100 \
      --concurrency=80 \
      --memory=2Gi \
      --cpu=1 \
      --timeout=600 \
      --cpu-boost \
      --set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},UNITY_MIN_IDLE_JOBS=3,UNITY_IDLE_JOB_DEMAND_FACTOR=4,DEPLOY_ENV=staging,ORCHESTRA_URL=${_ORCHESTRA_URL},UNITY_COMMS_URL=https://${_COMMS_HOST},UNITY_COORDINATOR_EMAIL_ADDRESS=${_UNITY_COORDINATOR_EMAIL_ADDRESS},PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc \
      --service-account=comm-sa@${PROJECT_ID}.iam.gserviceaccount.com \
      --set-secrets=ORCHESTRA_ADMIN_KEY=ORCHESTRA_ADMIN_KEY:latest,SHARED_UNIFY_KEY=SHARED_UNIFY_KEY:latest,GCP_SA_KEY=gcp-sa-key:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,LIVEKIT_SIP_URI=LIVEKIT_SIP_URI:latest,LIVEKIT_URL=LIVEKIT_URL:latest,LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,UNITY_ADAPTERS_URL=UNITY_ADAPTERS_URL_STAGING:latest,ASSISTANT_MESSAGE_ATTACHMENTS_BUCKET_NAME=ASSISTANT_MESSAGE_ATTACHMENTS_BUCKET_NAME_STAGING:latest,OUTLOOK_WEBHOOK_SECRET=OUTLOOK_WEBHOOK_SECRET:latest,TEAMS_WEBHOOK_SECRET=TEAMS_WEBHOOK_SECRET:latest,TWILIO_WA_AUTH_TOKEN=TWILIO_WA_AUTH_TOKEN:latest,TWILIO_WA_ACCOUNT_SID=TWILIO_WA_ACCOUNT_SID:latest,OAUTH_STATE_SIGNING_KEY=OAUTH_STATE_SIGNING_KEY:latest,MS365_ADMIN_TENANT_ID=MS365_ADMIN_TENANT_ID:latest,MS365_ADMIN_CLIENT_ID=MS365_ADMIN_CLIENT_ID:latest,MS365_ADMIN_CLIENT_SECRET=MS365_ADMIN_CLIENT_SECRET:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,MS365_BYOD_CLIENT_ID=MS365_BYOD_CLIENT_ID:latest,MS365_BYOD_CLIENT_SECRET=MS365_BYOD_CLIENT_SECRET:latest,SLACK_SIGNING_SECRET=SLACK_SIGNING_SECRET:latest,MS_TEAMS_BOT_APP_ID=MS_TEAMS_BOT_APP_ID_STAGING:latest,MS_TEAMS_BOT_APP_SECRET=MS_TEAMS_BOT_APP_SECRET_STAGING:latest \
      --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=${SHORT_SHA},gcb-build-id=${BUILD_ID}
    run_cloud_run_with_retry route_canonical_traffic ${_ADAPTERS_SERVICE} ${_REGION} ${BUILD_ID}
  waitFor: ['push-adapters', 'gate-adapters']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'configure-adapters-schedulers'
  entrypoint: bash
  env:
  - 'PROJECT_ID=${PROJECT_ID}'
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -euo pipefail
    [ -f /workspace/deploy_adapters ] || { echo "adapters unchanged; skipping scheduler config"; exit 0; }
    bash deploy/scripts/cloudbuild/configure_adapters_schedulers.sh staging ${_REGION} ${_ADAPTERS_SERVICE}
  waitFor: ['deploy-adapters']

  # Publish the canonical overlay hash immediately before idle-pool refresh so
  # the session controller does not claim against a new hash while stale idle
  # jobs still exist.
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'upload-sha'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    cat /workspace/unity_sha.txt | gsutil cp - gs://bucket/image_hash_staging.txt
  waitFor: ['deploy-comms', 'reconcile-deployment']

- name: 'gcr.io/cloud-builders/gsutil'
  id: 'publish-client-bundles'
  entrypoint: 'bash'
  args: ['deploy/scripts/cloudbuild/publish_client_bundles.sh', 'staging', '${COMMIT_SHA}']
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['resolve-unity-sha']

  # --- Single idle-pool refresh (authoritative) ---------------------------
  # Runs after comms has taken traffic (manifest-safe), adapters are live,
  # and the GCS image hash has been updated. This is the only idle-pool refresh
  # in the system.
- name: 'gcr.io/cloud-builders/curl'
  id: 'refresh-idle-jobs'
  entrypoint: 'bash'
  args: ['deploy/scripts/cloudbuild/refresh_idle_pool.sh', '${_ADAPTERS_HOST}']
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  waitFor: ['upload-sha', 'deploy-adapters']

  # --- Pipeline workers refresh (overlay image) ---------------------------
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'refresh-pipeline-workers'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    SHA="$$(cat /workspace/unity_sha.txt)"
    OVERLAY="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_OVERLAY_REPO}/${_OVERLAY_IMAGE}:$$SHA"
    gcloud container clusters get-credentials "${_CLUSTER}" --region "${_REGION}"

    latest_replicaset() {
      deployment="$$1"
      namespace="$$2"
      kubectl get rs -n "$$namespace" \
        -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name=='$$deployment')]}{.metadata.creationTimestamp}{'\t'}{.metadata.name}{'\n'}{end}" \
        | sort | tail -n 1 | awk '{print $$2}'
    }

    wait_for_new_replicaset_available() {
      deployment="$$1"
      namespace="$$2"
      previous_rs="$$3"

      echo "Waiting for $$deployment to create a new ReplicaSet..."
      rs_deadline=$$(($$SECONDS + 300))
      new_rs=""
      while [ "$$SECONDS" -lt "$$rs_deadline" ]; do
        candidate="$$(latest_replicaset "$$deployment" "$$namespace" || true)"
        if [ -n "$$candidate" ] && [ "$$candidate" != "$$previous_rs" ]; then
          new_rs="$$candidate"
          break
        fi
        sleep 5
      done
      if [ -z "$$new_rs" ]; then
        echo "Timed out waiting for a new ReplicaSet for $$deployment" >&2
        kubectl get deployment "$$deployment" -n "$$namespace" -o wide || true
        kubectl get rs -n "$$namespace" || true
        return 1
      fi

      echo "Waiting for Kubernetes rollout status for $$deployment..."
      kubectl rollout status deployment/"$$deployment" -n "$$namespace" --timeout=900s

      echo "Waiting for new ReplicaSet $$new_rs to match current HPA desired replicas..."
      availability_deadline=$$(($$SECONDS + 900))
      next_log=$$SECONDS
      while [ "$$SECONDS" -lt "$$availability_deadline" ]; do
        desired="$$(kubectl get deployment "$$deployment" -n "$$namespace" -o jsonpath='{.spec.replicas}')"
        desired="$${desired:-1}"
        if [ "$$desired" = "0" ]; then
          echo "$$deployment has 0 desired replicas; skipping readiness wait."
          return 0
        fi
        available="$$(kubectl get rs "$$new_rs" -n "$$namespace" -o jsonpath='{.status.availableReplicas}')"
        available="$${available:-0}"
        if [ "$$available" -ge "$$desired" ]; then
          echo "$$deployment new ReplicaSet $$new_rs is available ($$available/$$desired)."
          return 0
        fi
        if [ "$$SECONDS" -ge "$$next_log" ]; then
          ready="$$(kubectl get rs "$$new_rs" -n "$$namespace" -o jsonpath='{.status.readyReplicas}')"
          ready="$${ready:-0}"
          current="$$(kubectl get rs "$$new_rs" -n "$$namespace" -o jsonpath='{.status.replicas}')"
          current="$${current:-0}"
          echo "$$deployment/$$new_rs progress: current=$$current ready=$$ready available=$$available desired=$$desired"
          kubectl get pods -n "$$namespace" -l "app=$$deployment" -o wide || true
          next_log=$$(($$SECONDS + 30))
        fi
        sleep 5
      done

      echo "Timed out waiting for new ReplicaSet $$new_rs to become available" >&2
      kubectl describe deployment "$$deployment" -n "$$namespace" || true
      kubectl get hpa -n "$$namespace" || true
      kubectl describe hpa -n "$$namespace" || true
      kubectl get rs -n "$$namespace" || true
      kubectl describe rs "$$new_rs" -n "$$namespace" || true
      pod_hash="$${new_rs#$$deployment-}"
      kubectl describe pods -n "$$namespace" -l "app=$$deployment,pod-template-hash=$$pod_hash" || true
      return 1
    }

    worker_refresh_check() {
      pod="unity-worker-refresh-check-$$SHA"
      extra_args="$$*"
      kubectl delete pod "$$pod" -n staging --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
      echo "Checking pipeline state..."
      set +e
      kubectl run "$$pod" \
        -n staging \
        --rm \
        -i \
        --attach=true \
        --restart=Never \
        --pod-running-timeout=5m \
        --overrides='{"spec":{"serviceAccountName":"unity-pipeline-worker"}}' \
        --image="$$OVERLAY" \
        --env="UNITY_GCP_PIPELINE_ENVIRONMENT=staging" \
        --env="UNITY_GCS_ARTIFACT_BUCKET=unity-pipeline-artifacts-staging" \
        --env="UNITY_PUBSUB_PROJECT_ID=${PROJECT_ID}" \
        --env="ORCHESTRA_URL=${_ORCHESTRA_URL}" \
        --command -- python -m unity_deploy.infra.cli.pipeline_control \
          worker-refresh-check --env staging --dispatch-limit 20 --json $$extra_args
      rc="$$?"
      set -e
      kubectl delete pod "$$pod" -n staging --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
      return "$$rc"
    }

    echo "Applying staging pipeline worker manifests..."
    kubectl apply -f deploy/k8s/workers/pipeline-worker-serviceaccount.yaml
    kubectl apply -f deploy/k8s/workers/parse-worker-deployment_staging.yaml
    kubectl apply -f deploy/k8s/workers/ingest-worker-deployment_staging.yaml
    kubectl apply -f deploy/k8s/workers/dlq-reconciler-cronjob.yaml -l environment=staging
    kubectl apply -f deploy/k8s/workers/stale-reconciler-cronjob.yaml -l environment=staging
    kubectl set image cronjob/unity-pipeline-dlq-reconciler \
      dlq-reconciler="$$OVERLAY" \
      -n staging
    kubectl set image cronjob/unity-pipeline-stale-reconciler \
      stale-reconciler="$$OVERLAY" \
      -n staging
    kubectl apply -f deploy/k8s/workers/workers-weekly-rollout-cronjob.yaml
    kubectl apply -f deploy/k8s/workers/failed-pod-gc-cronjob.yaml

    if ! worker_refresh_check; then
      if [ "${_FORCE_WORKER_REFRESH}" != "true" ]; then
        echo "Skipping worker rollout restart because active/queued/stale pipeline work exists."
        echo "Set _FORCE_WORKER_REFRESH=true only for a controlled maintenance refresh."
        exit 0
      fi
      echo "_FORCE_WORKER_REFRESH=true; continuing despite active pipeline work."
    fi

    previous_parse_rs="$$(latest_replicaset unity-parse-worker staging || true)"
    previous_ingest_rs="$$(latest_replicaset unity-ingest-worker staging || true)"

    echo "Triggering rolling restart to pick up new image..."
    kubectl rollout restart deployment/unity-parse-worker -n staging
    kubectl rollout restart deployment/unity-ingest-worker -n staging

    wait_for_new_replicaset_available unity-parse-worker staging "$$previous_parse_rs"
    wait_for_new_replicaset_available unity-ingest-worker staging "$$previous_ingest_rs"
    if ! worker_refresh_check --allow-active --allow-queued; then
      echo "Post-refresh verification found stale or DLQ pipeline work." >&2
      echo "Inspect with pipeline_control status/reconcile-stale before considering the refresh healthy." >&2
      exit 1
    fi
    echo "Worker refresh complete; old pods may continue draining asynchronously."
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['upload-sha']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  # The orchestrator builds overlay + comms + adapters + session-controller in
  # parallel on one machine. When a concurrent unity (brain) change busts every
  # image's cache at once, four heavy pip/clone builds run simultaneously, so we
  # size for that worst case rather than the common cache-hit path.
  machineType: 'E2_HIGHCPU_32'

substitutions:
  _REGION: 'us-central1'
  _CLUSTER: 'unity'
  _FORCE_WORKER_REFRESH: 'false'
  _OVERLAY_REPO: 'unity'
  _OVERLAY_IMAGE: 'unity-staging'
  _COMMS_REPO: 'unity-comms-app-repo'
  _COMMS_SERVICE: 'unity-comms-app-staging'
  _SC_IMAGE: 'assistant-session-controller-staging'
  _ADAPTERS_REPO: 'unity-adapters-repo'
  _ADAPTERS_SERVICE: 'unity-adapters-staging'
  _COMMS_HOST: 'service.a.run.app'
  _ADAPTERS_HOST: 'service.a.run.app'
  _BASE_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/unity/unity-base-staging:latest'
  # Empty on a direct unity-deploy push; set by the base-build chain on a unity
  # (brain) push. resolve-unity-sha falls back to the published base SHA.
  _UNITY_SHA: ''
  _ORCHESTRA_URL: 'https://internal.example.com/v0'
  _BUILTINS_SYNC_FORCE_OVERRIDE: ''
  _UNITY_COMMS_URL: 'https://service.a.run.app'
  # Shared coordinator mailbox; must match UNITY_COORDINATOR_EMAIL_ADDRESS_STAGING
  # in Orchestra so the gateway recognizes coordinator senders.
  _UNITY_COORDINATOR_EMAIL_ADDRESS: 'staging-twin@unify.ai'
  # Brain commit / branch installed into the overlay image (staging tracks main).
  # brain_operator: assistant id + task flag from Cloud Build substitutions.
  _BRAIN_OPERATOR_ASSISTANT_ID: '7367'
  _BRAIN_OPERATOR_TASKS_ENABLED: 'false'

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_ADMIN_KEY/versions/latest
    env: 'ORCHESTRA_ADMIN_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
    env: 'GITHUB_TOKEN'

timeout: '4800s'
