steps:
  # Build thin enterprise overlay on top of the Unity base image.
  # _BASE_IMAGE is passed by the upstream Unity build trigger via substitution override.
  # Falls back to unity-base-staging:latest if triggered directly.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    echo "Base image: ${_BASE_IMAGE}"
    echo "Unity SHA:  ${_UNITY_SHA}"
    DOCKER_BUILDKIT=1 docker build \
      --build-arg BASE_IMAGE=${_BASE_IMAGE} \
      -f deploy/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:${_UNITY_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:latest .

  # Push Docker Image (SHA and latest tags in parallel)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:${_UNITY_SHA}
  waitFor: ['build-image']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:latest
  waitFor: ['build-image']

  # Upload SHA to Cloud Storage
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'upload-sha'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    echo ${_UNITY_SHA} | gsutil cp - gs://bucket/image_hash_staging.txt
  waitFor: ['push-latest-tag']

  # Reconcile deploy-time control-plane state before any deploy step wakes Unity
  # containers. Runtime seed/function sync runs per assistant after wake with
  # that assistant's UNIFY_KEY.
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'reconcile-deployment'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    gcloud container clusters get-credentials "${_CLUSTER}" --region "${_REGION}"

    bash deploy/scripts/run_deployment_reconcile_job.sh \
      --environment staging \
      --namespace staging \
      --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:${_UNITY_SHA}" \
      --orchestra-url "${_ORCHESTRA_URL}" \
      --unity-comms-url "${_UNITY_COMMS_URL}" \
      --planes control-plane \
      --concurrency 8 \
      --timeout 600s
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['push-sha-tag', 'upload-sha']

  # Refresh idle containers so they pick up the new image
- name: 'gcr.io/cloud-builders/curl'
  id: 'refresh-idle-jobs'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    ADAPTERS=https://service.a.run.app
    AUTH="Authorization: Bearer $$ORCHESTRA_ADMIN_KEY"

    echo "Refreshing idle jobs with new image..."
    curl -sf -X POST -H "$${AUTH}" "$${ADAPTERS}/scheduled/jobs/create?refresh=true" && echo

    echo "Waiting 120s for jobs to register as idle..."
    sleep 120

    echo "Cleaning up stale idle jobs..."
    curl -sf -X POST -H "$${AUTH}" "$${ADAPTERS}/scheduled/jobs/cleanup" && echo
    echo "Idle job refresh complete."
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  waitFor: ['reconcile-deployment']

  # Refresh pipeline workers so parse/ingest pods pick up the new image.
  # Mirrors refresh-idle-jobs above for the adapter Cloud Run jobs;
  # workers run in GKE rather than Cloud Run, so we reconcile via
  # kubectl:
  #   - `kubectl apply` re-applies any manifest drift (HPA target,
  #     PDB budget, resource limits) whenever the YAML changes.
  #   - `kubectl rollout restart` forces pods to restart even when
  #     the pod-template spec is byte-identical (which is the common
  #     case, because the manifest pins the :latest tag and the SHA
  #     lives in the image itself).
  # Runs in parallel with refresh-idle-jobs (no dependency between
  # them). We wait for the newly-created ReplicaSet to become
  # available, but deliberately do not wait for old worker pods to
  # finish termination because long graceful drains should not block
  # the deploy after replacement capacity is serving.
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'refresh-pipeline-workers'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    # The cloud-builders/kubectl image only auto-runs
    # `gcloud container clusters get-credentials` via its default
    # entrypoint wrapper. We override entrypoint to `bash`, so we
    # have to fetch credentials ourselves or kubectl falls back to
    # talking to localhost:8080 and every apply fails.
    gcloud container clusters get-credentials "${_CLUSTER}" --region "${_REGION}"

    latest_replicaset() {
      deployment="$1"
      namespace="$2"
      kubectl get rs -n "$namespace" \
        -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name=='$deployment')]}{.metadata.creationTimestamp}{'\t'}{.metadata.name}{'\n'}{end}" \
        | sort | tail -n 1 | awk '{print $2}'
    }

    wait_for_new_replicaset_available() {
      deployment="$1"
      namespace="$2"
      previous_rs="$3"
      desired="$(kubectl get deployment "$deployment" -n "$namespace" -o jsonpath='{.spec.replicas}')"
      desired="${desired:-1}"
      if [ "$desired" = "0" ]; then
        echo "$deployment has 0 desired replicas; skipping readiness wait."
        return 0
      fi

      echo "Waiting for $deployment to create a new ReplicaSet..."
      deadline=$((SECONDS + 300))
      new_rs=""
      while [ "$SECONDS" -lt "$deadline" ]; do
        candidate="$(latest_replicaset "$deployment" "$namespace" || true)"
        if [ -n "$candidate" ] && [ "$candidate" != "$previous_rs" ]; then
          new_rs="$candidate"
          break
        fi
        sleep 5
      done
      if [ -z "$new_rs" ]; then
        echo "Timed out waiting for a new ReplicaSet for $deployment" >&2
        kubectl get deployment "$deployment" -n "$namespace" -o wide || true
        kubectl get rs -n "$namespace" || true
        return 1
      fi

      echo "Waiting for new ReplicaSet $new_rs to have $desired available replica(s)..."
      while [ "$SECONDS" -lt "$deadline" ]; do
        available="$(kubectl get rs "$new_rs" -n "$namespace" -o jsonpath='{.status.availableReplicas}')"
        available="${available:-0}"
        if [ "$available" -ge "$desired" ]; then
          echo "$deployment new ReplicaSet $new_rs is available ($available/$desired)."
          return 0
        fi
        sleep 5
      done

      echo "Timed out waiting for new ReplicaSet $new_rs to become available" >&2
      kubectl describe deployment "$deployment" -n "$namespace" || true
      kubectl describe rs "$new_rs" -n "$namespace" || true
      return 1
    }

    echo "Applying staging pipeline worker manifests..."
    kubectl apply -f deploy/k8s/workers/pipeline-worker-serviceaccount.yaml
    kubectl apply -f deploy/k8s/workers/parse-worker-deployment_staging.yaml
    kubectl apply -f deploy/k8s/workers/ingest-worker-deployment_staging.yaml
    kubectl apply -f deploy/k8s/workers/workers-weekly-rollout-cronjob.yaml
    kubectl apply -f deploy/k8s/workers/failed-pod-gc-cronjob.yaml

    previous_parse_rs="$(latest_replicaset unity-parse-worker staging || true)"
    previous_ingest_rs="$(latest_replicaset unity-ingest-worker staging || true)"

    echo "Triggering rolling restart to pick up new image..."
    # The apply above guarantees the Deployments exist before restart.
    kubectl rollout restart deployment/unity-parse-worker -n staging
    kubectl rollout restart deployment/unity-ingest-worker -n staging

    wait_for_new_replicaset_available unity-parse-worker staging "$previous_parse_rs"
    wait_for_new_replicaset_available unity-ingest-worker staging "$previous_ingest_rs"
    echo "Worker refresh complete; old pods may continue draining asynchronously."
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['upload-sha']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity'
  _CLUSTER: 'unity'
  _BASE_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base-staging:latest'
  _UNITY_SHA: '${SHORT_SHA}'
  _ORCHESTRA_URL: 'https://internal.example.com/v0'
  _UNITY_COMMS_URL: 'https://unity-comms-app-staging-000000000000.us-central1.run.app'

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_ADMIN_KEY/versions/latest
    env: 'ORCHESTRA_ADMIN_KEY'

timeout: '1800s'
