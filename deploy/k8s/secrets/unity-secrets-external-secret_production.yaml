apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unity-secrets
  namespace: production
  labels:
    app: unity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: unity-gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: unity-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      metadata:
        labels:
          app: unity
      data:
        _UNITY_STARTUP_HOOK_GROUP: "unify_deploy.init"
        _UNITY_STARTUP_HOOK_PACKAGE: "unify-deploy"
  data:
  - secretKey: GCP_SA_KEY
    remoteRef:
      key: gcp-sa-key
  - secretKey: LIVEKIT_SIP_URI
    remoteRef:
      key: LIVEKIT_SIP_URI
  - secretKey: LIVEKIT_URL
    remoteRef:
      key: LIVEKIT_URL
  - secretKey: LIVEKIT_API_KEY
    remoteRef:
      key: LIVEKIT_API_KEY
  - secretKey: LIVEKIT_API_SECRET
    remoteRef:
      key: LIVEKIT_API_SECRET
  - secretKey: DEEPGRAM_API_KEY
    remoteRef:
      key: DEEPGRAM_API_KEY
  - secretKey: CARTESIA_API_KEY
    remoteRef:
      key: CARTESIA_API_KEY
  - secretKey: ELEVEN_API_KEY
    remoteRef:
      key: ELEVEN_API_KEY
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: OPENAI_API_KEY
  - secretKey: OPENROUTER_API_KEY
    remoteRef:
      key: OPENROUTER_API_KEY
  - secretKey: TOGETHER_API_KEY
    remoteRef:
      key: TOGETHER_API_KEY
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: ANTHROPIC_API_KEY
  - secretKey: DEEPSEEK_API_KEY
    remoteRef:
      key: DEEPSEEK_API_KEY
  - secretKey: ANTICAPTCHA_KEY
    remoteRef:
      key: ANTICAPTCHA_KEY
  - secretKey: TAVILY_API_KEY
    remoteRef:
      key: TAVILY_API_KEY
  - secretKey: ORCHESTRA_ADMIN_KEY
    remoteRef:
      key: ORCHESTRA_ADMIN_KEY
  - secretKey: VERTEXAI_CREDENTIALS
    remoteRef:
      key: VERTEXAI_CREDENTIALS
  # Recall.ai bot API. Per-environment for the same reason as the twin above,
  # plus a billing one: bot hours are charged per key, so a shared key would
  # make staging spend indistinguishable from production. Named in the
  # UPPER_SNAKE_ENV style the Cloud Run secrets use (SLACK_SIGNING_SECRET_PROD),
  # not the lower-kebab style of the twin keys -- both conventions are live in
  # this project and the remoteRef must match whatever Secret Manager holds.
  - secretKey: RECALL_API_KEY
    remoteRef:
      key: RECALL_API_KEY_PROD
  # Shared secret on the relay websocket. The pod puts it in the URL it hands
  # Recall; comms compares it. A mismatch closes every socket and the assistant
  # silently receives no participant events.
  - secretKey: RECALL_RELAY_SECRET
    remoteRef:
      key: RECALL_RELAY_SECRET_PROD
  # Managed egress for browser sessions that pin their exit to a region. These
  # must reach the container environment rather than the Orchestra Secrets sync:
  # the agent-service is a Node process started by entrypoint.sh, long before
  # Python's SecretManager writes anything into .env, so a value that only lands
  # in os.environ is invisible to it. Without them egressPolicy.ts refuses the
  # session rather than falling back to the pod's own address, which surfaces as
  # `invalid_egress_policy` on an otherwise healthy scrape.
  - secretKey: UNITY_EGRESS_PROXY_SERVER
    remoteRef:
      key: UNITY_EGRESS_PROXY_SERVER
  - secretKey: UNIFY_EGRESS_PROXY_SERVER
    remoteRef:
      key: UNITY_EGRESS_PROXY_SERVER
  - secretKey: UNITY_EGRESS_PROXY_USERNAME
    remoteRef:
      key: UNITY_EGRESS_PROXY_USERNAME
  - secretKey: UNIFY_EGRESS_PROXY_USERNAME
    remoteRef:
      key: UNITY_EGRESS_PROXY_USERNAME
  - secretKey: UNITY_EGRESS_PROXY_PASSWORD
    remoteRef:
      key: UNITY_EGRESS_PROXY_PASSWORD
  - secretKey: UNIFY_EGRESS_PROXY_PASSWORD
    remoteRef:
      key: UNITY_EGRESS_PROXY_PASSWORD
  # Where that endpoint actually exits from. A dedicated-IP username carries no
  # {region} placeholder, so the region cannot reach the provider as a request
  # parameter -- without this declaration a session could exit from the fixed
  # address while reporting some other country's timezone and locale, which is
  # a sharper contradiction than not proxying at all. egressPolicy.ts refuses
  # any region outside this list.
  - secretKey: UNITY_EGRESS_PROXY_REGIONS
    remoteRef:
      key: UNITY_EGRESS_PROXY_REGIONS
  - secretKey: UNIFY_EGRESS_PROXY_REGIONS
    remoteRef:
      key: UNITY_EGRESS_PROXY_REGIONS
