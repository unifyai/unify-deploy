apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unity-secrets
  namespace: staging
  labels:
    app: unity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: unity-gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: unity-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      metadata:
        labels:
          app: unity
      data:
        _UNITY_STARTUP_HOOK_GROUP: "unify_deploy.init"
        _UNITY_STARTUP_HOOK_PACKAGE: "unify-deploy"
  data:
  - secretKey: GCP_SA_KEY
    remoteRef:
      key: gcp-sa-key
  - secretKey: LIVEKIT_SIP_URI
    remoteRef:
      key: LIVEKIT_SIP_URI
  - secretKey: LIVEKIT_URL
    remoteRef:
      key: LIVEKIT_URL
  - secretKey: LIVEKIT_API_KEY
    remoteRef:
      key: LIVEKIT_API_KEY
  - secretKey: LIVEKIT_API_SECRET
    remoteRef:
      key: LIVEKIT_API_SECRET
  - secretKey: DEEPGRAM_API_KEY
    remoteRef:
      key: DEEPGRAM_API_KEY
  - secretKey: CARTESIA_API_KEY
    remoteRef:
      key: CARTESIA_API_KEY
  - secretKey: ELEVEN_API_KEY
    remoteRef:
      key: ELEVEN_API_KEY
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: OPENAI_API_KEY
  - secretKey: OPENROUTER_API_KEY
    remoteRef:
      key: OPENROUTER_API_KEY
  - secretKey: TOGETHER_API_KEY
    remoteRef:
      key: TOGETHER_API_KEY
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: ANTHROPIC_API_KEY
  - secretKey: DEEPSEEK_API_KEY
    remoteRef:
      key: DEEPSEEK_API_KEY
  - secretKey: ANTICAPTCHA_KEY
    remoteRef:
      key: ANTICAPTCHA_KEY
  - secretKey: TAVILY_API_KEY
    remoteRef:
      key: TAVILY_API_KEY
  - secretKey: ORCHESTRA_ADMIN_KEY
    remoteRef:
      key: ORCHESTRA_ADMIN_KEY
  - secretKey: VERTEXAI_CREDENTIALS
    remoteRef:
      key: VERTEXAI_CREDENTIALS
  # Google Meet twin account. Unlike every key above, these are per-environment
  # (each env signs into Meet as its own twin so a staging join can never act as
  # the production identity), hence the -staging / -production suffixes.
  # The remote secrets must exist before this manifest is applied: External
  # Secrets fails the whole ExternalSecret on a missing remoteRef, which would
  # freeze every other key here at its last synced value. The pod also reads
  # MEET_TWIN_TOTP_SECRET when the twin is enrolled in TOTP 2SV; add it here
  # against a meet-twin-totp-secret-staging secret if that is ever turned on.
  - secretKey: MEET_TWIN_EMAIL
    remoteRef:
      key: meet-twin-email-staging
  - secretKey: MEET_TWIN_PASSWORD
    remoteRef:
      key: meet-twin-password-staging
  # Recall.ai bot API. Per-environment for the same reason as the twin above,
  # plus a billing one: bot hours are charged per key, so a shared key would
  # make staging spend indistinguishable from production. Named in the
  # UPPER_SNAKE_ENV style the Cloud Run secrets use (SLACK_SIGNING_SECRET_PROD),
  # not the lower-kebab style of the twin keys -- both conventions are live in
  # this project and the remoteRef must match whatever Secret Manager holds.
  - secretKey: RECALL_API_KEY
    remoteRef:
      key: RECALL_API_KEY_STAGING
