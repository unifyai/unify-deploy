# ClusterSecretStore for External Secrets Operator.
# Uses the comm runtime GCP key (from Secret Manager gcp-sa-key) stored once in
# external-secrets-gcp-credentials — created by install_external_secrets_operator.sh.
# See deploy/guides/UNITY_CLUSTER_SECRETS.md
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: unity-gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: gcp-project-runtime
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: external-secrets-gcp-credentials
            namespace: external-secrets
            key: key.json
