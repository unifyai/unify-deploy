---
# Weekly rollout restart for the parse + ingest workers.
#
# Purpose:
# * Pick up new base-layer packages (OS, libc, Python) by forcing a
#   fresh image pull even when the application Dockerfile hasn't
#   changed.
# * Reset slow memory creep (e.g. glibc arena fragmentation, caching
#   layers inside third-party libraries) that accumulates across
#   hundreds of long-running messages.
# * Validate that the maxSurge=100% rolling-update path actually
#   works -- if this CronJob ever fails, we know the rolling
#   semantics drifted before it bites a real incident.
#
# Schedule: Sunday 03:00 UTC (low-traffic window across US/EU).
# Strategy: `kubectl rollout restart` mutates the pod-template
# annotation, which triggers the Deployment's configured rolling
# update. With maxSurge=100%, new pods come up immediately alongside
# old pods that may still be draining (up to 10 min, matching the
# GKE Autopilot terminationGracePeriodSeconds cap). Capacity never dips.
#
# The CronJob lives in the `default` namespace (neutral ground) and
# restarts workers in both `staging` and `production` namespaces.
# RBAC is granted via one Role + RoleBinding per target namespace
# (Roles are namespace-scoped, so we need one pair per namespace).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: unity-workers-rollout
  namespace: default
  labels:
    app: unity-workers-rollout
    component: pipeline-maintenance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unity-workers-rollout
  namespace: staging
  labels:
    app: unity-workers-rollout
    component: pipeline-maintenance
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["unity-parse-worker", "unity-ingest-worker"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/status"]
  resourceNames: ["unity-parse-worker", "unity-ingest-worker"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unity-workers-rollout
  namespace: staging
  labels:
    app: unity-workers-rollout
    component: pipeline-maintenance
subjects:
- kind: ServiceAccount
  name: unity-workers-rollout
  namespace: default
roleRef:
  kind: Role
  name: unity-workers-rollout
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unity-workers-rollout
  namespace: production
  labels:
    app: unity-workers-rollout
    component: pipeline-maintenance
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["unity-parse-worker", "unity-ingest-worker"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/status"]
  resourceNames: ["unity-parse-worker", "unity-ingest-worker"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unity-workers-rollout
  namespace: production
  labels:
    app: unity-workers-rollout
    component: pipeline-maintenance
subjects:
- kind: ServiceAccount
  name: unity-workers-rollout
  namespace: default
roleRef:
  kind: Role
  name: unity-workers-rollout
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unity-workers-weekly-rollout
  namespace: default
  labels:
    app: unity-workers-rollout
    component: pipeline-maintenance
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: unity-workers-rollout
            component: pipeline-maintenance
        spec:
          serviceAccountName: unity-workers-rollout
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: bitnami/kubectl:1.30
            command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "[$(date -u +%FT%TZ)] Triggering rollout restart for parse+ingest workers"
              kubectl rollout restart deployment/unity-parse-worker -n staging
              kubectl rollout restart deployment/unity-ingest-worker -n staging
              kubectl rollout restart deployment/unity-parse-worker -n production
              kubectl rollout restart deployment/unity-ingest-worker -n production
              echo "[$(date -u +%FT%TZ)] Rollout commands issued; workers drain in <=10m"
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
