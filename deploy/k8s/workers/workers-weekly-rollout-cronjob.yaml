---
# Weekly rollout restart for the parse + ingest workers.
#
# Purpose:
# * Pick up new base-layer packages (OS, libc, Python) by forcing a
#   fresh image pull even when the application Dockerfile hasn't
#   changed.
# * Reset slow memory creep (e.g. glibc arena fragmentation, caching
#   layers inside third-party libraries) that accumulates across
#   hundreds of long-running messages.
# * Validate that the maxSurge=100% rolling-update path actually
#   works -- if this CronJob ever fails, we know the rolling
#   semantics drifted before it bites a real incident.
#
# Schedule: Sunday 03:00 UTC (low-traffic window across US/EU).
# Safety: suspended by default. Worker restarts must go through the
# Cloud Build `worker-refresh-check` gate or an operator-controlled
# maintenance window so active ingestion is not interrupted.
#
# One CronJob is defined per environment namespace. Keeping maintenance
# resources in `staging` and `production` avoids hidden/default namespace
# control-plane state and makes environment ownership explicit.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: droid-workers-rollout
  namespace: staging
  labels:
    app: droid-workers-rollout
    component: pipeline-maintenance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: droid-workers-rollout
  namespace: staging
  labels:
    app: droid-workers-rollout
    component: pipeline-maintenance
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["droid-parse-worker", "droid-ingest-worker"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/status"]
  resourceNames: ["droid-parse-worker", "droid-ingest-worker"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: droid-workers-rollout
  namespace: staging
  labels:
    app: droid-workers-rollout
    component: pipeline-maintenance
subjects:
- kind: ServiceAccount
  name: droid-workers-rollout
  namespace: staging
roleRef:
  kind: Role
  name: droid-workers-rollout
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: droid-workers-weekly-rollout
  namespace: staging
  labels:
    app: droid-workers-rollout
    component: pipeline-maintenance
    environment: staging
spec:
  schedule: "0 3 * * 0"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: droid-workers-rollout
            component: pipeline-maintenance
            environment: staging
        spec:
          serviceAccountName: droid-workers-rollout
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: bitnami/kubectl:1.30
            command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "[$(date -u +%FT%TZ)] Triggering staging rollout restart for parse+ingest workers"
              echo "This CronJob is expected to stay suspended unless an operator has verified pipeline worker refresh safety."
              kubectl rollout restart deployment/droid-parse-worker -n staging
              kubectl rollout restart deployment/droid-ingest-worker -n staging
              echo "[$(date -u +%FT%TZ)] Staging rollout commands issued; workers drain in <=10m"
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: droid-workers-rollout
  namespace: production
  labels:
    app: droid-workers-rollout
    component: pipeline-maintenance
    environment: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: droid-workers-rollout
  namespace: production
  labels:
    app: droid-workers-rollout
    component: pipeline-maintenance
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["droid-parse-worker", "droid-ingest-worker"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/status"]
  resourceNames: ["droid-parse-worker", "droid-ingest-worker"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: droid-workers-rollout
  namespace: production
  labels:
    app: droid-workers-rollout
    component: pipeline-maintenance
subjects:
- kind: ServiceAccount
  name: droid-workers-rollout
  namespace: production
roleRef:
  kind: Role
  name: droid-workers-rollout
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: droid-workers-weekly-rollout
  namespace: production
  labels:
    app: droid-workers-rollout
    component: pipeline-maintenance
    environment: production
spec:
  schedule: "0 3 * * 0"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: droid-workers-rollout
            component: pipeline-maintenance
            environment: production
        spec:
          serviceAccountName: droid-workers-rollout
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: bitnami/kubectl:1.30
            command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "[$(date -u +%FT%TZ)] Triggering production rollout restart for parse+ingest workers"
              echo "This CronJob is expected to stay suspended unless an operator has verified pipeline worker refresh safety."
              kubectl rollout restart deployment/droid-parse-worker -n production
              kubectl rollout restart deployment/droid-ingest-worker -n production
              echo "[$(date -u +%FT%TZ)] Production rollout commands issued; workers drain in <=10m"
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
