---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: droid-pipeline-stale-reconciler
  namespace: staging
  labels:
    app: droid-pipeline-stale-reconciler
    component: pipeline-maintenance
    environment: staging
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app: droid-pipeline-stale-reconciler
            component: pipeline-maintenance
            environment: staging
        spec:
          serviceAccountName: droid-pipeline-worker
          restartPolicy: Never
          containers:
          - name: stale-reconciler
            image: us-central1-docker.pkg.dev/gcp-project-runtime/droid/droid-staging:latest
            command:
            - python
            - -m
            - droid_deploy.infra.cli.pipeline_control
            - reconcile-stale
            - --env
            - staging
            - --dispatch-limit
            - "100"
            - --max-jobs
            - "5"
            - --execute
            env:
            - name: DROID_STALE_RECONCILER_DRY_RUN
              value: "false"
            - name: DROID_GCP_PIPELINE_ENVIRONMENT
              value: "staging"
            - name: DROID_GCS_ARTIFACT_BUCKET
              value: "droid-pipeline-artifacts-staging"
            - name: DROID_PUBSUB_PROJECT_ID
              value: "gcp-project-runtime"
            - name: ORCHESTRA_URL
              value: "https://internal.example.com/v0"
---
