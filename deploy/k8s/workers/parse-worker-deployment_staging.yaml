---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unity-parse-worker
  namespace: default
  labels:
    app: unity-parse-worker
    component: pipeline-worker
    environment: staging
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: unity-parse-worker
  template:
    metadata:
      labels:
        app: unity-parse-worker
        component: pipeline-worker
        environment: staging
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # Staging mirrors production's 24h grace so drain semantics are
      # exercised under real load. Ops can always force-delete a stuck
      # staging pod with `kubectl delete pod --grace-period=0 --force`.
      terminationGracePeriodSeconds: 86400
      containers:
      - name: parse-worker
        image: us-central1-docker.pkg.dev/gcp-project-runtime/unity/unity-staging:latest
        command:
        - python
        - -m
        - unity_deploy.infra.workers.entrypoint_parse
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 2"]
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
            ephemeral-storage: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
            ephemeral-storage: "4Gi"
        env:
        - name: UNITY_GCP_PIPELINE_ENVIRONMENT
          value: "staging"
        - name: UNITY_GCS_ARTIFACT_BUCKET
          value: "unity-pipeline-artifacts-staging"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
        - name: GCP_SA_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: GCP_SA_KEY
        - name: UNITY_PUBSUB_PROJECT_ID
          value: "gcp-project-runtime"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unity-parse-worker-hpa
  namespace: default
  labels:
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unity-parse-worker
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: unity-parse-sub-staging
      target:
        type: AverageValue
        averageValue: "1"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 3600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unity-parse-worker-pdb
  namespace: default
  labels:
    environment: staging
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: unity-parse-worker
