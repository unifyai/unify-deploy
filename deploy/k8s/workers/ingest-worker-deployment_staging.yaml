---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unity-ingest-worker
  namespace: default
  labels:
    app: unity-ingest-worker
    component: pipeline-worker
    environment: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: unity-ingest-worker
  template:
    metadata:
      labels:
        app: unity-ingest-worker
        component: pipeline-worker
        environment: staging
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      terminationGracePeriodSeconds: 86400
      containers:
      - name: ingest-worker
        image: us-central1-docker.pkg.dev/gcp-project-runtime/unity/unity-staging:latest
        command:
        - python
        - -m
        - unity_deploy.infra.workers.entrypoint_ingest
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 2"]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "3Gi"
        env:
        - name: UNITY_GCP_PIPELINE_ENVIRONMENT
          value: "staging"
        - name: UNITY_GCS_ARTIFACT_BUCKET
          value: "unity-pipeline-artifacts-staging"
        # ORCHESTRA_URL + ORCHESTRA_ADMIN_KEY are the only credentials
        # the pod carries: every message triggers a per-assistant
        # UNIFY_KEY lookup via Orchestra's admin endpoints (see
        # unity_deploy.infra.workers.assistant_key_resolver). The pod
        # does not, and must not, hold a shared UNIFY_KEY -- shared
        # workers serve many tenants, and a baked-in key would auth
        # every call as the wrong user.
        - name: ORCHESTRA_URL
          value: "https://internal.example.com/v0"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
        - name: GCP_SA_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: GCP_SA_KEY
        - name: UNITY_PUBSUB_PROJECT_ID
          value: "gcp-project-runtime"
        - name: UNIFY_PROJECT_NAME
          value: "Assistants"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unity-ingest-worker-hpa
  namespace: default
  labels:
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unity-ingest-worker
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: unity-ingest-sub-staging
      target:
        type: AverageValue
        averageValue: "1"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 3600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unity-ingest-worker-pdb
  namespace: default
  labels:
    environment: staging
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: unity-ingest-worker
