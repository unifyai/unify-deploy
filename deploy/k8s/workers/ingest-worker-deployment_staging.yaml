---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unity-ingest-worker
  namespace: staging
  labels:
    app: unity-ingest-worker
    component: pipeline-worker
    environment: staging
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: unity-ingest-worker
  template:
    metadata:
      labels:
        app: unity-ingest-worker
        component: pipeline-worker
        environment: staging
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: unity-pipeline-worker
      # Ingest workers checkpoint per-chunk to GCS
      # (`_make_checkpoint_callback` in ingest_worker.py), so a
      # SIGKILL after the grace window only loses the current chunk:
      # Pub/Sub redelivery + `read_checkpoint` resumes the message
      # cleanly on another pod.  10 min comfortably exceeds any
      # single chunk and matches the Pub/Sub ack-deadline so there
      # is no window where the message is neither leased nor
      # redelivered.  See the 'Termination grace period' section of
      # the pause-resume-instant-cancel plan for the full rationale.
      terminationGracePeriodSeconds: 600
      containers:
      - name: ingest-worker
        image: us-central1-docker.pkg.dev/gcp-project-runtime/unity/unity-staging:latest
        command:
        - python
        - -m
        - unity_deploy.infra.workers.entrypoint_ingest
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
            ephemeral-storage: "4Gi"
          limits:
            cpu: "2"
            memory: "3Gi"
            ephemeral-storage: "4Gi"
        env:
        - name: UNITY_GCP_PIPELINE_ENVIRONMENT
          value: "staging"
        - name: UNITY_GCS_ARTIFACT_BUCKET
          value: "unity-pipeline-artifacts-staging"
        # GCS attempt-lease TTL. Refreshed every chunk (~20-30s), so this is
        # only the window before an orphaned lease (from a killed pod) becomes
        # stealable. Kept comfortably above one chunk but bounded so scale-down/
        # rollout orphans recover quickly. See BACKFILL_RUNBOOK.md.
        - name: UNITY_INGEST_ATTEMPT_LEASE_TTL
          value: "480"
        - name: ORCHESTRA_URL
          value: "https://internal.example.com/v0"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
        - name: UNITY_PUBSUB_PROJECT_ID
          value: "gcp-project-runtime"
        - name: UNIFY_PROJECT_NAME
          value: "Assistants"
        livenessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 30
          periodSeconds: 60
        readinessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unity-ingest-worker-hpa
  namespace: staging
  labels:
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unity-ingest-worker
  minReplicas: 1
  maxReplicas: 15
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: unity-ingest-sub-staging
      target:
        type: AverageValue
        averageValue: "1"
  behavior:
    # A 15 -> 1 drain took ~70 min under the previous `type: Pods /
    # value: 1 / periodSeconds: 300` policy (1 pod every 5 min).
    # Percent-based scaling compresses the same drain to ~11 min:
    # 15 -> 7 -> 3 -> 1 at 5-min intervals.  The shortened
    # stabilization window (60s instead of 300s) also means the HPA
    # starts reacting as soon as backlog hits zero, which is what
    # pause/cancel expects once parked messages are ack'd.
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unity-ingest-worker-pdb
  namespace: staging
  labels:
    environment: staging
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: unity-ingest-worker
