---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unity-parse-worker
  namespace: default
  labels:
    app: unity-parse-worker
    component: pipeline-worker
spec:
  replicas: 2
  # With a 24h grace period, a rolling restart cannot use the default
  # maxUnavailable=25%/maxSurge=25% -- old pods keep draining for up to
  # 24h, which would stall the rollout. maxSurge=100% + maxUnavailable=0
  # means new pods come up immediately alongside draining old ones;
  # capacity briefly doubles, never dips.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: unity-parse-worker
  template:
    metadata:
      labels:
        app: unity-parse-worker
        component: pipeline-worker
      annotations:
        # Cluster autoscaler must never evict a worker mid-drain; the
        # app is responsible for exiting cleanly once in-flight work is
        # acked. Without this annotation, the CA can reclaim an
        # under-utilized node even while the pod is processing.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # 24h grace period covers the worst-case single-message processing
      # time. The app drains on SIGTERM (stops pulling, finishes in
      # flight, ack, exit). If the app exits sooner, the pod terminates
      # sooner; this is only an upper bound.
      terminationGracePeriodSeconds: 86400
      containers:
      - name: parse-worker
        image: us-central1-docker.pkg.dev/gcp-project-runtime/unity/unity:latest
        command:
        - python
        - -m
        - unity_deploy.infra.workers.entrypoint_parse
        lifecycle:
          preStop:
            # Tiny delay before SIGTERM so any in-flight lifecycle
            # events (metric flushes, etc.) propagate. The real drain
            # logic is the app's SIGTERM handler.
            exec:
              command: ["sh", "-c", "sleep 2"]
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "6Gi"
        env:
        - name: UNITY_GCP_PIPELINE_ENVIRONMENT
          value: "production"
        - name: UNITY_GCS_ARTIFACT_BUCKET
          value: "unity-pipeline-artifacts"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
        - name: GCP_SA_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: GCP_SA_KEY
        - name: UNITY_PUBSUB_PROJECT_ID
          value: "gcp-project-runtime"
        livenessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 30
          periodSeconds: 60
        readinessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unity-parse-worker-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unity-parse-worker
  # One-pod-per-message semantics: the Pub/Sub pull client requests
  # max_messages=1, so each pod handles exactly one ParseRequested at a
  # time. averageValue=1 scales replicas linearly with the undelivered
  # queue depth. minReplicas=2 keeps warm capacity.
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: unity-parse-sub
      target:
        type: AverageValue
        averageValue: "1"
  # Scale-down must not thrash pods that are still draining. 1h
  # stabilization + "at most 1 pod every 5 min" caps churn even when
  # undelivered depth briefly drops to zero.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 3600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unity-parse-worker-pdb
  namespace: default
spec:
  # Voluntary disruption budget (node drains, rolling evictions). With
  # maxUnavailable=1 a drain proceeds one pod at a time, which keeps
  # the worker pool serving while nodes recycle. Involuntary
  # disruption (node hardware failure) is not constrained by PDB.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: unity-parse-worker
