---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unity-parse-worker
  namespace: production
  labels:
    app: unity-parse-worker
    component: pipeline-worker
    environment: production
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: unity-parse-worker
  template:
    metadata:
      labels:
        app: unity-parse-worker
        component: pipeline-worker
        environment: production
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # Parse workers have no per-chunk checkpoint (one message =
      # one download + one Docling parse + one manifest write), so a
      # SIGKILL mid-parse means the whole message retries from
      # scratch.  We keep a generous 30 min grace so an
      # already-in-flight parse of a large PDF can finish even
      # during rolling-restarts; the Pub/Sub DLQ
      # (`unity-dead-letter` + maxDeliveryAttempts=15 from
      # deploy/scripts/dev/setup_pipeline_infra.sh) still bounds
      # worst-case loops for truly pathological files.
      terminationGracePeriodSeconds: 1800
      containers:
      - name: parse-worker
        image: us-central1-docker.pkg.dev/gcp-project-runtime/unity/unity:latest
        command:
        - python
        - -m
        - unity_deploy.infra.workers.entrypoint_parse
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
            ephemeral-storage: "4Gi"
          limits:
            cpu: "2"
            memory: "6Gi"
            ephemeral-storage: "4Gi"
        env:
        - name: UNITY_GCP_PIPELINE_ENVIRONMENT
          value: "production"
        - name: UNITY_GCS_ARTIFACT_BUCKET
          value: "unity-pipeline-artifacts"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
        - name: GCP_SA_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: GCP_SA_KEY
        - name: UNITY_PUBSUB_PROJECT_ID
          value: "gcp-project-runtime"
        livenessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 30
          periodSeconds: 60
        readinessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unity-parse-worker-hpa
  namespace: production
  labels:
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unity-parse-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: unity-parse-sub
      target:
        type: AverageValue
        averageValue: "1"
  behavior:
    # Same tuning as the ingest worker: percent-based scale-down
    # on 5-min ticks, with a short 60s stabilization window so the
    # HPA reacts quickly once parse backlog is worked off.
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unity-parse-worker-pdb
  namespace: production
  labels:
    environment: production
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: unity-parse-worker
