---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: droid-failed-pod-gc
  namespace: staging
  labels:
    app: droid-failed-pod-gc
    component: pipeline-maintenance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: droid-failed-pod-gc
  namespace: staging
  labels:
    app: droid-failed-pod-gc
    component: pipeline-maintenance
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: droid-failed-pod-gc
  namespace: staging
  labels:
    app: droid-failed-pod-gc
    component: pipeline-maintenance
subjects:
- kind: ServiceAccount
  name: droid-failed-pod-gc
  namespace: staging
roleRef:
  kind: Role
  name: droid-failed-pod-gc
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: droid-failed-pod-gc
  namespace: staging
  labels:
    app: droid-failed-pod-gc
    component: pipeline-maintenance
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: droid-failed-pod-gc
            component: pipeline-maintenance
        spec:
          serviceAccountName: droid-failed-pod-gc
          restartPolicy: Never
          containers:
          - name: kubectl
            image: bitnami/kubectl:latest
            command:
            - sh
            - -c
            - |
              set -eu
              kubectl delete pods -n staging \
                -l component=pipeline-worker \
                --field-selector=status.phase=Failed \
                --ignore-not-found=true
              kubectl delete pods -n staging \
                -l component=pipeline-worker \
                --field-selector=status.phase=Unknown \
                --ignore-not-found=true
---
