# Syncs the GitHub App private key from GCP Secret Manager into a K8s Secret the
# runner Deployment reads as APP_PRIVATE_KEY. Uses the same ClusterSecretStore
# (unity-gcp-secret-manager) as deploy/k8s/secrets/.
#
# The runner authenticates as an org-owned GitHub App rather than a user PAT, so
# the credential belongs to `unifyai` instead of an individual and carries no
# expiry date to renew. The entrypoint exchanges this key for an installation
# token on every registration, so the token's 1h lifetime is not a constraint.
#
# Create the source secret once (PEM downloaded when generating the App key):
#   gcloud secrets create CI_RUNNER_GITHUB_APP_PRIVATE_KEY \
#     --project=gcp-project-runtime
#   gcloud secrets versions add CI_RUNNER_GITHUB_APP_PRIVATE_KEY \
#     --data-file=<app-private-key>.pem --project=gcp-project-runtime
#
# external-secrets-reader@ holds project-level secretAccessor, so no per-secret
# IAM grant is needed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ci-integration-runner-github
  namespace: staging
  labels:
    app: ci-integration-runner
    component: ci-runner
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: unity-gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: ci-integration-runner-github
    creationPolicy: Owner
  data:
  - secretKey: APP_PRIVATE_KEY
    remoteRef:
      key: CI_RUNNER_GITHUB_APP_PRIVATE_KEY
