---
# Syncs the GitHub runner-registration credential from GCP Secret Manager into a
# K8s Secret the runner Deployment reads as ACCESS_TOKEN. Uses the same
# ClusterSecretStore (unity-gcp-secret-manager) as deploy/k8s/secrets/.
#
# Create the source secret once:
#   gcloud secrets create CI_RUNNER_GITHUB_TOKEN --project=gcp-project-runtime
#   printf '%s' "<PAT-with-repo-admin:runner>" | \
#     gcloud secrets versions add CI_RUNNER_GITHUB_TOKEN --data-file=- \
#       --project=gcp-project-runtime
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ci-integration-runner-github
  namespace: staging
  labels:
    app: ci-integration-runner
    component: ci-runner
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: unity-gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: ci-integration-runner-github
    creationPolicy: Owner
  data:
  - secretKey: ACCESS_TOKEN
    remoteRef:
      key: CI_RUNNER_GITHUB_TOKEN
