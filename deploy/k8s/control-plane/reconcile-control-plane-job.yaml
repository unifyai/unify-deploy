apiVersion: batch/v1
kind: Job
metadata:
  generateName: unity-control-plane-reconcile-
  namespace: __NAMESPACE__
  labels:
    app: unity-control-plane-reconcile
    component: control-plane-reconcile
    environment: __ENVIRONMENT__
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: unity-control-plane-reconcile
        component: control-plane-reconcile
        environment: __ENVIRONMENT__
    spec:
      restartPolicy: Never
      containers:
      - name: reconciler
        image: __IMAGE__
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          set -- python -m unity_deploy.scripts.reconcile_control_plane \
            --environment "${UNITY_CONTROL_PLANE_ENVIRONMENT}" \
            --apply
          if [ -n "${UNITY_CONTROL_PLANE_CLIENT:-}" ]; then
            set -- "$@" --client "${UNITY_CONTROL_PLANE_CLIENT}"
          fi
          if [ -n "${UNITY_CONTROL_PLANE_ASSISTANT_ID:-}" ]; then
            set -- "$@" --assistant-id "${UNITY_CONTROL_PLANE_ASSISTANT_ID}"
          fi
          exec "$@"
        env:
        - name: UNITY_CONTROL_PLANE_ENVIRONMENT
          value: "__ENVIRONMENT__"
        - name: UNITY_CONTROL_PLANE_CLIENT
          value: "__CLIENT__"
        - name: UNITY_CONTROL_PLANE_ASSISTANT_ID
          value: "__ASSISTANT_ID__"
        - name: ORCHESTRA_URL
          value: "__ORCHESTRA_URL__"
        - name: UNITY_COMMS_URL
          value: "__UNITY_COMMS_URL__"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
