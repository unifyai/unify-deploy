apiVersion: batch/v1
kind: Job
metadata:
  generateName: unity-deployment-reconcile-
  namespace: __NAMESPACE__
  labels:
    app: unity-deployment-reconcile
    component: deployment-reconcile
    environment: __ENVIRONMENT__
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: unity-deployment-reconcile
        component: deployment-reconcile
        environment: __ENVIRONMENT__
    spec:
      # Pipeline-worker SA already has storage.objectAdmin for reading
      # gs://bucket during bundled-mode registry load.
      serviceAccountName: unity-pipeline-worker
      restartPolicy: Never
      containers:
      - name: reconciler
        image: __IMAGE__
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          set -- python -m unify_deploy.scripts.reconcile_deployment \
            --environment "${UNIFY_DEPLOYMENT_ENVIRONMENT}" \
            --planes "${UNIFY_DEPLOYMENT_PLANES}" \
            --concurrency "${UNIFY_DEPLOYMENT_CONCURRENCY}" \
            --apply
          if [ -n "${UNIFY_DEPLOYMENT_CLIENT:-}" ]; then
            set -- "$@" --client "${UNIFY_DEPLOYMENT_CLIENT}"
          fi
          if [ -n "${UNIFY_DEPLOYMENT_ASSISTANT_ID:-}" ]; then
            set -- "$@" --assistant-id "${UNIFY_DEPLOYMENT_ASSISTANT_ID}"
          fi
          exec "$@"
        env:
        - name: UNIFY_DEPLOYMENT_ENVIRONMENT
          value: "__ENVIRONMENT__"
        - name: UNIFY_DEPLOYMENT_PLANES
          value: "__PLANES__"
        - name: UNIFY_DEPLOYMENT_CONCURRENCY
          value: "__CONCURRENCY__"
        - name: UNIFY_DEPLOYMENT_CLIENT
          value: "__CLIENT__"
        - name: UNIFY_DEPLOYMENT_ASSISTANT_ID
          value: "__ASSISTANT_ID__"
        # brain_operator client routing reads this at reconcile time to
        # decide which assistant receives the unify_company bundle.
        # Empty (the default for envs that don't pass the flag) => no
        # operator target, which is the safe no-op.
        - name: BRAIN_OPERATOR_ASSISTANT_ID
          value: "__BRAIN_OPERATOR_ASSISTANT_ID__"
        - name: ORCHESTRA_URL
          value: "__ORCHESTRA_URL__"
        - name: UNIFY_COMMS_URL
          value: "__UNITY_COMMS_URL__"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
