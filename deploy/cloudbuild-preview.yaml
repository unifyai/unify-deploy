# Cloud Build pipeline for preview-environment Unity overlay images.
#
# Triggered by ``unity-preview`` after it builds a feature-branch
# unity-base image.  Applies the enterprise overlay on top of the
# passed-in base image, pushes the resulting image as
# ``unity-staging:preview-<slug>-<sha>``, and uploads ``preview-<slug>-<sha>``
# to the per-branch GCS blob ``image_hash_staging_<slug>.txt``.
#
# Singleton refresh steps from the staging pipeline (control-plane
# reconcile, idle job refresh, pipeline worker rollout) are
# intentionally skipped: a preview-environment Comms App revision
# does not own the staging warm pool or staging pipeline workers.

steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    echo "Base image: ${_BASE_IMAGE}"
    echo "Unity tag:  ${_UNITY_TAG}"
    echo "Slug:       ${_SLUG}"
    DOCKER_BUILDKIT=1 docker build \
      --build-arg BASE_IMAGE=${_BASE_IMAGE} \
      -f deploy/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:${_UNITY_TAG} .

  # Preview does not own singleton staging pipeline workers, but it still
  # builds the overlay image. Keep maintenance CLI smoke coverage aligned
  # with staging/production before publishing the image.
- name: 'gcr.io/cloud-builders/docker'
  id: 'smoke-pipeline-cli'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker run --rm \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:${_UNITY_TAG} \
      python -m unity_deploy.infra.cli.pipeline_control reconcile-dlq --help >/dev/null
    docker run --rm \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:${_UNITY_TAG} \
      python -m unity_deploy.infra.cli.pipeline_control reconcile-stale --help >/dev/null
    docker run --rm \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:${_UNITY_TAG} \
      python -m unity_deploy.infra.cli.pipeline_control recover-stale --help >/dev/null
    docker run --rm \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:${_UNITY_TAG} \
      python -m unity_deploy.infra.cli.pipeline_control worker-refresh-check --help >/dev/null
  waitFor: ['build-image']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-staging:${_UNITY_TAG}']
  waitFor: ['smoke-pipeline-cli']

- name: 'gcr.io/cloud-builders/gsutil'
  id: 'upload-sha'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    echo ${_UNITY_TAG} | gsutil cp - gs://bucket/image_hash_staging_${_SLUG}.txt
    echo "Uploaded ${_UNITY_TAG} to gs://bucket/image_hash_staging_${_SLUG}.txt"
  waitFor: ['push-image']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

# These substitutions are passed in by the upstream ``unity-preview``
# trigger.  When the trigger fires directly (rare), the defaults below
# build against the staging :latest base image, but the resulting image
# would be uploaded to a slug-specific blob and so is harmless.
substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity'
  _BASE_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base-staging:latest'
  _UNITY_TAG: 'preview-direct-${SHORT_SHA}'
  _SLUG: 'direct'

timeout: '900s'
