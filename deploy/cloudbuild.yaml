steps:
  # Build thin enterprise overlay on top of the Droid base image.
  # _BASE_IMAGE is passed by the upstream Droid build trigger via substitution override.
  # Falls back to droid-base:latest if triggered directly.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    echo "Base image: ${_BASE_IMAGE}"
    echo "Brain ref:  ${_BRAIN_REF}"
    DOCKER_BUILDKIT=1 docker build \
      --build-arg BASE_IMAGE=${_BASE_IMAGE} \
      --build-arg BRAIN_REF=${_BRAIN_REF} \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      -f deploy/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:latest .
  secretEnv: ['GITHUB_TOKEN']

  # Fail the deployment before pushing if the worker image does not include
  # the maintenance CLI commands referenced by the Kubernetes CronJobs.
- name: 'gcr.io/cloud-builders/docker'
  id: 'smoke-pipeline-cli'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker run --rm \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA} \
      python -m unity_deploy.infra.cli.pipeline_control reconcile-dlq --help >/dev/null
    docker run --rm \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA} \
      python -m unity_deploy.infra.cli.pipeline_control reconcile-stale --help >/dev/null
    docker run --rm \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA} \
      python -m unity_deploy.infra.cli.pipeline_control recover-stale --help >/dev/null
    docker run --rm \
      ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA} \
      python -m unity_deploy.infra.cli.pipeline_control worker-refresh-check --help >/dev/null
  waitFor: ['build-image']

  # Fetch public Droid integration manifests for the integrations artifact job.
- name: 'gcr.io/cloud-builders/git'
  id: 'fetch-droid-integration-manifests'
  entrypoint: 'bash'
  secretEnv: ['GITHUB_TOKEN']
  args:
  - '-c'
  - |
    set -euo pipefail
    git clone --depth 1 --branch main https://$$GITHUB_TOKEN@github.com/unifyai/droid.git /workspace/droid-manifest-src
    if [ -n "${_DROID_SHA}" ] && git -C /workspace/droid-manifest-src fetch --depth 1 origin "${_DROID_SHA}"; then
      git -C /workspace/droid-manifest-src checkout --detach FETCH_HEAD
    fi
    cp -R /workspace/droid-manifest-src/deploy/integrations /workspace/integration-manifests
  waitFor: ['-']

  # Push Docker Image (SHA and latest tags in parallel)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA}
  waitFor: ['smoke-pipeline-cli']

  # Start all Builtins artifact seeding asynchronously. Core artifacts
  # (functions/guidance) run from the Droid image; provider integration artifacts
  # run from the Orchestra service image and materialize into Builtins contexts.
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'start-builtins-artifacts-seed'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    bash deploy/scripts/run_seed_builtins_artifacts_job.sh \
      --environment production \
      --manifest /workspace/integration-manifests/bootstrap.production.toml \
      --droid-image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA}" \
      --async
  waitFor: ['fetch-droid-integration-manifests', 'push-sha-tag']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:latest
  waitFor: ['smoke-pipeline-cli']

  # Upload SHA to Cloud Storage
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'upload-sha'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    echo ${SHORT_SHA} | gsutil cp - gs://bucket/image_hash.txt
  waitFor: ['push-latest-tag']

  # One-time cluster bootstrap: deploy/scripts/kubernetes/install_external_secrets_operator.sh
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'apply-droid-external-secrets'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    gcloud container clusters get-credentials "${_CLUSTER}" --region "${_REGION}"
    kubectl apply -f deploy/k8s/secrets/droid-secrets-external-secret_production.yaml
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['push-sha-tag']

  # Reconcile deploy-time control-plane state before any deploy step wakes Droid
  # containers. Runtime seed/function sync runs per assistant after wake with
  # that assistant's UNIFY_KEY.
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'reconcile-deployment'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    gcloud container clusters get-credentials "${_CLUSTER}" --region "${_REGION}"

    bash deploy/scripts/run_deployment_reconcile_job.sh \
      --environment production \
      --namespace production \
      --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA}" \
      --orchestra-url "${_ORCHESTRA_URL}" \
      --droid-comms-url "${_DROID_COMMS_URL}" \
      --planes control-plane \
      --concurrency 8 \
      --timeout 600s
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['apply-droid-external-secrets', 'upload-sha']

  # Refresh idle containers so they pick up the new image
- name: 'gcr.io/cloud-builders/curl'
  id: 'refresh-idle-jobs'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    ADAPTERS=https://service.a.run.app
    AUTH="Authorization: Bearer $$ORCHESTRA_ADMIN_KEY"

    echo "Refreshing idle jobs with new image..."
    curl -sf -X POST -H "$${AUTH}" "$${ADAPTERS}/scheduled/jobs/create?refresh=true" && echo

    echo "Waiting 120s for jobs to register as idle..."
    sleep 120

    echo "Cleaning up stale idle jobs..."
    curl -sf -X POST -H "$${AUTH}" "$${ADAPTERS}/scheduled/jobs/cleanup" && echo
    echo "Idle job refresh complete."
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  waitFor: ['reconcile-deployment']

  # Refresh pipeline workers so parse/ingest pods pick up the new image.
  # Mirrors refresh-idle-jobs above for the adapter Cloud Run jobs;
  # workers run in GKE rather than Cloud Run, so we reconcile via
  # kubectl:
  #   - `kubectl apply` re-applies any manifest drift (HPA target,
  #     PDB budget, resource limits) whenever the YAML changes.
  #   - `kubectl rollout restart` forces pods to restart even when
  #     the pod-template spec is byte-identical (which is the common
  #     case, because the manifest pins the :latest tag and the SHA
  #     lives in the image itself).
  # Runs in parallel with refresh-idle-jobs (no dependency between
  # them). We wait for the newly-created ReplicaSet to become
  # available, but deliberately do not wait for old worker pods to
  # finish termination because long graceful drains should not block
  # the deploy after replacement capacity is serving.
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'refresh-pipeline-workers'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    # The cloud-builders/kubectl image only auto-runs
    # `gcloud container clusters get-credentials` via its default
    # entrypoint wrapper. We override entrypoint to `bash`, so we
    # have to fetch credentials ourselves or kubectl falls back to
    # talking to localhost:8080 and every apply fails.
    gcloud container clusters get-credentials "${_CLUSTER}" --region "${_REGION}"

    latest_replicaset() {
      deployment="$$1"
      namespace="$$2"
      kubectl get rs -n "$$namespace" \
        -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name=='$$deployment')]}{.metadata.creationTimestamp}{'\t'}{.metadata.name}{'\n'}{end}" \
        | sort | tail -n 1 | awk '{print $$2}'
    }

    wait_for_new_replicaset_available() {
      deployment="$$1"
      namespace="$$2"
      previous_rs="$$3"

      echo "Waiting for $$deployment to create a new ReplicaSet..."
      rs_deadline=$$(($$SECONDS + 300))
      new_rs=""
      while [ "$$SECONDS" -lt "$$rs_deadline" ]; do
        candidate="$$(latest_replicaset "$$deployment" "$$namespace" || true)"
        if [ -n "$$candidate" ] && [ "$$candidate" != "$$previous_rs" ]; then
          new_rs="$$candidate"
          break
        fi
        sleep 5
      done
      if [ -z "$$new_rs" ]; then
        echo "Timed out waiting for a new ReplicaSet for $$deployment" >&2
        kubectl get deployment "$$deployment" -n "$$namespace" -o wide || true
        kubectl get rs -n "$$namespace" || true
        return 1
      fi

      echo "Waiting for Kubernetes rollout status for $$deployment..."
      kubectl rollout status deployment/"$$deployment" -n "$$namespace" --timeout=900s

      echo "Waiting for new ReplicaSet $$new_rs to match current HPA desired replicas..."
      availability_deadline=$$(($$SECONDS + 900))
      next_log=$$SECONDS
      while [ "$$SECONDS" -lt "$$availability_deadline" ]; do
        desired="$$(kubectl get deployment "$$deployment" -n "$$namespace" -o jsonpath='{.spec.replicas}')"
        desired="$${desired:-1}"
        if [ "$$desired" = "0" ]; then
          echo "$$deployment has 0 desired replicas; skipping readiness wait."
          return 0
        fi
        available="$$(kubectl get rs "$$new_rs" -n "$$namespace" -o jsonpath='{.status.availableReplicas}')"
        available="$${available:-0}"
        if [ "$$available" -ge "$$desired" ]; then
          echo "$$deployment new ReplicaSet $$new_rs is available ($$available/$$desired)."
          return 0
        fi
        if [ "$$SECONDS" -ge "$$next_log" ]; then
          ready="$$(kubectl get rs "$$new_rs" -n "$$namespace" -o jsonpath='{.status.readyReplicas}')"
          ready="$${ready:-0}"
          current="$$(kubectl get rs "$$new_rs" -n "$$namespace" -o jsonpath='{.status.replicas}')"
          current="$${current:-0}"
          echo "$$deployment/$$new_rs progress: current=$$current ready=$$ready available=$$available desired=$$desired"
          kubectl get pods -n "$$namespace" -l "app=$$deployment" -o wide || true
          next_log=$$(($$SECONDS + 30))
        fi
        sleep 5
      done

      echo "Timed out waiting for new ReplicaSet $$new_rs to become available" >&2
      kubectl describe deployment "$$deployment" -n "$$namespace" || true
      kubectl get hpa -n "$$namespace" || true
      kubectl describe hpa -n "$$namespace" || true
      kubectl get rs -n "$$namespace" || true
      kubectl describe rs "$$new_rs" -n "$$namespace" || true
      pod_hash="$${new_rs#$$deployment-}"
      kubectl describe pods -n "$$namespace" -l "app=$$deployment,pod-template-hash=$$pod_hash" || true
      return 1
    }

    worker_refresh_check() {
      pod="droid-worker-refresh-check-${SHORT_SHA}"
      extra_args="$$*"
      kubectl delete pod "$$pod" -n production --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
      echo "Checking pipeline state..."
      set +e
      kubectl run "$$pod" \
        -n production \
        --rm \
        -i \
        --attach=true \
        --restart=Never \
        --pod-running-timeout=5m \
        --serviceaccount=droid-pipeline-worker \
        --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA}" \
        --env="DROID_GCP_PIPELINE_ENVIRONMENT=production" \
        --env="DROID_GCS_ARTIFACT_BUCKET=droid-pipeline-artifacts" \
        --env="DROID_PUBSUB_PROJECT_ID=${PROJECT_ID}" \
        --env="ORCHESTRA_URL=${_ORCHESTRA_URL}" \
        --command -- python -m unity_deploy.infra.cli.pipeline_control \
          worker-refresh-check --env production --dispatch-limit 20 --json $$extra_args
      rc="$$?"
      set -e
      kubectl delete pod "$$pod" -n production --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
      return "$$rc"
    }

    echo "Applying production pipeline worker manifests..."
    kubectl apply -f deploy/k8s/workers/pipeline-worker-serviceaccount.yaml
    kubectl apply -f deploy/k8s/workers/parse-worker-deployment.yaml
    kubectl apply -f deploy/k8s/workers/ingest-worker-deployment.yaml
    kubectl apply -f deploy/k8s/workers/dlq-reconciler-cronjob.yaml -l environment=production
    kubectl apply -f deploy/k8s/workers/stale-reconciler-cronjob.yaml -l environment=production
    kubectl set image cronjob/droid-pipeline-dlq-reconciler \
      dlq-reconciler="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA}" \
      -n production
    kubectl set image cronjob/droid-pipeline-stale-reconciler \
      stale-reconciler="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid:${SHORT_SHA}" \
      -n production
    kubectl apply -f deploy/k8s/workers/workers-weekly-rollout-cronjob.yaml
    kubectl apply -f deploy/k8s/workers/failed-pod-gc-cronjob.yaml

    if ! worker_refresh_check; then
      if [ "${_FORCE_WORKER_REFRESH}" != "true" ]; then
        echo "Skipping worker rollout restart because active/queued/stale pipeline work exists."
        echo "Set _FORCE_WORKER_REFRESH=true only for a controlled maintenance refresh."
        exit 0
      fi
      echo "_FORCE_WORKER_REFRESH=true; continuing despite active pipeline work."
    fi

    previous_parse_rs="$$(latest_replicaset droid-parse-worker production || true)"
    previous_ingest_rs="$$(latest_replicaset droid-ingest-worker production || true)"

    echo "Triggering rolling restart to pick up new image..."
    # The apply above guarantees the Deployments exist before restart.
    kubectl rollout restart deployment/droid-parse-worker -n production
    kubectl rollout restart deployment/droid-ingest-worker -n production

    wait_for_new_replicaset_available droid-parse-worker production "$$previous_parse_rs"
    wait_for_new_replicaset_available droid-ingest-worker production "$$previous_ingest_rs"
    if ! worker_refresh_check --allow-active --allow-queued; then
      echo "Post-refresh verification found stale or DLQ pipeline work." >&2
      echo "Inspect with pipeline_control status/reconcile-stale before considering the refresh healthy." >&2
      exit 1
    fi
    echo "Worker refresh complete; old pods may continue draining asynchronously."
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['upload-sha']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'droid'
  _CLUSTER: 'droid'
  _FORCE_WORKER_REFRESH: 'false'
  _BASE_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid-base:latest'
  _DROID_SHA: ''
  _ORCHESTRA_URL: 'https://api.unify.ai/v0'
  _DROID_COMMS_URL: 'https://service.a.run.app'
  # Brain commit / branch installed into the image.  Pin to a SHA in
  # production triggers; staging may track the ``main`` branch.
  _BRAIN_REF: 'main'

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_ADMIN_KEY/versions/latest
    env: 'ORCHESTRA_ADMIN_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
    env: 'GITHUB_TOKEN'

timeout: '3600s'
