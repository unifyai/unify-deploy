steps:
  # Deploy parse and ingest worker deployments (+ CronJob / PDB / HPA)
  # to GKE. This config is used for manual / emergency worker rollouts
  # only — the normal path is that cloudbuild-staging.yaml and
  # cloudbuild.yaml already include an inline `refresh-pipeline-workers`
  # step that runs kubectl apply + rollout restart on every push. Keep
  # this file around as an operator escape hatch (see
  # deploy/guides/PIPELINE_OPERATIONS.md § "Manual worker rollout").
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy-parse-worker'
  args:
  - 'apply'
  - '-f'
  - 'deploy/k8s/workers/parse-worker-deployment.yaml'
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'

- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy-ingest-worker'
  args:
  - 'apply'
  - '-f'
  - 'deploy/k8s/workers/ingest-worker-deployment.yaml'
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['deploy-parse-worker']

- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy-weekly-cronjob'
  args:
  - 'apply'
  - '-f'
  - 'deploy/k8s/workers/workers-weekly-rollout-cronjob.yaml'
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['deploy-ingest-worker']

- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy-failed-pod-gc'
  args:
  - 'apply'
  - '-f'
  - 'deploy/k8s/workers/failed-pod-gc-cronjob.yaml'
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['deploy-ingest-worker']

  # Rolling restart to pick up new image
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'restart-workers'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eu
    # kubectl cloud-builder's credential wrapper only runs under its
    # default entrypoint; we override with `bash`, so fetch
    # credentials explicitly (otherwise kubectl talks to
    # localhost:8080 and the rollout restart fails).
    gcloud container clusters get-credentials "${_CLUSTER}" --region "${_REGION}"
    kubectl rollout restart deployment/unity-parse-worker -n production || true
    kubectl rollout restart deployment/unity-ingest-worker -n production || true

    echo "Waiting for new pods to be ready..."
    kubectl rollout status deployment/unity-parse-worker -n production --timeout=120s || true
    kubectl rollout status deployment/unity-ingest-worker -n production --timeout=120s || true
    echo "Worker refresh complete."
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
  waitFor: ['deploy-weekly-cronjob', 'deploy-failed-pod-gc']

options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _REGION: 'us-central1'
  _CLUSTER: 'unity'

timeout: '300s'
