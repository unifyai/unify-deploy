name: Daily briefing
slug: daily_briefing
version: "1.0.0"
category: comms
icon_id: briefing
description: >
  Your calendar, the unread that actually matters, and anything starting
  to slip — before stand-up.

# Connections the briefing needs before its job is armed. Installing
# without them still plants everything; the recurring task stays held
# (enabled=false) until the connection lands, and a reinstall arms it.
#
# `slug` is a provider app slug — the lowercase id space the Console
# integrations gallery, `app_slug` in the integrations primitives, and
# native package manifests all share, so Console can resolve a logo and
# an inline connect action. Not the OAuth alias space in runtime_oauth
# (where this same connection is "google"), which the gallery cannot see.
#
# Naming the app is usually all a bundle does: the resolver asks the
# gallery for a live connection, then the app's own native package for
# the secrets that make it usable. `required_secrets` is only for apps
# neither can answer for — a BYOD OAuth provider like Workspace, which
# has no package and no gallery row, so its refresh token is the signal.
# For a native package (hubspot, github, …) or a gallery app (notion,
# slack, …), omit it: restating their secrets here means two places to
# update when the package changes.
requirements:
- slug: gmail
  name: Gmail
  required_secrets: [GOOGLE_REFRESH_TOKEN]

capabilities: []

# Per-install settings, recorded on the installation and read at run time
# via WorkflowManager_get_installation_params — never baked into the
# planted rows.
params_schema:
  focus:
    label: Focus
    type: textarea
    required: false
    help: >
      Anything the briefing should always watch for — projects, people,
      deadlines. Left empty, the briefing infers focus from the calendar
      and inbox alone.
