name: Daily briefing
slug: daily_briefing
# Below 1.0.0 until the staging walk proves the briefing composes and
# delivers at 08:30 against a connected mailbox. That proof is the
# promotion to 1.0.0 — nothing else is.
version: "0.0.1"
category: comms
icon_id: briefing

# `description` is the card: one line, no more. `about` is the page a
# reader weighs before installing — what the workflow does, when it
# runs, what arrives, and how its settings shape it. Markdown.
description: >
  Your calendar, the unread that actually matters, and anything starting
  to slip — before stand-up.

about: |
  Every weekday at 08:30 your assistant assembles one chat message with
  the three things worth knowing before stand-up: the rest of today's
  calendar with context, the unread email that actually needs you, and
  any commitment starting to slip.

  **Today** lists each remaining meeting — time, who it is with, and the
  one thing worth knowing walking in, such as a doc shared for it or an
  unanswered thread with an attendee. Conflicts and back-to-backs are
  flagged.

  **Needs you** is triaged, not dumped. An unread email earns its single
  line only when it asks you a direct question, comes from someone you
  meet today, blocks someone else's work, touches your stated focus, or
  carries a deadline inside two working days. Newsletters, receipts and
  CC-only threads never qualify; past seven items, the briefing keeps
  the most consequential and says how many it left out.

  **Slipping** watches commitments drifting past their point of no
  return: a thread waiting on your reply for two working days or more, a
  deadline inside 48 hours with no visible progress, a promise made in
  email or a meeting that has not moved since. Weekends and out-of-office
  windows are never counted as waiting time.

  Installing plants the composition and triage procedures, the
  definition of "slipping", the scan-window helper, and the recurring
  job itself. Nothing fires until Gmail is connected — the job stays
  held, and connecting arms it. The optional **focus** setting names
  projects, people or deadlines the briefing must always check, even on
  days the calendar and inbox are quiet about them.

# Connections the briefing needs before its job is armed. Installing
# without them still plants everything; the recurring task stays held
# (enabled=false) until the connection lands, and a reinstall arms it.
#
# `slug` is a provider app slug — the lowercase id space the Console
# integrations gallery, `app_slug` in the integrations primitives, and
# native package manifests all share, so Console can resolve a logo and
# an inline connect action. Not the OAuth alias space in runtime_oauth
# (where this same connection is "google"), which the gallery cannot see.
#
# Naming the app is all a bundle should do. The resolver asks the gallery
# for a live connection, then the app's own native package, then whether
# the gallery offers the app at all — and Gmail is a gallery app with
# OAuth, so the fix for "not connected" is the gallery's connect flow.
# `required_secrets` is only for an app no authority can answer for: a
# BYOD OAuth provider with no package and no gallery row. Declaring it
# for a gallery app is worse than redundant — it makes the UI offer a
# pasted secret instead of the connect button that actually works.
requirements:
- slug: gmail
  name: Gmail

capabilities: []

# Per-install settings, recorded on the installation and resolved onto
# every run's request by the scheduler — never baked into the planted
# rows, and never fetched by the run itself.
params_schema:
  focus:
    label: Always watch for
    type: textarea
    required: false
    help: >
      Projects, people or deadlines the briefing checks every morning
      even when the calendar and inbox are quiet about them — for
      example "the Q3 board deck, anything from Acme procurement, the
      visa renewal". Left empty, the briefing infers focus from the
      calendar and inbox alone.
