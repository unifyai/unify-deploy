steps:
  # Clone the staging Unity source and overlay the mirrored hosted deploy assets.
- name: 'gcr.io/cloud-builders/git'
  id: 'clone-unity'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    git clone --depth 1 --branch ${_UNITY_REF} https://$$GITHUB_TOKEN@github.com/unifyai/unity.git /workspace/unity-src
    if [ -n "${_UNITY_SHA}" ]; then
      git -C /workspace/unity-src fetch --depth 1 origin ${_UNITY_SHA}
      git -C /workspace/unity-src checkout --detach FETCH_HEAD
    fi
    git -C /workspace/unity-src rev-parse --short=12 HEAD > /workspace/unity_sha.txt
    rm -rf /workspace/unity-src/deploy
    mkdir -p /workspace/unity-src/deploy
    cp -R /workspace/base/. /workspace/unity-src/deploy/
    echo "Using Unity SHA: $$(cat /workspace/unity_sha.txt)"
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['-']

  # Pull previous image for Docker layer cache (may not exist on first run)
- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base-staging:latest || true

  # Resolve latest commit SHAs from dependency repos so the Docker layer cache
  # is busted whenever unify or unillm change.
- name: 'gcr.io/cloud-builders/git'
  id: 'resolve-dep-shas'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    UNIFY_SHA=$$(git ls-remote https://$$GITHUB_TOKEN@github.com/unifyai/unify.git refs/heads/staging | cut -f1)
    UNILLM_SHA=$$(git ls-remote https://$$GITHUB_TOKEN@github.com/unifyai/unillm.git refs/heads/staging | cut -f1)
    echo "$${UNIFY_SHA}-$${UNILLM_SHA}" > /workspace/dep_repos_sha.txt
    echo "Dependency SHAs: unify=$${UNIFY_SHA:0:8} unillm=$${UNILLM_SHA:0:8}"
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['-']

  # Build Docker image with BuildKit inline cache.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    DEP_SHA=$$(cat /workspace/dep_repos_sha.txt)
    DOCKER_BUILDKIT=1 docker build \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base-staging:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg UNIFY_KEY=$$ORCHESTRA_API_KEY \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      --build-arg BRANCH=${_UNITY_REF} \
      --build-arg DEP_REPOS_SHA=$$DEP_SHA \
      -f /workspace/unity-src/deploy/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base-staging:$${UNITY_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base-staging:latest \
      /workspace/unity-src
  secretEnv: ['ORCHESTRA_API_KEY', 'GITHUB_TOKEN']
  waitFor: ['clone-unity', 'pull-cache', 'resolve-dep-shas']

  # Push Docker Image (SHA and latest tags in parallel)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base-staging:$${UNITY_SHA}
  waitFor: ['build-image']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base-staging:latest']
  waitFor: ['build-image']

  # Build job-watcher image from the cloned Unity source plus mirrored private assets.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-job-watcher'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    DOCKER_BUILDKIT=1 docker build \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      --build-arg BRANCH=${_UNITY_REF} \
      -f /workspace/unity-src/deploy/scripts/job-watcher/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher-staging:$${UNITY_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher-staging:latest \
      /workspace/unity-src
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['clone-unity']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-job-watcher'
  args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher-staging']
  waitFor: ['build-job-watcher']

  # Deploy job-watcher to staging (creates Deployment on first run, updates image on subsequent runs)
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy-job-watcher'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    gcloud container clusters get-credentials unity --region ${_REGION} --project ${PROJECT_ID}
    sed "s|image:.*job-watcher.*|image: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher-staging:$${UNITY_SHA}|" \
      /workspace/unity-src/deploy/scripts/job-watcher/deployment_staging.yaml | kubectl apply -f -
  waitFor: ['push-job-watcher']

  # Trigger the staging overlay build on top of the just-pushed base image.
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'trigger-deploy-build'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    gcloud builds triggers run unity-deploy-staging \
      --project=${PROJECT_ID} \
      --branch=staging \
      --substitutions=_BASE_IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base-staging:$${UNITY_SHA},_UNITY_SHA=$${UNITY_SHA}
  waitFor: ['push-sha-tag', 'push-latest-tag']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity'
  _UNITY_REF: 'staging'
  _UNITY_SHA: ''

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_API_KEY/versions/latest
    env: 'ORCHESTRA_API_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
    env: 'GITHUB_TOKEN'

timeout: '1800s'
