steps:
  # Clone Droid and overlay the mirrored hosted deploy assets from this repo.
- name: 'gcr.io/cloud-builders/git'
  id: 'clone-droid'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    DROID_REF="${_DROID_REF:-${_UNITY_REF:-main}}"
    DROID_SHA_OVERRIDE="${_DROID_SHA:-${_UNITY_SHA:-}}"
    git clone --depth 1 --branch "$${DROID_REF}" https://$$GITHUB_TOKEN@github.com/unifyai/droid.git /workspace/droid-src
    if [ -n "$${DROID_SHA_OVERRIDE}" ]; then
      git -C /workspace/droid-src fetch --depth 1 origin "$${DROID_SHA_OVERRIDE}"
      git -C /workspace/droid-src checkout --detach FETCH_HEAD
    fi
    git -C /workspace/droid-src rev-parse --short=12 HEAD > /workspace/droid_sha.txt
    mkdir -p /workspace/droid-public-deploy
    cp -R /workspace/droid-src/deploy/integrations /workspace/droid-public-deploy/integrations
    rm -rf /workspace/droid-src/deploy
    mkdir -p /workspace/droid-src/deploy
    cp -R /workspace/base/. /workspace/droid-src/deploy/
    cp -R /workspace/droid-public-deploy/integrations /workspace/droid-src/deploy/integrations
    echo "Using Droid SHA: $$(cat /workspace/droid_sha.txt)"
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['-']

  # Pull previous image for Docker layer cache (may not exist on first run)
- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid-base:latest || true

  # Resolve latest commit SHAs from dependency repos so the Docker layer cache
  # is busted whenever unify or unillm change (git clone text is static, so
  # without this the layer would be served from cache with stale code).
- name: 'gcr.io/cloud-builders/git'
  id: 'resolve-dep-shas'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    UNIFY_SHA=$$(git ls-remote https://$$GITHUB_TOKEN@github.com/unifyai/unify.git refs/heads/main | cut -f1)
    UNILLM_SHA=$$(git ls-remote https://$$GITHUB_TOKEN@github.com/unifyai/unillm.git refs/heads/main | cut -f1)
    echo "$${UNIFY_SHA}-$${UNILLM_SHA}" > /workspace/dep_repos_sha.txt
    echo "Dependency SHAs: unify=$${UNIFY_SHA:0:8} unillm=$${UNILLM_SHA:0:8}"
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['-']

  # Build Docker image with BuildKit inline cache.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    DROID_SHA=$$(cat /workspace/droid_sha.txt)
    DEP_SHA=$$(cat /workspace/dep_repos_sha.txt)
    DOCKER_BUILDKIT=1 docker build \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid-base:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg UNIFY_KEY=$$ORCHESTRA_API_KEY \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      --build-arg DEP_REPOS_SHA=$$DEP_SHA \
      -f /workspace/droid-src/deploy/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid-base:$${DROID_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid-base:latest \
      /workspace/droid-src
  secretEnv: ['ORCHESTRA_API_KEY', 'GITHUB_TOKEN']
  waitFor: ['clone-droid', 'pull-cache', 'resolve-dep-shas']

  # Push Docker Image (SHA and latest tags in parallel)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    DROID_SHA=$$(cat /workspace/droid_sha.txt)
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid-base:$${DROID_SHA}
  waitFor: ['build-image']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid-base:latest']
  waitFor: ['build-image']

  # Build job-watcher image from the cloned Droid source plus mirrored private assets.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-job-watcher'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    DROID_SHA=$$(cat /workspace/droid_sha.txt)
    DOCKER_BUILDKIT=1 docker build \
      --build-arg GITHUB_TOKEN=$$GITHUB_TOKEN \
      --build-arg BRANCH=${_DROID_REF} \
      -f /workspace/droid-src/deploy/scripts/job-watcher/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher:$${DROID_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher:latest \
      /workspace/droid-src
  secretEnv: ['GITHUB_TOKEN']
  waitFor: ['clone-droid']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-job-watcher'
  args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher']
  waitFor: ['build-job-watcher']

  # Deploy job-watcher to production (creates Deployment on first run, updates image on subsequent runs)
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy-job-watcher'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    DROID_SHA=$$(cat /workspace/droid_sha.txt)
    gcloud container clusters get-credentials ${_CLUSTER} --region ${_REGION} --project ${PROJECT_ID}
    sed "s|image:.*job-watcher.*|image: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher:$${DROID_SHA}|" \
      /workspace/droid-src/deploy/scripts/job-watcher/deployment.yaml | kubectl apply -f -
  waitFor: ['push-job-watcher']

  # Trigger enterprise overlay build in droid-deploy.
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'trigger-deploy-build'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    DROID_SHA=$$(cat /workspace/droid_sha.txt)
    gcloud builds triggers run droid-deploy \
      --project=${PROJECT_ID} \
      --region=${_REGION} \
      --branch=main \
      --substitutions=_BASE_IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/droid-base:$${DROID_SHA},_DROID_SHA=$${DROID_SHA}
  waitFor: ['push-sha-tag', 'push-latest-tag']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'droid'
  _CLUSTER: 'unity'
  _DROID_REF: 'main'
  _DROID_SHA: ''

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_API_KEY/versions/latest
    env: 'ORCHESTRA_API_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
    env: 'GITHUB_TOKEN'

timeout: '1800s'
