steps:
  # Drop duplicate-webhook / superseded runs of this trigger before doing any
  # work (Cloud Build has no native concurrency control).
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'guard'
  entrypoint: 'bash'
  args: ['deploy/scripts/cloudbuild/concurrency_guard.sh', '${_REGION}']
  env:
  - 'BUILD_ID=${BUILD_ID}'
  - 'PROJECT_ID=${PROJECT_ID}'
  waitFor: ['-']

  # Clone Unity and overlay the mirrored hosted deploy assets from this repo.
- name: 'gcr.io/cloud-builders/git'
  id: 'clone-unity'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    UNITY_REF="${_UNITY_REF:-${_UNITY_REF:-main}}"
    UNITY_SHA_OVERRIDE="${_UNITY_SHA:-${_UNITY_SHA:-}}"
    git clone --depth 1 --branch "$${UNITY_REF}" https://github.com/unifyai/unify.git /workspace/unity-src
    if [ -n "$${UNITY_SHA_OVERRIDE}" ]; then
      git -C /workspace/unity-src fetch --depth 1 origin "$${UNITY_SHA_OVERRIDE}"
      git -C /workspace/unity-src checkout --detach FETCH_HEAD
    fi
    git -C /workspace/unity-src rev-parse --short=12 HEAD > /workspace/unity_sha.txt
    mkdir -p /workspace/unity-public-deploy
    cp -R /workspace/unity-src/deploy/integrations /workspace/unity-public-deploy/integrations
    rm -rf /workspace/unity-src/deploy
    mkdir -p /workspace/unity-src/deploy
    cp -R /workspace/base/. /workspace/unity-src/deploy/
    cp -R /workspace/unity-public-deploy/integrations /workspace/unity-src/deploy/integrations
    echo "Using Unity SHA: $$(cat /workspace/unity_sha.txt)"
  waitFor: ['guard']

  # Pull previous image for Docker layer cache (may not exist on first run)
- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base:latest || true

  # Resolve latest commit SHAs from dependency repos so the Docker layer cache
  # is busted whenever unify or unillm change (git clone text is static, so
  # without this the layer would be served from cache with stale code).
- name: 'gcr.io/cloud-builders/git'
  id: 'resolve-dep-shas'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    umask 077
    trap 'rm -f /workspace/.k_*' EXIT
    printf '%s' "$$BRANDING_DEPLOY_KEY" > /workspace/.k_branding
    printf '%s' "$$ORCHESTRA_DEPLOY_KEY" > /workspace/.k_orchestra
    printf '%s' "$$CONSOLE_DEPLOY_KEY" > /workspace/.k_console
    # A deploy key authorises exactly one repository, and github binds the ssh
    # session to the first key that authenticates -- so each lookup below runs
    # with only its own identity rather than offering them all at once.
    ssh_with() { GIT_SSH_COMMAND="ssh -i $$1 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git ls-remote "$$2" "$$3" | cut -f1; }
    UNIFY_SHA=$$(git ls-remote https://github.com/unifyai/unisdk.git refs/heads/main | cut -f1)
    UNILLM_SHA=$$(git ls-remote https://github.com/unifyai/unillm.git refs/heads/main | cut -f1)
    MAGNITUDE_SHA=$$(git ls-remote https://github.com/unifyai/magnitude.git refs/heads/main | cut -f1)
    BRANDING_SHA=$$(ssh_with /workspace/.k_branding git@github.com:unifyai/branding.git refs/heads/main)
    echo "$${UNIFY_SHA}-$${UNILLM_SHA}" > /workspace/dep_repos_sha.txt
    echo "$${MAGNITUDE_SHA}" > /workspace/magnitude_sha.txt
    echo "$${BRANDING_SHA}" > /workspace/canvas_branding_sha.txt
    echo "Dependency SHAs: unify=$${UNIFY_SHA:0:8} unillm=$${UNILLM_SHA:0:8} magnitude=$${MAGNITUDE_SHA:0:8} branding=$${BRANDING_SHA:0:8}"
    SYSTEM_SHAS=""
    for repo in orchestra console docs; do
      case "$${repo}" in
        docs) SHA=$$(git ls-remote https://github.com/unifyai/docs.git refs/heads/main | cut -f1) ;;
        orchestra) SHA=$$(ssh_with /workspace/.k_orchestra git@github.com:unifyai/orchestra.git refs/heads/main) ;;
        console) SHA=$$(ssh_with /workspace/.k_console git@github.com:unifyai/console.git refs/heads/main) ;;
      esac
      SYSTEM_SHAS="$${SYSTEM_SHAS}$${SHA:0:12}-"
    done
    echo "$${SYSTEM_SHAS}" > /workspace/system_repos_sha.txt
    echo "System-source SHAs: $${SYSTEM_SHAS}"
  secretEnv: ['BRANDING_DEPLOY_KEY', 'ORCHESTRA_DEPLOY_KEY', 'CONSOLE_DEPLOY_KEY']
  waitFor: ['-']

  # Build Docker image with BuildKit inline cache.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    DEP_SHA=$$(cat /workspace/dep_repos_sha.txt)
    MAGNITUDE_SHA=$$(cat /workspace/magnitude_sha.txt)
    SYSTEM_SHA=$$(cat /workspace/system_repos_sha.txt)
    BRANDING_SHA=$$(cat /workspace/canvas_branding_sha.txt)
    umask 077
    trap 'rm -f /workspace/.branding_deploy_key /workspace/.iso_deploy_key /workspace/.k_orchestra_build /workspace/.k_console_build' EXIT
    printf '%s' "$$BRANDING_DEPLOY_KEY" > /workspace/.branding_deploy_key
    printf '%s' "$$ISO_DEPLOY_KEY" > /workspace/.iso_deploy_key
    printf '%s' "$$ORCHESTRA_DEPLOY_KEY" > /workspace/.k_orchestra_build
    printf '%s' "$$CONSOLE_DEPLOY_KEY" > /workspace/.k_console_build
    DOCKER_BUILDKIT=1 docker build \
      --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg UNIFY_KEY=$$ORCHESTRA_API_KEY \
      --secret id=branding_deploy_key,src=/workspace/.branding_deploy_key \
      --secret id=iso_deploy_key,src=/workspace/.iso_deploy_key \
      --secret id=orchestra_deploy_key,src=/workspace/.k_orchestra_build \
      --secret id=console_deploy_key,src=/workspace/.k_console_build \
      --build-arg DEP_REPOS_SHA=$$DEP_SHA \
      --build-arg MAGNITUDE_SHA=$$MAGNITUDE_SHA \
      --build-arg SYSTEM_REPOS_SHA=$$SYSTEM_SHA \
      --build-arg CANVAS_BRANDING_SHA=$$BRANDING_SHA \
      -f /workspace/unity-src/deploy/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base:$${UNITY_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base:latest \
      /workspace/unity-src
  secretEnv: ['ORCHESTRA_API_KEY', 'BRANDING_DEPLOY_KEY', 'ISO_DEPLOY_KEY', 'ORCHESTRA_DEPLOY_KEY', 'CONSOLE_DEPLOY_KEY']
  waitFor: ['clone-unity', 'pull-cache', 'resolve-dep-shas']

  # Push Docker Image (SHA and latest tags in parallel)
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-sha-tag'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base:$${UNITY_SHA}
  waitFor: ['build-image']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-latest-tag'
  args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base:latest']
  waitFor: ['build-image']

  # Publish the brain SHA baked into unity-base:latest so a direct unity-deploy
  # push (which does not run this base build) can resolve the canonical overlay
  # identity instead of tagging with the unity-deploy commit.
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'publish-unity-base-sha'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    cat /workspace/unity_sha.txt | gsutil cp - gs://bucket/unity_base_sha.txt
  waitFor: ['push-latest-tag']

  # Build job-watcher image from the cloned Unity source plus mirrored private assets.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-job-watcher'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    DOCKER_BUILDKIT=1 docker build \
      --build-arg BRANCH=${_UNITY_REF} \
      -f /workspace/unity-src/deploy/scripts/job-watcher/Dockerfile \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher:$${UNITY_SHA} \
      -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher:latest \
      /workspace/unity-src
  waitFor: ['clone-unity']

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-job-watcher'
  args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher']
  waitFor: ['build-job-watcher']

  # Deploy job-watcher to production (creates Deployment on first run, updates image on subsequent runs)
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy-job-watcher'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    gcloud container clusters get-credentials ${_CLUSTER} --region ${_REGION} --project ${PROJECT_ID}
    sed "s|image:.*job-watcher.*|image: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/job-watcher:$${UNITY_SHA}|" \
      /workspace/unity-src/deploy/scripts/job-watcher/deployment.yaml | kubectl apply -f -
  waitFor: ['push-job-watcher']

  # Trigger enterprise overlay build in unity-deploy.
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'trigger-deploy-build'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -euo pipefail
    UNITY_SHA=$$(cat /workspace/unity_sha.txt)
    gcloud builds triggers run unity-deploy \
      --project=${PROJECT_ID} \
      --region=${_REGION} \
      --branch=main \
      --substitutions=_BASE_IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/unity-base:$${UNITY_SHA},_UNITY_SHA=$${UNITY_SHA}
  waitFor: ['push-sha-tag', 'push-latest-tag']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  # The base image does the heaviest work in the cascade (system deps, torch,
  # magnitude build, full uv install); match the overlay's machine class.
  machineType: 'E2_HIGHCPU_32'

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'unity'
  _CLUSTER: 'unity'
  _UNITY_REF: 'main'
  _UNITY_SHA: ''

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_API_KEY/versions/latest
    env: 'ORCHESTRA_API_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/BRANDING_DEPLOY_KEY/versions/latest
    env: 'BRANDING_DEPLOY_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/ISO_ANIMATION_DEPLOY_KEY/versions/latest
    env: 'ISO_DEPLOY_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_DEPLOY_KEY/versions/latest
    env: 'ORCHESTRA_DEPLOY_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/CONSOLE_DEPLOY_KEY/versions/latest
    env: 'CONSOLE_DEPLOY_KEY'

timeout: '1800s'
