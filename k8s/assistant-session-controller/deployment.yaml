---
# ── Bootstrap Secret isolation (k8s-secret-bypass fix) ────────────────────────
# Per-session bootstrap Secrets move here, out of `production`, so actor pods can
# read their own bootstrap WITHOUT read access to production Secrets (unity-secrets
# / comm-sa key / ORCHESTRA_ADMIN_KEY). See epic artifact `k8s-secret-bypass-fix`.
# Writer = comms-app as comm-sa (GCP cluster-admin, needs no Role here); controller
# reads + GC-deletes via its KSA; actor pods GET their own Secret by exact name only.
apiVersion: v1
kind: Namespace
metadata:
  name: production-sessions
  labels:
    app: unity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-reader
  namespace: production-sessions
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-bootstrap-reader
  namespace: production-sessions
subjects:
- kind: ServiceAccount
  name: assistant-runtime-sa
  namespace: production          # cross-namespace subject: pod SA lives in production
roleRef:
  kind: Role
  name: bootstrap-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-manager
  namespace: production-sessions
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-bootstrap-manager
  namespace: production-sessions
subjects:
- kind: ServiceAccount
  name: assistant-session-controller
  namespace: production
roleRef:
  kind: Role
  name: bootstrap-manager
  apiGroup: rbac.authorization.k8s.io
# PHASE 2 (k8s-secret-bypass CLOSURE — applied 2026-08-14): the actor pod SA is
# bound to `assistant-session-runtime-pod` below, identical to
# `assistant-session-runtime` MINUS the `secrets` rule. The pod reads its OWN
# bootstrap from `production-sessions` (bootstrap-reader Role above) and can read
# NO `production` Secret — closing unity-secrets → comm-sa key / ORCHESTRA_ADMIN_KEY.
# comm-sa keeps the secrets-bearing `assistant-session-runtime`.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assistant-session-controller
  namespace: production
rules:
- apiGroups: ["infra.unify.ai"]
  resources: ["assistantsessions"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["infra.unify.ai"]
  resources: ["assistantsessions/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "patch", "update"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assistant-session-runtime
  namespace: production
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["infra.unify.ai"]
  resources: ["assistantsessions"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update"]
---
# Phase 2 pod Role: `assistant-session-runtime` MINUS the `secrets` rule. Bound to
# the actor pod SA `assistant-runtime-sa`; the pod reads its own bootstrap from
# `production-sessions` only and can read NO `production` Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assistant-session-runtime-pod
  namespace: production
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["infra.unify.ai"]
  resources: ["assistantsessions"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assistant-session-controller
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: assistant-session-controller-discovery
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: assistant-session-controller-discovery-production
subjects:
- kind: ServiceAccount
  name: assistant-session-controller
  namespace: production
roleRef:
  kind: ClusterRole
  name: assistant-session-controller-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assistant-session-controller
  namespace: production
subjects:
- kind: ServiceAccount
  name: assistant-session-controller
  namespace: production
roleRef:
  kind: Role
  name: assistant-session-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assistant-session-runtime
  namespace: production
subjects:
- kind: ServiceAccount
  name: comm-sa
  namespace: production
roleRef:
  kind: Role
  name: assistant-session-runtime
  apiGroup: rbac.authorization.k8s.io
---
# Minimally-scoped identity for assistant Job pods (Workload Identity). Replaces
# the fleet-wide comm-sa on Jobs so a compromised pod cannot use comm-sa's broad
# GCS/compute access. comm-sa stays for controllers/job-watcher/Cloud Run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assistant-runtime-sa
  namespace: production
  annotations:
    iam.gke.io/gcp-service-account: service-account@example.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assistant-session-runtime-assistant-sa
  namespace: production
subjects:
- kind: ServiceAccount
  name: assistant-runtime-sa
  namespace: production
roleRef:
  kind: Role
  name: assistant-session-runtime-pod
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-session-controller
  namespace: production
  labels:
    app: assistant-session-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-session-controller
  template:
    metadata:
      labels:
        app: assistant-session-controller
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: assistant-session-controller
      containers:
      - name: assistant-session-controller
        image: us-central1-docker.pkg.dev/gcp-project-runtime/unity-comms-app-repo/assistant-session-controller:latest
        command:
        - kopf
        - run
        - -m
        - communication.assistant_session_controller.controller
        - --liveness=http://0.0.0.0:8080/healthz
        - --namespace=production
        - --standalone
        ports:
        - containerPort: 8080
          name: health
        env:
        - name: WATCH_NAMESPACE
          value: production
        - name: DEPLOY_ENV
          value: production
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /secrets/key.json
        - name: GCP_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: unity-config
              key: GCP_PROJECT_ID
        - name: UNITY_COMMS_URL
          value: "https://service.a.run.app"
        - name: UNITY_ADAPTERS_URL
          value: "https://service.a.run.app"
        - name: ORCHESTRA_URL
          value: "https://api.unify.ai/v0"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: sa-key
          mountPath: /secrets
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: sa-key
        secret:
          secretName: comm-sa-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-session-pool-controller
  namespace: production
  labels:
    app: assistant-session-pool-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-session-pool-controller
  template:
    metadata:
      labels:
        app: assistant-session-pool-controller
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: assistant-session-controller
      containers:
      - name: assistant-session-pool-controller
        image: us-central1-docker.pkg.dev/gcp-project-runtime/unity-comms-app-repo/assistant-session-controller:latest
        command:
        - python
        - -m
        - communication.assistant_session_controller.pool_controller
        env:
        - name: WATCH_NAMESPACE
          value: production
        - name: DEPLOY_ENV
          value: production
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /secrets/key.json
        - name: GCP_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: unity-config
              key: GCP_PROJECT_ID
        - name: UNITY_COMMS_URL
          value: "https://service.a.run.app"
        - name: UNITY_ADAPTERS_URL
          value: "https://service.a.run.app"
        - name: ORCHESTRA_URL
          value: "https://api.unify.ai/v0"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
        - name: POOL_CONTROLLER_INTERVAL_SECONDS
          value: "10"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: sa-key
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: sa-key
        secret:
          secretName: comm-sa-key
