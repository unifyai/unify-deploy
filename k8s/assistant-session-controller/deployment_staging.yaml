---
# ── Bootstrap Secret isolation (k8s-secret-bypass fix) — staging twin ──────────
# See the production manifest for the rationale. Bootstrap Secrets move to
# `staging-sessions`; actor pods GET their own Secret there without `staging` access.
apiVersion: v1
kind: Namespace
metadata:
  name: staging-sessions
  labels:
    app: unity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-reader
  namespace: staging-sessions
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-bootstrap-reader
  namespace: staging-sessions
subjects:
- kind: ServiceAccount
  name: assistant-runtime-sa
  namespace: staging
roleRef:
  kind: Role
  name: bootstrap-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-manager
  namespace: staging-sessions
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-bootstrap-manager
  namespace: staging-sessions
subjects:
- kind: ServiceAccount
  name: assistant-session-controller
  namespace: staging
roleRef:
  kind: Role
  name: bootstrap-manager
  apiGroup: rbac.authorization.k8s.io
# PHASE 2 (after drain): drop the pod SA's `staging` secret read (rebind
# assistant-runtime-sa to a minimal Role without the `secrets` rule).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assistant-session-controller
  namespace: staging
rules:
- apiGroups: ["infra.unify.ai"]
  resources: ["assistantsessions"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["infra.unify.ai"]
  resources: ["assistantsessions/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "patch", "update"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assistant-session-runtime
  namespace: staging
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["infra.unify.ai"]
  resources: ["assistantsessions"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update"]
---
# Phase 2 pod Role: `assistant-session-runtime` MINUS the `secrets` rule. Bound to
# the actor pod SA `assistant-runtime-sa`; the pod reads its own bootstrap from
# `staging-sessions` only and can read NO `staging` Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assistant-session-runtime-pod
  namespace: staging
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["infra.unify.ai"]
  resources: ["assistantsessions"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assistant-session-controller
  namespace: staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: assistant-session-controller-discovery
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: assistant-session-controller-discovery-staging
subjects:
- kind: ServiceAccount
  name: assistant-session-controller
  namespace: staging
roleRef:
  kind: ClusterRole
  name: assistant-session-controller-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assistant-session-controller
  namespace: staging
subjects:
- kind: ServiceAccount
  name: assistant-session-controller
  namespace: staging
roleRef:
  kind: Role
  name: assistant-session-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assistant-session-runtime
  namespace: staging
subjects:
- kind: ServiceAccount
  name: comm-sa
  namespace: staging
roleRef:
  kind: Role
  name: assistant-session-runtime
  apiGroup: rbac.authorization.k8s.io
---
# Minimally-scoped identity for assistant Job pods (Workload Identity). Replaces
# the fleet-wide comm-sa on Jobs so a compromised pod cannot use comm-sa's broad
# GCS/compute access. comm-sa stays for controllers/job-watcher/Cloud Run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assistant-runtime-sa
  namespace: staging
  annotations:
    iam.gke.io/gcp-service-account: service-account@example.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assistant-session-runtime-assistant-sa
  namespace: staging
subjects:
- kind: ServiceAccount
  name: assistant-runtime-sa
  namespace: staging
# roleRef is immutable. The API server rejects any change to it with `cannot
# change roleRef`, which fails this apply and, under `set -eu`, the whole
# deploy-session-controller step that deploy-comms waits on. Narrowing what this
# ServiceAccount may read means adding a binding under its own name and deleting
# this one -- never editing the value below.
roleRef:
  kind: Role
  name: assistant-session-runtime
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-session-controller-staging
  namespace: staging
  labels:
    app: assistant-session-controller-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-session-controller-staging
  template:
    metadata:
      labels:
        app: assistant-session-controller-staging
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: assistant-session-controller
      containers:
      - name: assistant-session-controller-staging
        image: us-central1-docker.pkg.dev/gcp-project-runtime/unity-comms-app-repo/assistant-session-controller-staging:latest
        command:
        - kopf
        - run
        - -m
        - communication.assistant_session_controller.controller
        - --liveness=http://0.0.0.0:8080/healthz
        - --namespace=staging
        - --standalone
        ports:
        - containerPort: 8080
          name: health
        env:
        - name: WATCH_NAMESPACE
          value: staging
        - name: DEPLOY_ENV
          value: staging
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /secrets/key.json
        - name: GCP_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: unity-config
              key: GCP_PROJECT_ID
        - name: UNITY_COMMS_URL
          value: "https://service.a.run.app"
        - name: UNITY_ADAPTERS_URL
          value: "https://service.a.run.app"
        - name: ORCHESTRA_URL
          value: "https://internal.example.com/v0"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: sa-key
          mountPath: /secrets
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: sa-key
        secret:
          secretName: comm-sa-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-session-pool-controller-staging
  namespace: staging
  labels:
    app: assistant-session-pool-controller-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-session-pool-controller-staging
  template:
    metadata:
      labels:
        app: assistant-session-pool-controller-staging
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: assistant-session-controller
      containers:
      - name: assistant-session-pool-controller-staging
        image: us-central1-docker.pkg.dev/gcp-project-runtime/unity-comms-app-repo/assistant-session-controller-staging:latest
        command:
        - python
        - -m
        - communication.assistant_session_controller.pool_controller
        env:
        - name: WATCH_NAMESPACE
          value: staging
        - name: DEPLOY_ENV
          value: staging
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /secrets/key.json
        - name: GCP_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: unity-config
              key: GCP_PROJECT_ID
        - name: UNITY_COMMS_URL
          value: "https://service.a.run.app"
        - name: UNITY_ADAPTERS_URL
          value: "https://service.a.run.app"
        - name: ORCHESTRA_URL
          value: "https://internal.example.com/v0"
        - name: ORCHESTRA_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: unity-secrets
              key: ORCHESTRA_ADMIN_KEY
        - name: POOL_CONTROLLER_INTERVAL_SECONDS
          value: "10"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: sa-key
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: sa-key
        secret:
          secretName: comm-sa-key
