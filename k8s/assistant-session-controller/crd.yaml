apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: assistantsessions.infra.unify.ai
spec:
  group: infra.unify.ai
  scope: Namespaced
  names:
    plural: assistantsessions
    singular: assistantsession
    kind: AssistantSession
    shortNames:
    - asession
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Assistant
      type: string
      jsonPath: .spec.assistantId
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Desired
      type: string
      jsonPath: .spec.desiredState
    - name: Binding
      type: string
      jsonPath: .status.binding.id
    - name: Job
      type: string
      jsonPath: .status.binding.jobRef.name
    - name: VM
      type: string
      jsonPath: .status.binding.vmRef.name
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - assistantId
            - userId
            - medium
            - desiredState
            - desktop
            - startupSecretRef
            - protocolVersion
            - activationId
            - requestedAt
            properties:
              assistantId:
                type: string
              userId:
                type: string
              medium:
                type: string
              desiredState:
                type: string
              desktop:
                type: object
                required:
                - required
                - mode
                properties:
                  required:
                    type: boolean
                  mode:
                    type: string
                  placement:
                    type: object
                    properties:
                      poolLocation:
                        type: string
                      region:
                        type: string
                      zone:
                        type: string
                      timezone:
                        type: string
                      resolution:
                        type: string
              startupSecretRef:
                type: string
              protocolVersion:
                type: string
              activationId:
                type: string
              requestedAt:
                type: string
              imageOverride:
                type: string
                description: |
                  Optional fully-qualified Unity container image URI.  When set,
                  the controller bypasses the staging idle pool and spawns a
                  fresh Job pinned to this image instead of inheriting
                  shared idle containers built from the canonical image.
              serviceUrls:
                type: object
                description: |
                  Peer service URLs that the Unity runtime should receive as
                  environment variables.  Preview Comms App revisions stamp
                  slugged peer URLs here so the singleton staging controller can
                  materialize the requested runtime environment.
                required:
                - orchestra
                - comms
                - adapters
                properties:
                  orchestra:
                    type: string
                  comms:
                    type: string
                  adapters:
                    type: string
          status:
            type: object
            properties:
              phase:
                type: string
              observedActivationId:
                type: string
              lastError:
                type: string
              bootstrapRetries:
                type: integer
              vmRetries:
                type: integer
              desktopProbeFailures:
                type: integer
              suspendIntent:
                type: object
                properties:
                  bindingId:
                    type: string
                  intent:
                    type: string
                  source:
                    type: string
                  sourceReason:
                    type: string
                  requestedAt:
                    type: string
                  jobName:
                    type: string
              signals:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              releasedBindings:
                type: array
                items:
                  type: object
                  properties:
                    bindingId:
                      type: string
                    releaseRequestedAt:
                      type: string
                    releaseCompletedAt:
                      type: string
              binding:
                type: object
                properties:
                  id:
                    type: string
                  jobRef:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                  podRef:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                  vmAssignment:
                    type: object
                    properties:
                      state:
                        type: string
                      attemptId:
                        type: string
                      observedAt:
                        type: string
                      message:
                        type: string
                  vmRef:
                    type: object
                    properties:
                      name:
                        type: string
                      hostname:
                        type: string
                      vmType:
                        type: string
                      poolLocation:
                        type: string
                      region:
                        type: string
                      zone:
                        type: string
                  desktopUrl:
                    type: string
                  desktopSecret:
                    type: string
                  createdAt:
                    type: string
                  containerBootstrapStartedAt:
                    type: string
                  containerReadyAt:
                    type: string
                  vmAssignedAt:
                    type: string
                  guestHandshakeStartedAt:
                    type: string
                  vmReadyObservedAt:
                    type: string
                  vmReadyHostname:
                    type: string
                  vmReadyMessageId:
                    type: string
                  releaseRequestedAt:
                    type: string
                  releaseCompletedAt:
                    type: string
                  releaseGeneration:
                    type: integer
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
    subresources:
      status: {}
