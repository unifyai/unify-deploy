apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: assistantsessions.infra.unify.ai
spec:
  group: infra.unify.ai
  scope: Namespaced
  names:
    plural: assistantsessions
    singular: assistantsession
    kind: AssistantSession
    shortNames:
    - asession
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Assistant
      type: string
      jsonPath: .spec.assistantId
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Job
      type: string
      jsonPath: .status.jobRef.name
    - name: VM
      type: string
      jsonPath: .status.vmRef.name
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - assistantId
            - userId
            - medium
            - desktopRequired
            - desktopMode
            - startupSecretRef
            - protocolVersion
            - activationId
            - requestedAt
            properties:
              assistantId:
                type: string
              userId:
                type: string
              medium:
                type: string
              desktopRequired:
                type: boolean
              desktopMode:
                type: string
              startupSecretRef:
                type: string
              protocolVersion:
                type: string
              activationId:
                type: string
              requestedAt:
                type: string
          status:
            type: object
            properties:
              phase:
                type: string
              observedActivationId:
                type: string
              desktopUrl:
                type: string
              lastError:
                type: string
              jobRef:
                type: object
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
              podRef:
                type: object
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
              vmRef:
                type: object
                properties:
                  name:
                    type: string
                  hostname:
                    type: string
                  vmType:
                    type: string
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
    subresources:
      status: {}
