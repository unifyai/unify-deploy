apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: assistantsessions.infra.unify.ai
spec:
  group: infra.unify.ai
  scope: Namespaced
  names:
    plural: assistantsessions
    singular: assistantsession
    kind: AssistantSession
    shortNames:
    - asession
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Assistant
      type: string
      jsonPath: .spec.assistantId
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Desired
      type: string
      jsonPath: .spec.desiredState
    - name: Binding
      type: string
      jsonPath: .status.binding.id
    - name: Job
      type: string
      jsonPath: .status.binding.jobRef.name
    - name: VM
      type: string
      jsonPath: .status.binding.vmRef.name
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - assistantId
            - userId
            - medium
            - desiredState
            - desktop
            - startupSecretRef
            - protocolVersion
            - activationId
            - requestedAt
            properties:
              assistantId:
                type: string
              userId:
                type: string
              medium:
                type: string
              desiredState:
                type: string
              desktop:
                type: object
                required:
                - required
                - mode
                properties:
                  required:
                    type: boolean
                  mode:
                    type: string
              startupSecretRef:
                type: string
              protocolVersion:
                type: string
              activationId:
                type: string
              requestedAt:
                type: string
          status:
            type: object
            properties:
              phase:
                type: string
              observedActivationId:
                type: string
              lastError:
                type: string
              bootstrapRetries:
                type: integer
              vmRetries:
                type: integer
              desktopProbeFailures:
                type: integer
              signals:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              binding:
                type: object
                properties:
                  id:
                    type: string
                  jobRef:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                  podRef:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                  vmRef:
                    type: object
                    properties:
                      name:
                        type: string
                      hostname:
                        type: string
                      vmType:
                        type: string
                  desktopUrl:
                    type: string
                  createdAt:
                    type: string
                  containerReadyAt:
                    type: string
                  vmAssignedAt:
                    type: string
                  vmReadyObservedAt:
                    type: string
                  vmReadyHostname:
                    type: string
                  vmReadyMessageId:
                    type: string
                  releaseRequestedAt:
                    type: string
                  releaseCompletedAt:
                    type: string
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
    subresources:
      status: {}
